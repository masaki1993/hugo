<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>森の木よけ</title>
    <link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Shippori+Mincho:wght@600;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            overflow: hidden;
            background: #0a1208;
            font-family: 'DotGothic16', sans-serif;
            touch-action: none;
        }

        #gameCanvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }

        .overlay {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(6, 14, 6, 0.82);
            z-index: 10;
            color: #e8f5d6;
            text-align: center;
            padding: 24px;
        }

        .overlay.hidden { display: none; }

        .overlay h1 {
            font-family: 'Shippori Mincho', serif;
            font-size: clamp(2rem, 6vw, 3.5rem);
            font-weight: 800;
            color: #b8e86a;
            text-shadow: 0 0 30px rgba(120, 200, 60, 0.5);
            margin-bottom: 12px;
            letter-spacing: 0.08em;
        }

        .overlay p {
            font-size: clamp(0.95rem, 2.5vw, 1.15rem);
            line-height: 1.8;
            opacity: 0.92;
            max-width: 420px;
        }

        .overlay .hint {
            margin-top: 28px;
            padding: 16px 24px;
            border: 1px solid rgba(184, 232, 106, 0.35);
            border-radius: 8px;
            background: rgba(20, 40, 16, 0.6);
            font-size: 0.95rem;
        }

        .overlay .hint kbd {
            display: inline-block;
            padding: 2px 8px;
            margin: 0 2px;
            background: rgba(184, 232, 106, 0.2);
            border: 1px solid rgba(184, 232, 106, 0.5);
            border-radius: 4px;
            font-family: inherit;
        }

        .btn {
            margin-top: 32px;
            padding: 14px 48px;
            font-family: 'Shippori Mincho', serif;
            font-size: 1.2rem;
            font-weight: 800;
            color: #0a1208;
            background: linear-gradient(180deg, #c8f070 0%, #8ec840 100%);
            border: none;
            border-radius: 999px;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(120, 200, 60, 0.4);
            transition: transform 0.15s, box-shadow 0.15s;
        }

        .btn:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 28px rgba(120, 200, 60, 0.55);
        }

        #hud {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            pointer-events: none;
            z-index: 5;
            color: #e8f5d6;
            text-shadow: 0 1px 4px rgba(0,0,0,0.8);
        }

        #hud .score { font-size: 1.4rem; color: #ffe566; }
        #hud .speed { font-size: 1rem; color: #b8e86a; }
        #hud .controls {
            font-size: 0.75rem;
            opacity: 0.75;
            text-align: right;
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>

    <div id="hud" class="hidden">
        <div>
            <div class="score">スコア: <span id="scoreVal">0</span></div>
            <div class="speed">スピード: <span id="speedVal">ふつう</span></div>
        </div>
        <div class="controls">
            ← → よける<br>
            ↑ スピードアップ<br>
            ↓ スピードダウン
        </div>
    </div>

    <div id="startScreen" class="overlay">
        <h1>🌲 森の木よけ</h1>
        <p>森の中を走って、木をよけよう！<br>たまに木が折れて落ちてくるよ。</p>
        <div class="hint">
            <kbd>←</kbd><kbd>→</kbd> よける<br>
            <kbd>↑</kbd> はやく　<kbd>↓</kbd> おそく
        </div>
        <button class="btn" id="startBtn">スタート</button>
    </div>

    <div id="gameOverScreen" class="overlay hidden">
        <h1>ゲームオーバー</h1>
        <p>スコア: <span id="finalScore">0</span></p>
        <button class="btn" id="restartBtn">もう一度</button>
    </div>

    <script>
    (function () {
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const startScreen = document.getElementById('startScreen');
        const gameOverScreen = document.getElementById('gameOverScreen');
        const hud = document.getElementById('hud');
        const scoreVal = document.getElementById('scoreVal');
        const speedVal = document.getElementById('speedVal');
        const finalScore = document.getElementById('finalScore');

        const SPEED_NAMES = ['おそい', 'ふつう', 'はやい'];
        const SPEED_MULT = [0.55, 1.0, 1.65];
        const SCORE_MULT = [1, 1.5, 2.2];

        let W, H, cx, horizonY, pathHalfW;
        let state = 'menu';
        let score = 0;
        let speedIndex = 1;
        let lastTime = 0;
        let spawnTimer = 0;
        let fallenTimer = 0;
        let shake = 0;
        let fogOffset = 0;

        const keys = {};
        const player = { x: 0, w: 36, h: 52, bob: 0 };
        const trees = [];
        const fallen = [];
        const sideTrees = [];
        const particles = [];

        function resize() {
            W = canvas.width = window.innerWidth;
            H = canvas.height = window.innerHeight;
            cx = W / 2;
            horizonY = H * 0.28;
            pathHalfW = Math.min(W * 0.38, 280);
            player.y = H - 90;
        }

        function resetGame() {
            score = 0;
            speedIndex = 1;
            spawnTimer = 0;
            fallenTimer = 3;
            shake = 0;
            trees.length = 0;
            fallen.length = 0;
            particles.length = 0;
            player.x = cx;
            initSideTrees();
            scoreVal.textContent = '0';
            speedVal.textContent = SPEED_NAMES[speedIndex];
        }

        function initSideTrees() {
            sideTrees.length = 0;
            for (let i = 0; i < 24; i++) {
                sideTrees.push({
                    side: i % 2 === 0 ? -1 : 1,
                    z: Math.random(),
                    offset: Math.random() * 0.4
                });
            }
        }

        function project(z, laneX) {
            const t = z;
            const y = horizonY + (player.y - horizonY) * t;
            const halfW = pathHalfW * t + 40;
            const x = cx + laneX * halfW;
            const scale = 0.15 + t * 0.85;
            return { x, y, scale, halfW };
        }

        function spawnTree() {
            const lane = (Math.random() - 0.5) * 1.6;
            if (trees.some(t => t.z < 0.15 && Math.abs(t.lane - lane) < 0.35)) return;
            trees.push({ lane, z: 0, w: 0.18 + Math.random() * 0.08 });
        }

        function spawnFallen() {
            const lane = (Math.random() - 0.5) * 1.35;
            fallen.push({
                lane,
                z: 0,
                fall: 0,
                side: lane < 0 ? 1 : -1,
                size: 0.75 + Math.random() * 0.2
            });
        }

        function addParticles(x, y, color, n) {
            for (let i = 0; i < n; i++) {
                particles.push({
                    x, y,
                    vx: (Math.random() - 0.5) * 6,
                    vy: (Math.random() - 0.5) * 6 - 2,
                    life: 0.4 + Math.random() * 0.4,
                    color
                });
            }
        }

        function playerHitbox() {
            return {
                x: player.x - player.w / 2,
                y: player.y - player.h,
                w: player.w,
                h: player.h
            };
        }

        function rectsOverlap(a, b) {
            return a.x < b.x + b.w && a.x + a.w > b.x &&
                   a.y < b.y + b.h && a.y + a.h > b.y;
        }

        function checkCollisions() {
            const ph = playerHitbox();
            const margin = 6;

            for (const t of trees) {
                if (t.z < 0.72) continue;
                const p = project(t.z, t.lane);
                const tw = 28 * p.scale * (t.w / 0.22);
                const th = 90 * p.scale;
                const box = {
                    x: p.x - tw / 2 + margin,
                    y: p.y - th,
                    w: tw - margin * 2,
                    h: th - 10
                };
                if (rectsOverlap(ph, box)) return true;
            }

            for (const f of fallen) {
                if (f.z < 0.72 || f.fall < 0.35) continue;
                const p = project(f.z, f.lane);
                const len = 78 * p.scale * f.size;
                const thick = 14 * p.scale;
                const reach = len * Math.min(f.fall, 1);
                const box = {
                    x: p.x - thick / 2 + Math.min(0, f.side * reach),
                    y: p.y - thick * 1.4,
                    w: Math.abs(reach) + thick,
                    h: thick * 2.8
                };
                if (rectsOverlap(ph, box)) return true;
            }
            return false;
        }

        function gameOver() {
            state = 'over';
            finalScore.textContent = Math.floor(score);
            hud.classList.add('hidden');
            gameOverScreen.classList.remove('hidden');
            shake = 12;
        }

        function update(dt) {
            if (state !== 'playing') return;

            const spd = SPEED_MULT[speedIndex];
            fogOffset += dt * spd * 30;

            if (keys['ArrowLeft'] || keys['KeyA']) player.x -= 320 * dt;
            if (keys['ArrowRight'] || keys['KeyD']) player.x += 320 * dt;

            const pNow = project(1, 0);
            const minX = cx - pNow.halfW + player.w / 2;
            const maxX = cx + pNow.halfW - player.w / 2;
            player.x = Math.max(minX, Math.min(maxX, player.x));
            player.bob += dt * 12 * spd;

            spawnTimer -= dt;
            if (spawnTimer <= 0) {
                spawnTree();
                spawnTimer = (0.7 + Math.random() * 0.8) / spd;
            }

            fallenTimer -= dt;
            if (fallenTimer <= 0) {
                spawnFallen();
                fallenTimer = (2.5 + Math.random() * 3) / spd;
            }

            for (let i = trees.length - 1; i >= 0; i--) {
                trees[i].z += dt * 0.55 * spd;
                if (trees[i].z >= 1.05) trees.splice(i, 1);
            }

            for (let i = fallen.length - 1; i >= 0; i--) {
                const f = fallen[i];
                f.z += dt * 0.5 * spd;
                if (f.z > 0.38) f.fall = Math.min(1, f.fall + dt * 1.6 * spd);
                if (f.z >= 1.08) fallen.splice(i, 1);
            }

            for (let i = particles.length - 1; i >= 0; i--) {
                const pt = particles[i];
                pt.x += pt.vx;
                pt.y += pt.vy;
                pt.vy += 0.3;
                pt.life -= dt;
                if (pt.life <= 0) particles.splice(i, 1);
            }

            score += dt * 80 * SCORE_MULT[speedIndex] * spd;
            scoreVal.textContent = Math.floor(score);

            if (checkCollisions()) {
                addParticles(player.x, player.y - player.h / 2, '#8B4513', 20);
                gameOver();
            }

            if (shake > 0) shake *= 0.88;
        }

        function drawSky() {
            const g = ctx.createLinearGradient(0, 0, 0, horizonY);
            g.addColorStop(0, '#1a2830');
            g.addColorStop(0.5, '#2a4030');
            g.addColorStop(1, '#3d5a32');
            ctx.fillStyle = g;
            ctx.fillRect(0, 0, W, horizonY + 20);

            ctx.fillStyle = 'rgba(200, 220, 180, 0.06)';
            for (let i = 0; i < 5; i++) {
                const fx = (Math.sin(fogOffset * 0.01 + i * 1.7) * 0.5 + 0.5) * W;
                const fy = horizonY * (0.3 + i * 0.12);
                ctx.beginPath();
                ctx.ellipse(fx, fy, 120 + i * 30, 25, 0, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function drawGround() {
            ctx.fillStyle = '#1a2810';
            ctx.fillRect(0, horizonY, W, H - horizonY);

            ctx.beginPath();
            ctx.moveTo(cx - pathHalfW - 60, horizonY);
            ctx.lineTo(cx + pathHalfW + 60, horizonY);
            ctx.lineTo(cx + pathHalfW * 1.15, H);
            ctx.lineTo(cx - pathHalfW * 1.15, H);
            ctx.closePath();
            const pg = ctx.createLinearGradient(cx, horizonY, cx, H);
            pg.addColorStop(0, '#3a5028');
            pg.addColorStop(0.4, '#2a4018');
            pg.addColorStop(1, '#1e3010');
            ctx.fillStyle = pg;
            ctx.fill();

            ctx.strokeStyle = 'rgba(90, 120, 60, 0.3)';
            ctx.lineWidth = 1;
            for (let i = 0; i < 12; i++) {
                const z1 = (i / 12 + fogOffset * 0.002) % 1;
                const z2 = z1 + 0.08;
                const a = project(z1, -1);
                const b = project(z1, 1);
                const c = project(z2, 1);
                const d = project(z2, -1);
                ctx.beginPath();
                ctx.moveTo(a.x, a.y);
                ctx.lineTo(b.x, b.y);
                ctx.lineTo(c.x, c.y);
                ctx.lineTo(d.x, d.y);
                ctx.closePath();
                ctx.stroke();
            }
        }

        function drawSideTree(st) {
            const z = (st.z + fogOffset * 0.0003) % 1;
            const lane = st.side * (1.1 + st.offset);
            const p = project(z, lane);
            drawTreeTrunk(p.x, p.y, p.scale * 0.9, 0.6, true);
        }

        function drawTreeTrunk(x, y, scale, widthMul, dim) {
            const tw = 22 * scale * widthMul;
            const th = 100 * scale;
            const alpha = dim ? 0.45 : 1;

            ctx.save();
            ctx.globalAlpha = alpha;

            ctx.fillStyle = '#2a1810';
            ctx.fillRect(x - tw / 2, y - th, tw, th);

            ctx.fillStyle = dim ? '#1a4020' : '#2d6b30';
            ctx.beginPath();
            ctx.moveTo(x, y - th - 35 * scale);
            ctx.lineTo(x - 30 * scale, y - th + 10 * scale);
            ctx.lineTo(x + 30 * scale, y - th + 10 * scale);
            ctx.closePath();
            ctx.fill();

            ctx.fillStyle = dim ? '#254a22' : '#3a8a38';
            ctx.beginPath();
            ctx.moveTo(x, y - th - 55 * scale);
            ctx.lineTo(x - 24 * scale, y - th - 15 * scale);
            ctx.lineTo(x + 24 * scale, y - th - 15 * scale);
            ctx.closePath();
            ctx.fill();

            ctx.restore();
        }

        function drawFallenTree(f) {
            const p = project(f.z, f.lane);
            const len = 86 * p.scale * f.size;
            const thick = 11 * p.scale;
            const fall = Math.min(f.fall, 1);
            const fallAngle = f.side * fall * 1.28;

            ctx.save();
            ctx.translate(p.x, p.y);
            ctx.rotate(fallAngle);

            ctx.fillStyle = '#4a2818';
            ctx.fillRect(-thick / 2, -len, thick, len);

            ctx.fillStyle = '#2d5018';
            ctx.beginPath();
            ctx.arc(0, -len, 18 * p.scale * f.size, 0, Math.PI * 2);
            ctx.fill();

            if (fall > 0.1 && fall < 0.85) {
                ctx.fillStyle = 'rgba(120, 80, 40, 0.4)';
                ctx.beginPath();
                ctx.arc(0, 4 * p.scale, 12 * p.scale, 0, Math.PI * 2);
                ctx.fill();
            }

            ctx.restore();

            if (f.z > 0.28 && f.z < 0.55) {
                ctx.fillStyle = 'rgba(255, 220, 120, 0.45)';
                ctx.font = `${Math.max(12, 18 * p.scale)}px DotGothic16`;
                ctx.fillText('パキッ', p.x - 18 * p.scale, p.y - len - 22 * p.scale);
            }
        }

        function drawPlayer() {
            const bobY = Math.sin(player.bob) * 3;
            const px = player.x;
            const py = player.y + bobY;

            ctx.save();
            ctx.translate(px, py);

            ctx.fillStyle = 'rgba(0,0,0,0.25)';
            ctx.beginPath();
            ctx.ellipse(0, 2, player.w * 0.45, 8, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#e85d4a';
            ctx.fillRect(-14, -player.h + 18, 28, 22);

            ctx.fillStyle = '#f5cBA8';
            ctx.beginPath();
            ctx.arc(0, -player.h + 12, 12, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#3a3028';
            ctx.fillRect(-12, -player.h + 2, 24, 8);

            const legSwing = Math.sin(player.bob * 1.5) * 8;
            ctx.fillStyle = '#2a4060';
            ctx.fillRect(-10 + legSwing * 0.3, -18, 8, 18);
            ctx.fillRect(2 - legSwing * 0.3, -18, 8, 18);

            ctx.fillStyle = '#f5cBA8';
            ctx.fillRect(-16, -player.h + 20, 8, 14);
            ctx.fillRect(8, -player.h + 20, 8, 14);

            ctx.restore();
        }

        function drawSpeedLines() {
            if (speedIndex < 2) return;
            ctx.strokeStyle = 'rgba(200, 255, 150, 0.08)';
            ctx.lineWidth = 2;
            for (let i = 0; i < 8; i++) {
                const x = (i / 8) * W + (fogOffset * 2) % (W / 8);
                ctx.beginPath();
                ctx.moveTo(x, horizonY);
                ctx.lineTo(x + (x - cx) * 0.08, H);
                ctx.stroke();
            }
        }

        function drawParticles() {
            for (const pt of particles) {
                ctx.globalAlpha = pt.life;
                ctx.fillStyle = pt.color;
                ctx.fillRect(pt.x - 3, pt.y - 3, 6, 6);
            }
            ctx.globalAlpha = 1;
        }

        function render() {
            ctx.save();
            if (shake > 0.5) {
                ctx.translate(
                    (Math.random() - 0.5) * shake,
                    (Math.random() - 0.5) * shake
                );
            }

            drawSky();
            drawGround();
            drawSpeedLines();

            sideTrees.forEach(drawSideTree);

            trees.sort((a, b) => a.z - b.z);
            for (const t of trees) {
                const p = project(t.z, t.lane);
                drawTreeTrunk(p.x, p.y, p.scale * (t.w / 0.22), 1, false);
            }

            for (const f of fallen) drawFallenTree(f);

            if (state === 'playing' || state === 'over') drawPlayer();
            drawParticles();

            ctx.restore();
        }

        function loop(time) {
            const dt = Math.min((time - lastTime) / 1000, 0.05);
            lastTime = time;
            update(dt);
            render();
            requestAnimationFrame(loop);
        }

        function startGame() {
            resetGame();
            state = 'playing';
            startScreen.classList.add('hidden');
            gameOverScreen.classList.add('hidden');
            hud.classList.remove('hidden');
        }

        window.addEventListener('keydown', e => {
            keys[e.code] = true;
            if (e.code === 'ArrowUp') {
                e.preventDefault();
                if (state === 'playing' && speedIndex < 2) {
                    speedIndex++;
                    speedVal.textContent = SPEED_NAMES[speedIndex];
                }
            }
            if (e.code === 'ArrowDown') {
                e.preventDefault();
                if (state === 'playing' && speedIndex > 0) {
                    speedIndex--;
                    speedVal.textContent = SPEED_NAMES[speedIndex];
                }
            }
            if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.code)) {
                e.preventDefault();
            }
        });

        window.addEventListener('keyup', e => { keys[e.code] = false; });

        document.getElementById('startBtn').addEventListener('click', startGame);
        document.getElementById('restartBtn').addEventListener('click', startGame);

        window.addEventListener('resize', resize);
        resize();
        initSideTrees();
        requestAnimationFrame(loop);
    })();
    </script>
</body>
</html>
