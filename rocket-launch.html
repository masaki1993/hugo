<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rocket Launch</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b1020; font-family: "Segoe UI", system-ui, sans-serif; color: #fff; }
  canvas { display: block; }
  #hud { position: fixed; inset: 0; pointer-events: none; }
  #count { position: absolute; top: 7%; width: 100%; text-align: center; font-size: clamp(36px, 8vw, 84px); font-weight: 800; letter-spacing: 2px; text-shadow: 0 0 30px rgba(255,140,40,.8), 0 4px 10px rgba(0,0,0,.6); opacity: 0; transition: opacity .3s; }
  #stats { position: absolute; left: 16px; bottom: 16px; font: 600 14px/1.5 ui-monospace, Menlo, Consolas, monospace; background: rgba(0,0,0,.35); padding: 8px 12px; border-radius: 8px; opacity: 0; transition: opacity .5s; }
  #title { position: absolute; top: 16px; left: 16px; font-weight: 700; font-size: 18px; text-shadow: 0 2px 6px rgba(0,0,0,.6); }
  .btn { pointer-events: auto; position: absolute; left: 50%; bottom: 12%; transform: translateX(-50%); font-size: 26px; font-weight: 800; padding: 16px 40px; border: none; border-radius: 50px; color: #fff; background: linear-gradient(135deg, #e53935, #1e4fd8); box-shadow: 0 8px 24px rgba(0,0,0,.4); cursor: pointer; transition: transform .15s; }
  .btn:hover { transform: translateX(-50%) scale(1.06); }
  .hidden { display: none; }
  #back { pointer-events: auto; position: absolute; top: 14px; right: 16px; color: #fff; text-decoration: none; font-weight: 600; background: rgba(0,0,0,.35); padding: 6px 14px; border-radius: 20px; }
</style>
</head>
<body>
<div id="hud">
  <div id="title">🚀 Décollage de fusée</div>
  <a id="back" href="index.html">← Jeux</a>
  <div id="count"></div>
  <div id="stats"></div>
  <button id="launch" class="btn">🚀 Lancer !</button>
  <button id="replay" class="btn hidden">↻ Rejouer</button>
</div>

<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

// ---------------------------------------------------------------- renderer / scene
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
const HORIZON = new THREE.Color(0xf2b27a);
scene.fog = new THREE.Fog(HORIZON, 250, 1800);

const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.5, 30000);
const CAM_HOME = new THREE.Vector3(42, 9, 52);
camera.position.copy(CAM_HOME);

// ---------------------------------------------------------------- sky (follows camera, always behind)
const skyMat = new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false, depthTest: false, fog: false,
  uniforms: { top: { value: new THREE.Color(0x0d1b3d) }, mid: { value: new THREE.Color(0x4a6aa8) }, horizon: { value: HORIZON }, sunDir: { value: new THREE.Vector3(0.6, 0.08, -0.8).normalize() } },
  vertexShader: `varying vec3 vDir; void main(){ vDir = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
  fragmentShader: `uniform vec3 top, mid, horizon, sunDir; varying vec3 vDir;
    void main(){ float h = vDir.y;
      vec3 c = mix(horizon, mid, smoothstep(0.0, 0.25, h));
      c = mix(c, top, smoothstep(0.2, 0.9, h));
      c = mix(c, horizon * 0.55, smoothstep(0.0, -0.1, h));
      float s = max(dot(vDir, sunDir), 0.0);
      c += vec3(1.0, 0.6, 0.3) * (pow(s, 8.0) * 0.35 + pow(s, 600.0) * 2.0);
      gl_FragColor = vec4(c, 1.0); }`
});
const sky = new THREE.Mesh(new THREE.SphereGeometry(1000, 32, 16), skyMat);
sky.renderOrder = -10;
scene.add(sky);

// stars, faint, high in the sky
{
  const n = 1500, p = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) {
    const u = Math.random() * Math.PI * 2, v = 0.25 + Math.random() * 0.75;
    const r = Math.sqrt(1 - v * v);
    p.set([Math.cos(u) * r * 900, v * 900, Math.sin(u) * r * 900], i * 3);
  }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(p, 3));
  const stars = new THREE.Points(g, new THREE.PointsMaterial({ size: 1.5, sizeAttenuation: false, color: 0xffffff, transparent: true, opacity: 0.55, depthWrite: false, depthTest: false, fog: false }));
  stars.renderOrder = -9;
  sky.add(stars);
}

// ---------------------------------------------------------------- lights
scene.add(new THREE.HemisphereLight(0x9fb6ff, 0x3a2a1e, 0.9));
const sun = new THREE.DirectionalLight(0xffc48a, 2.0);
sun.position.set(60, 25, -80);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -40, right: 40, top: 50, bottom: -20, near: 1, far: 250 });
scene.add(sun);
const fireLight = new THREE.PointLight(0xff8a2a, 0, 120, 1.6);
scene.add(fireLight);

// ---------------------------------------------------------------- ground & surroundings
const ground = new THREE.Mesh(new THREE.PlaneGeometry(6000, 6000), new THREE.MeshStandardMaterial({ color: 0x4d5a36, roughness: 1 }));
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);
const apron = new THREE.Mesh(new THREE.CircleGeometry(60, 64), new THREE.MeshStandardMaterial({ color: 0x8b8a84, roughness: 0.95 }));
apron.rotation.x = -Math.PI / 2; apron.position.y = 0.02; apron.receiveShadow = true; scene.add(apron);
// access road
const road = new THREE.Mesh(new THREE.PlaneGeometry(8, 900), new THREE.MeshStandardMaterial({ color: 0x55534f, roughness: 1 }));
road.rotation.x = -Math.PI / 2; road.position.set(0, 0.03, 500); scene.add(road);
// distant sea + hills silhouettes
const sea = new THREE.Mesh(new THREE.PlaneGeometry(6000, 3000), new THREE.MeshStandardMaterial({ color: 0x2e4c7a, roughness: 0.25, metalness: 0.3 }));
sea.rotation.x = -Math.PI / 2; sea.position.set(0, 0.05, -2200); scene.add(sea);
{
  const hillMat = new THREE.MeshStandardMaterial({ color: 0x3c4a33, roughness: 1, flatShading: true });
  for (let i = 0; i < 26; i++) {
    const a = Math.PI * 0.15 + Math.random() * Math.PI * 1.3; // behind camera side mostly
    const d = 700 + Math.random() * 600;
    const h = new THREE.Mesh(new THREE.ConeGeometry(80 + Math.random() * 120, 30 + Math.random() * 60, 7), hillMat);
    h.position.set(Math.cos(a) * d, 10, Math.sin(a) * d); scene.add(h);
  }
  // a distant assembly building and a second pad tower, generic shapes
  const bMat = new THREE.MeshStandardMaterial({ color: 0xcfcac0, roughness: 0.9 });
  const vab = new THREE.Mesh(new THREE.BoxGeometry(60, 80, 50), bMat);
  vab.position.set(-260, 40, 380); vab.castShadow = true; scene.add(vab);
  const door = new THREE.Mesh(new THREE.PlaneGeometry(18, 60), new THREE.MeshStandardMaterial({ color: 0x5a5d66 }));
  door.position.set(-260, 32, 405.1); scene.add(door);
  for (let i = 0; i < 6; i++) {
    const tank = new THREE.Mesh(new THREE.SphereGeometry(5, 20, 12), new THREE.MeshStandardMaterial({ color: 0xeeeeee, roughness: 0.4 }));
    tank.position.set(55 + (i % 3) * 13, 6, -30 + Math.floor(i / 3) * 14); tank.castShadow = true; scene.add(tank);
    const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.4, 2), new THREE.MeshStandardMaterial({ color: 0x777777 }));
    leg.position.set(tank.position.x, 1, tank.position.z); scene.add(leg);
  }
  // lightning masts
  for (const [x, z] of [[-30, -28], [26, -32], [-34, 22], [32, -6]]) {
    const m = new THREE.Mesh(new THREE.CylinderGeometry(0.25, 0.6, 50, 8), new THREE.MeshStandardMaterial({ color: 0xdddddd }));
    m.position.set(x, 25, z); m.castShadow = true; scene.add(m);
  }
}

// ---------------------------------------------------------------- launch platform
const PAD_TOP = 4;
const concrete = new THREE.MeshStandardMaterial({ color: 0xa9a59c, roughness: 0.9 });
const darkMat = new THREE.MeshStandardMaterial({ color: 0x1d1d1f, roughness: 1 });
const steelGrey = new THREE.MeshStandardMaterial({ color: 0x6f7378, roughness: 0.6, metalness: 0.5 });
function box(w, h, d, mat, x, y, z) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  m.position.set(x, y, z); m.castShadow = true; m.receiveShadow = true; scene.add(m); return m;
}
// two side blocks + deck bridges leave a flame trench running along z
box(10, PAD_TOP, 26, concrete, -8, PAD_TOP / 2, 0);
box(10, PAD_TOP, 26, concrete, 8, PAD_TOP / 2, 0);
box(6, 1, 9, concrete, 0, PAD_TOP - 0.5, -8.5);
box(6, 1, 9, concrete, 0, PAD_TOP - 0.5, 8.5);
box(6, 0.3, 26, darkMat, 0, 0.15, 0);                       // trench floor
const deflector = new THREE.Mesh(new THREE.ConeGeometry(3, 2.6, 4), steelGrey); // flame deflector wedge
deflector.rotation.y = Math.PI / 4; deflector.scale.set(1, 1, 0.5); deflector.position.set(0, 1.3, 0); scene.add(deflector);
// ramp edges + yellow safety stripes
const yellow = new THREE.MeshStandardMaterial({ color: 0xf2c230, roughness: 0.7 });
box(26, 0.06, 0.5, yellow, 0, PAD_TOP + 0.03, 12.6);
box(26, 0.06, 0.5, yellow, 0, PAD_TOP + 0.03, -12.6);
// hold-down clamps around the opening
for (const [x, z] of [[-2.6, -2.6], [2.6, -2.6], [-2.6, 2.6], [2.6, 2.6]]) box(0.7, 1.3, 0.7, steelGrey, x, PAD_TOP + 0.65, z);

// ---------------------------------------------------------------- launch tower (lattice)
const towerMat = new THREE.MeshStandardMaterial({ color: 0xc8432b, roughness: 0.6, metalness: 0.3 });
const TOWER_X = -8, TOWER_W = 3.2, TOWER_H = 40;
function latticeBeams(list) {
  const geo = new THREE.BoxGeometry(1, 1, 1);
  const mesh = new THREE.InstancedMesh(geo, towerMat, list.length);
  const up = new THREE.Vector3(0, 1, 0), m = new THREE.Matrix4(), q = new THREE.Quaternion(), s = new THREE.Vector3();
  list.forEach(([a, b, t], i) => {
    const dir = b.clone().sub(a), len = dir.length();
    q.setFromUnitVectors(up, dir.normalize());
    s.set(t, len, t);
    m.compose(a.clone().add(b).multiplyScalar(0.5), q, s);
    mesh.setMatrixAt(i, m);
  });
  mesh.castShadow = true; mesh.receiveShadow = true;
  return mesh;
}
{
  const beams = [], V = (x, y, z) => new THREE.Vector3(x, y, z), hw = TOWER_W / 2, seg = 2.5;
  const corners = [[-hw, -hw], [hw, -hw], [hw, hw], [-hw, hw]];
  for (const [cx, cz] of corners) beams.push([V(TOWER_X + cx, PAD_TOP, cz), V(TOWER_X + cx, PAD_TOP + TOWER_H, cz), 0.35]);
  for (let y = PAD_TOP; y < PAD_TOP + TOWER_H - 0.01; y += seg) {
    for (let k = 0; k < 4; k++) {
      const [ax, az] = corners[k], [bx, bz] = corners[(k + 1) % 4];
      beams.push([V(TOWER_X + ax, y + seg, az), V(TOWER_X + bx, y + seg, bz), 0.18]);
      const flip = (Math.round(y / seg) % 2) ? 1 : 0;
      beams.push([V(TOWER_X + (flip ? ax : bx), y, flip ? az : bz), V(TOWER_X + (flip ? bx : ax), y + seg, flip ? bz : az), 0.12]);
    }
  }
  scene.add(latticeBeams(beams));
  // elevator shaft core + roof + mast
  box(1.4, TOWER_H, 1.4, new THREE.MeshStandardMaterial({ color: 0x8a8f96, roughness: 0.7 }), TOWER_X, PAD_TOP + TOWER_H / 2, 0);
  box(TOWER_W + 0.6, 0.4, TOWER_W + 0.6, towerMat, TOWER_X, PAD_TOP + TOWER_H + 0.2, 0);
  const mast = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.22, 10, 6), steelGrey);
  mast.position.set(TOWER_X, PAD_TOP + TOWER_H + 5.4, 0); scene.add(mast);
}
// blinking red warning lights on tower
const warnLights = [];
for (const y of [PAD_TOP + 15, PAD_TOP + 30, PAD_TOP + TOWER_H + 10.4]) {
  const l = new THREE.Mesh(new THREE.SphereGeometry(0.25, 8, 6), new THREE.MeshBasicMaterial({ color: 0xff2020 }));
  l.position.set(TOWER_X, y, y > PAD_TOP + TOWER_H ? 0 : TOWER_W / 2 + 0.1); scene.add(l); warnLights.push(l);
}

// service arms that swing away before liftoff
const arms = [];
function makeArm(y, withRoom) {
  const pivot = new THREE.Group();
  pivot.position.set(TOWER_X + TOWER_W / 2, y, TOWER_W / 2 - 0.2);
  const len = (0 - 1.55) - (TOWER_X + TOWER_W / 2);
  const V = (x, yy, z) => new THREE.Vector3(x, yy, z), beams = [];
  for (const dz of [0, -1.2]) {
    beams.push([V(0, 0, dz), V(len, 0, dz), 0.18]);
    beams.push([V(0, 1.2, dz), V(len, 1.2, dz), 0.18]);
    for (let x = 0; x < len; x += 1.2) beams.push([V(x, 0, dz), V(x + 1.2, 1.2, dz), 0.1]);
  }
  const g = latticeBeams(beams); pivot.add(g);
  if (withRoom) {
    const room = new THREE.Mesh(new THREE.BoxGeometry(1.6, 2.2, 1.8), new THREE.MeshStandardMaterial({ color: 0xf2f2f2, roughness: 0.6 }));
    room.position.set(len - 0.8, 1.1, -0.6); room.castShadow = true; pivot.add(room);
  } else {
    const umb = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.12, 2.5, 6), darkMat); // umbilical hose
    umb.rotation.z = Math.PI / 2; umb.position.set(len - 1, 0.3, -0.6); pivot.add(umb);
  }
  scene.add(pivot);
  arms.push({ pivot, delay: arms.length * 0.4 });
}
makeArm(PAD_TOP + 9, false);
makeArm(PAD_TOP + 19, false);
makeArm(PAD_TOP + 26, true);

// ---------------------------------------------------------------- rocket
const rocket = new THREE.Group();
const ROCKET_BASE_Y = PAD_TOP + 0.6;
{
  const white = new THREE.MeshStandardMaterial({ color: 0xf6f6f4, roughness: 0.35, metalness: 0.05 });
  const red = new THREE.MeshStandardMaterial({ color: 0xd61f26, roughness: 0.4 });
  const blue = new THREE.MeshStandardMaterial({ color: 0x1f47c4, roughness: 0.4 });
  const metal = new THREE.MeshStandardMaterial({ color: 0x3b3d42, roughness: 0.35, metalness: 0.9 });
  const R = 1.5, BODY_H = 22, BODY_Y = 1;
  const add = (geo, mat, y) => { const m = new THREE.Mesh(geo, mat); m.position.y = y; m.castShadow = true; m.receiveShadow = true; rocket.add(m); return m; };

  add(new THREE.CylinderGeometry(R, R, BODY_H, 48), white, BODY_Y + BODY_H / 2);
  // nose cone (ogive) via lathe
  const nose = [];
  for (let i = 0; i <= 24; i++) { const t = i / 24; nose.push(new THREE.Vector2(R * Math.sqrt(1 - t * t) * (1 - 0.05 * t) + 0.001, t * 7)); }
  add(new THREE.LatheGeometry(nose, 48), red, BODY_Y + BODY_H);
  // stripes (red + blue bands)
  const band = (y, h, mat) => add(new THREE.CylinderGeometry(R + 0.02, R + 0.02, h, 48, 1, true), mat, y);
  band(BODY_Y + BODY_H - 1.2, 1.0, blue);
  band(BODY_Y + BODY_H - 2.4, 1.0, red);
  band(BODY_Y + 13.5, 0.6, red);
  band(BODY_Y + 12.7, 0.6, blue);
  band(BODY_Y + 4.0, 1.0, blue);
  band(BODY_Y + 2.8, 1.0, red);
  // small window / emblem panel
  const emblem = add(new THREE.CircleGeometry(0.45, 24), blue, BODY_Y + 17);
  emblem.position.z = R + 0.03;
  const star = add(new THREE.CircleGeometry(0.22, 5), white, BODY_Y + 17);
  star.position.z = R + 0.04;
  // engine skirt + nozzle
  add(new THREE.CylinderGeometry(R, R * 0.9, 1.0, 48), metal, BODY_Y - 0.5 + 0.01);
  add(new THREE.CylinderGeometry(0.55, 1.0, 1.6, 32, 1, true), metal, -0.6 + 0.8);
  // fins
  const finShape = new THREE.Shape();
  finShape.moveTo(0, 0); finShape.lineTo(2.4, -1.4); finShape.lineTo(2.4, 1.0); finShape.lineTo(0, 6); finShape.lineTo(0, 0);
  const finGeo = new THREE.ExtrudeGeometry(finShape, { depth: 0.18, bevelEnabled: true, bevelThickness: 0.04, bevelSize: 0.04, bevelSegments: 2 });
  finGeo.translate(0, 0, -0.09);
  for (let i = 0; i < 4; i++) {
    const f = new THREE.Mesh(finGeo, red);
    const a = i * Math.PI / 2 + Math.PI / 4;
    f.position.set(Math.cos(a) * (R - 0.05), BODY_Y + 0.4, -Math.sin(a) * (R - 0.05));
    f.rotation.y = a; f.castShadow = true;
    rocket.add(f);
  }
}
rocket.position.set(0, ROCKET_BASE_Y, 0);
scene.add(rocket);

// exhaust flame meshes (attached to rocket, cone pointing down)
const flameMat = (inner) => new THREE.ShaderMaterial({
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.DoubleSide, fog: false,
  uniforms: { time: { value: 0 }, power: { value: 0 }, inner: { value: inner ? 1 : 0 } },
  vertexShader: `varying vec2 vUv; varying vec3 vN; varying vec3 vV;
    void main(){ vUv = uv; vec4 mv = modelViewMatrix * vec4(position,1.0);
      vN = normalize(normalMatrix * normal); vV = normalize(-mv.xyz); gl_Position = projectionMatrix * mv; }`,
  fragmentShader: `uniform float time, power, inner; varying vec2 vUv; varying vec3 vN; varying vec3 vV;
    float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7))) * 43758.5453); }
    float noise(vec2 p){ vec2 i=floor(p), f=fract(p); f=f*f*(3.0-2.0*f);
      return mix(mix(hash(i),hash(i+vec2(1,0)),f.x), mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),f.x), f.y); }
    void main(){
      float v = vUv.y;                      // 1 at nozzle, 0 at tail
      float n = noise(vec2(vUv.x * 12.0, v * 6.0 + time * 18.0));
      float a = pow(v, inner > 0.5 ? 2.2 : 1.3) * (0.65 + 0.5 * n);
      float rim = pow(abs(dot(vN, vV)), 1.4);
      a *= rim * power;
      vec3 hot = inner > 0.5 ? vec3(1.0, 0.97, 0.85) : vec3(1.0, 0.75, 0.3);
      vec3 cool = inner > 0.5 ? vec3(1.0, 0.7, 0.3) : vec3(1.0, 0.25, 0.05);
      vec3 c = mix(cool, hot, smoothstep(0.2, 0.9, v));
      gl_FragColor = vec4(c * 1.6, a);
    }`
});
function flameCone(rTop, rBot, mat) {
  const g = new THREE.CylinderGeometry(rTop, rBot, 1, 32, 1, true);
  g.translate(0, -0.5, 0);
  const m = new THREE.Mesh(g, mat); m.position.y = -0.6; m.renderOrder = 5; rocket.add(m); return m;
}
const outerFlame = flameCone(0.95, 0.35, flameMat(false));
const innerFlame = flameCone(0.6, 0.1, flameMat(true));
const flameGlow = new THREE.Sprite(new THREE.SpriteMaterial({
  map: (() => { const c = document.createElement('canvas'); c.width = c.height = 128; const x = c.getContext('2d');
    const g = x.createRadialGradient(64, 64, 0, 64, 64, 64); g.addColorStop(0, 'rgba(255,240,200,1)'); g.addColorStop(0.25, 'rgba(255,160,60,.6)'); g.addColorStop(1, 'rgba(255,80,0,0)');
    x.fillStyle = g; x.fillRect(0, 0, 128, 128); return new THREE.CanvasTexture(c); })(),
  blending: THREE.AdditiveBlending, depthWrite: false, transparent: true, fog: false
}));
flameGlow.position.y = -1.5; flameGlow.renderOrder = 6; rocket.add(flameGlow);

// ---------------------------------------------------------------- particle system
const puffTex = (() => {
  const c = document.createElement('canvas'); c.width = c.height = 128; const x = c.getContext('2d');
  for (let i = 0; i < 22; i++) {
    const r = 18 + Math.random() * 26, px = 64 + (Math.random() - 0.5) * 50, py = 64 + (Math.random() - 0.5) * 50;
    const g = x.createRadialGradient(px, py, 0, px, py, r);
    g.addColorStop(0, 'rgba(255,255,255,0.55)'); g.addColorStop(1, 'rgba(255,255,255,0)');
    x.fillStyle = g; x.beginPath(); x.arc(px, py, r, 0, 7); x.fill();
  }
  const t = new THREE.CanvasTexture(c); return t;
})();

class Particles {
  constructor(max, additive) {
    this.max = max; this.next = 0;
    this.pos = new Float32Array(max * 3); this.vel = new Float32Array(max * 3);
    this.col = new Float32Array(max * 3); this.size = new Float32Array(max); this.alpha = new Float32Array(max); this.rot = new Float32Array(max);
    this.life = new Float32Array(max); this.maxLife = new Float32Array(max).fill(1); this.alive = new Uint8Array(max);
    this.s0 = new Float32Array(max); this.s1 = new Float32Array(max); this.a0 = new Float32Array(max);
    this.c0 = new Float32Array(max * 3); this.c1 = new Float32Array(max * 3); this.drag = new Float32Array(max); this.buoy = new Float32Array(max);
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(this.pos, 3).setUsage(THREE.DynamicDrawUsage));
    g.setAttribute('aColor', new THREE.BufferAttribute(this.col, 3).setUsage(THREE.DynamicDrawUsage));
    g.setAttribute('aSize', new THREE.BufferAttribute(this.size, 1).setUsage(THREE.DynamicDrawUsage));
    g.setAttribute('aAlpha', new THREE.BufferAttribute(this.alpha, 1).setUsage(THREE.DynamicDrawUsage));
    g.setAttribute('aRot', new THREE.BufferAttribute(this.rot, 1));
    this.geo = g;
    this.mat = new THREE.ShaderMaterial({
      transparent: true, depthWrite: false, fog: false,
      blending: additive ? THREE.AdditiveBlending : THREE.NormalBlending,
      uniforms: { scale: { value: 1 }, map: { value: puffTex }, additive: { value: additive ? 1 : 0 } },
      vertexShader: `attribute vec3 aColor; attribute float aSize, aAlpha, aRot; uniform float scale;
        varying vec3 vC; varying float vA, vR;
        void main(){ vC = aColor; vA = aAlpha; vR = aRot; vec4 mv = modelViewMatrix * vec4(position,1.0);
          gl_PointSize = min(aSize * scale / max(-mv.z, 0.1), 2048.0); gl_Position = projectionMatrix * mv; }`,
      fragmentShader: `uniform sampler2D map; uniform float additive; varying vec3 vC; varying float vA, vR;
        void main(){ vec2 p = gl_PointCoord - 0.5; float c = cos(vR), s = sin(vR);
          p = vec2(c*p.x - s*p.y, s*p.x + c*p.y);
          float d = length(p) * 2.0;
          float a = additive > 0.5 ? pow(max(1.0 - d, 0.0), 1.6) : texture2D(map, p + 0.5).a * smoothstep(1.0, 0.6, d) * 1.6;
          a *= vA; if (a < 0.003) discard; gl_FragColor = vec4(vC, a); }`
    });
    this.points = new THREE.Points(g, this.mat);
    this.points.frustumCulled = false;
    this.points.renderOrder = additive ? 4 : 3;
    scene.add(this.points);
  }
  emit(p, v, life, s0, s1, c0, c1, a0, drag = 0, buoy = 0) {
    const i = this.next; this.next = (this.next + 1) % this.max;
    this.pos.set([p.x, p.y, p.z], i * 3); this.vel.set([v.x, v.y, v.z], i * 3);
    this.c0.set(c0, i * 3); this.c1.set(c1, i * 3);
    this.life[i] = 0; this.maxLife[i] = life; this.s0[i] = s0; this.s1[i] = s1; this.a0[i] = a0;
    this.drag[i] = drag; this.buoy[i] = buoy; this.alive[i] = 1; this.rot[i] = Math.random() * 6.28;
  }
  update(dt) {
    for (let i = 0; i < this.max; i++) {
      if (!this.alive[i]) continue;
      const L = (this.life[i] += dt), t = L / this.maxLife[i];
      if (t >= 1) { this.alive[i] = 0; this.alpha[i] = 0; this.size[i] = 0; continue; }
      const k = Math.exp(-this.drag[i] * dt), j = i * 3;
      this.vel[j] *= k; this.vel[j + 1] = this.vel[j + 1] * k + this.buoy[i] * dt; this.vel[j + 2] *= k;
      this.pos[j] += this.vel[j] * dt; this.pos[j + 1] += this.vel[j + 1] * dt; this.pos[j + 2] += this.vel[j + 2] * dt;
      if (this.pos[j + 1] < 0.3) { this.pos[j + 1] = 0.3; this.vel[j + 1] = Math.abs(this.vel[j + 1]) * 0.2; }
      const e = 1 - Math.pow(1 - t, 2.2);
      this.size[i] = this.s0[i] + (this.s1[i] - this.s0[i]) * e;
      this.alpha[i] = this.a0[i] * Math.min(1, t * 8) * (1 - t) * (1 - t * 0.3);
      for (let c = 0; c < 3; c++) this.col[j + c] = this.c0[j + c] + (this.c1[j + c] - this.c0[j + c]) * Math.min(1, t * 2.5);
    }
    for (const n of ['position', 'aColor', 'aSize', 'aAlpha']) this.geo.attributes[n].needsUpdate = true;
  }
  reset() { this.alive.fill(0); this.alpha.fill(0); this.size.fill(0); this.geo.attributes.aRot.needsUpdate = true; }
}
const smoke = new Particles(9000, false);
const fire = new Particles(5000, true);

// ---------------------------------------------------------------- sound (synth rumble)
let audio = null;
function startAudio() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const buf = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate), d = buf.getChannelData(0);
    let last = 0; for (let i = 0; i < d.length; i++) { last = (last + 0.02 * (Math.random() * 2 - 1)) / 1.02; d[i] = last * 3.5; }
    const src = ctx.createBufferSource(); src.buffer = buf; src.loop = true;
    const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 400;
    const gain = ctx.createGain(); gain.gain.value = 0;
    src.connect(lp).connect(gain).connect(ctx.destination); src.start();
    audio = { ctx, gain, lp };
  } catch (e) { audio = null; }
}
function setRumble(v, f) { if (!audio) return; audio.gain.gain.setTargetAtTime(v, audio.ctx.currentTime, 0.15); audio.lp.frequency.setTargetAtTime(f, audio.ctx.currentTime, 0.3); }

// ---------------------------------------------------------------- timeline
const COUNT_START = 0, IGNITION = 7, LIFTOFF = 10, END = LIFTOFF + 30;
let state = 'idle', t0 = 0, simT = 0;
const countEl = document.getElementById('count'), statsEl = document.getElementById('stats');
const launchBtn = document.getElementById('launch'), replayBtn = document.getElementById('replay');

const rocketVel = new THREE.Vector3();
const heading = new THREE.Vector3(0, 1, 0);
const FLY_DIR = new THREE.Vector3(-0.75, 0, -0.66).normalize();  // downrange, away from camera
const lookTarget = new THREE.Vector3(0, 16, 0);
const prevNozzle = new THREE.Vector3();

function resetScene() {
  rocket.position.set(0, ROCKET_BASE_Y, 0); rocket.quaternion.identity();
  heading.set(0, 1, 0); rocketVel.set(0, 0, 0);
  arms.forEach(a => a.pivot.rotation.y = 0);
  smoke.reset(); fire.reset();
  camera.position.copy(CAM_HOME); camera.fov = 50; camera.updateProjectionMatrix();
  lookTarget.set(0, 16, 0);
  outerFlame.material.uniforms.power.value = 0; innerFlame.material.uniforms.power.value = 0; flameGlow.material.opacity = 0;
  outerFlame.visible = innerFlame.visible = flameGlow.visible = false;
  fireLight.intensity = 0; countEl.style.opacity = 0; statsEl.style.opacity = 0;
  prevNozzle.set(0, ROCKET_BASE_Y - 0.8, 0);
}
resetScene();

function start() {
  if (!audio) startAudio(); else audio.ctx.resume();
  resetScene(); state = 'run'; simT = 0;
  launchBtn.classList.add('hidden'); replayBtn.classList.add('hidden');
}
launchBtn.onclick = start; replayBtn.onclick = start;
addEventListener('keydown', e => { if ((e.code === 'Space' || e.code === 'Enter') && state !== 'run') start(); });

const rnd = (a, b) => a + Math.random() * (b - a);
const _v = new THREE.Vector3(), _p = new THREE.Vector3(), _q = new THREE.Quaternion(), UP = new THREE.Vector3(0, 1, 0);
function smoothstep(a, b, x) { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); }

function showText(txt) { countEl.textContent = txt; countEl.style.opacity = txt ? 1 : 0; }

// ---------------------------------------------------------------- update
function update(dt, time) {
  // blinking warning lights
  const blink = (Math.floor(time * 1.5) % 2) === 0;
  warnLights.forEach(l => l.material.color.setHex(blink ? 0xff2020 : 0x330505));

  if (state === 'idle') {
    // slow cinematic drift before launch
    const a = time * 0.05;
    camera.position.set(Math.sin(a) * 18 + CAM_HOME.x, CAM_HOME.y + Math.sin(time * 0.3) * 1.5, Math.cos(a) * 8 + CAM_HOME.z);
    camera.lookAt(lookTarget);
    smoke.update(dt); fire.update(dt);
    // a little venting vapor while waiting
    if (Math.random() < 0.4) smoke.emit(_p.set(rnd(-1.2, 1.2), PAD_TOP + 14 + rnd(0, 6), 1.6), _v.set(rnd(0.5, 1.5), rnd(-0.6, 0.2), rnd(0.5, 1.5)), 3, 0.6, 3.5, [1, 1, 1], [0.9, 0.92, 0.95], 0.25, 0.3, -0.2);
    return;
  }

  simT += dt;
  const T = simT;

  // ---- countdown text
  if (T < LIFTOFF) {
    const n = Math.ceil(LIFTOFF - T);
    if (T >= IGNITION && T < IGNITION + 1) showText('ALLUMAGE');
    else showText(n <= 10 ? String(n) : '');
  } else if (T < LIFTOFF + 2.5) showText('DÉCOLLAGE !');
  else showText('');

  // ---- service arms retract during countdown
  arms.forEach(a => { a.pivot.rotation.y = smoothstep(1.5 + a.delay, 5 + a.delay, T) * (Math.PI / 2 * 0.95); });

  // ---- engine power
  let power = 0;
  if (T >= IGNITION) power = smoothstep(IGNITION, IGNITION + 2.2, T);
  const flicker = 0.9 + Math.random() * 0.15;
  const tau = Math.max(0, T - LIFTOFF);
  const alt = rocket.position.y - ROCKET_BASE_Y;
  const thin = Math.min(alt / 1500, 1);   // thinner air -> plume expands
  outerFlame.visible = innerFlame.visible = flameGlow.visible = power > 0;
  outerFlame.material.uniforms.power.value = power * flicker;
  innerFlame.material.uniforms.power.value = power * flicker;
  outerFlame.material.uniforms.time.value = time; innerFlame.material.uniforms.time.value = time;
  const flameLen = (7 + tau * 0.9 + thin * 14) * power * flicker;
  outerFlame.scale.set(1 + thin * 2.2, Math.max(flameLen, 0.01), 1 + thin * 2.2);
  innerFlame.scale.set(1 + thin * 0.8, Math.max(flameLen * 0.55, 0.01), 1 + thin * 0.8);
  flameGlow.scale.setScalar((9 + thin * 30) * power * flicker);
  flameGlow.material.opacity = power;

  // ---- rocket motion
  if (T >= LIFTOFF) {
    const pitch = smoothstep(5, 20, tau) * 1.05;
    heading.set(FLY_DIR.x * Math.sin(pitch), Math.cos(pitch), FLY_DIR.z * Math.sin(pitch)).normalize();
    const speed = 2.6 * tau + 0.9 * tau * tau;
    rocketVel.copy(heading).multiplyScalar(speed);
    rocket.position.addScaledVector(rocketVel, dt);
    _q.setFromUnitVectors(UP, heading);
    rocket.quaternion.slerp(_q, Math.min(1, dt * 3));
    // tiny lateral jitter right at liftoff
    if (tau < 2) rocket.position.x += (Math.random() - 0.5) * 0.02 * (2 - tau);
  }

  // ---- particles: nozzle world position
  const nozzle = _p.set(0, -0.8, 0).applyMatrix4(rocket.matrixWorld);
  const down = _v.copy(heading).multiplyScalar(-1);
  if (power > 0) {
    // trailing fire particles
    const nFire = Math.floor(10 * power + thin * 6);
    const fireSpeed = 45 + thin * 50;
    for (let i = 0; i < nFire; i++) {
      const f = Math.random();
      const p = new THREE.Vector3().lerpVectors(prevNozzle, nozzle, f);
      const v = down.clone().multiplyScalar(fireSpeed * rnd(0.7, 1.1)).add(new THREE.Vector3(rnd(-1, 1), rnd(-1, 1), rnd(-1, 1)).multiplyScalar(4 + thin * 18)).addScaledVector(rocketVel, 0.6);
      const sz = (2.4 + thin * 9) * rnd(0.8, 1.3);
      fire.emit(p, v, rnd(0.25, 0.45) * (1 + thin * 0.6), sz, sz * 1.8, [1, 0.85, 0.5], [0.9, 0.25, 0.05], 0.9 * power);
    }
  }
  if (T >= IGNITION) {
    const nearGround = alt < 60;
    // ground billows out of the flame trench (both ends) + around base
    if (nearGround) {
      const gPower = power * (1 - smoothstep(10, 60, alt));
      for (let i = 0; i < Math.floor(14 * gPower); i++) {
        const side = Math.random() < 0.5 ? 1 : -1;
        const warm = Math.random() < 0.35;
        smoke.emit(new THREE.Vector3(rnd(-2.5, 2.5), rnd(0.8, 3), side * 13),
          new THREE.Vector3(rnd(-6, 6), rnd(2, 8), side * rnd(18, 42)),
          rnd(6, 10), rnd(3, 5), rnd(16, 28), warm ? [1, 0.7, 0.45] : [0.95, 0.93, 0.9], [0.78, 0.77, 0.76], 0.55, 0.55, 1.2);
      }
      if (T >= LIFTOFF - 0.6) {
        for (let i = 0; i < Math.floor(8 * gPower); i++) {
          const a = Math.random() * Math.PI * 2, r = rnd(4, 9);
          smoke.emit(new THREE.Vector3(Math.cos(a) * r, PAD_TOP + rnd(0.5, 3), Math.sin(a) * r),
            new THREE.Vector3(Math.cos(a) * rnd(8, 20), rnd(1, 6), Math.sin(a) * rnd(8, 20)),
            rnd(5, 9), rnd(3, 5), rnd(14, 24), [1, 0.75, 0.5], [0.8, 0.79, 0.78], 0.5, 0.5, 1.0);
        }
      }
    }
    // exhaust smoke trail behind the rocket
    if (T >= LIFTOFF) {
      const dist = nozzle.distanceTo(prevNozzle);
      const n = Math.min(40, 3 + Math.floor(dist / (1.2 + thin * 4)));
      for (let i = 0; i < n; i++) {
        const f = Math.random();
        const p = new THREE.Vector3().lerpVectors(prevNozzle, nozzle, f).addScaledVector(down, 3 + thin * 10);
        const sz = 3 + thin * 22 + alt * 0.004;
        smoke.emit(p, new THREE.Vector3(rnd(-1, 1), rnd(-0.5, 1), rnd(-1, 1)).multiplyScalar(2 + thin * 3).addScaledVector(down, 10),
          rnd(6, 10), sz * 0.6, sz * 2.4, [1, 0.72, 0.45], [0.86, 0.84, 0.82], 0.5 * (1 - thin * 0.35), 0.8, 0.4);
      }
    }
  }
  prevNozzle.copy(nozzle);

  smoke.update(dt); fire.update(dt);

  // ---- fire light
  fireLight.position.copy(nozzle).addScaledVector(down, 3);
  fireLight.intensity = power * flicker * 260 * (1 - smoothstep(50, 300, alt));
  fireLight.distance = 140;

  // ---- camera
  let shake = 0;
  if (T >= IGNITION) shake = power * 0.35 * (1 - smoothstep(LIFTOFF + 3, LIFTOFF + 12, T));
  const camBase = CAM_HOME.clone();
  if (T < IGNITION) { // move from drift position into the home position
    camera.position.lerp(camBase, Math.min(1, dt * 1.5));
  } else {
    camera.position.copy(camBase);
    // slight rise of the camera as it pans
    camera.position.y += smoothstep(LIFTOFF, LIFTOFF + 12, T) * 6;
  }
  camera.position.x += (Math.random() - 0.5) * shake;
  camera.position.y += (Math.random() - 0.5) * shake;

  const aim = rocket.position.clone().addScaledVector(heading, 11);
  const desired = T < LIFTOFF ? new THREE.Vector3(0, 16, 0) : aim;
  const dist = camera.position.distanceTo(rocket.position);
  lookTarget.lerp(desired, Math.min(1, dt * (T < LIFTOFF + 4 ? 2.5 : 6)));
  if (tau < 16) {  // zoom in while climbing; afterwards the lens holds and the rocket shrinks into the sky
    const targetFov = THREE.MathUtils.clamp(2 * Math.atan(75 / dist) * 180 / Math.PI, 12, 50);
    camera.fov += (targetFov - camera.fov) * Math.min(1, dt * 1.5);
    camera.updateProjectionMatrix();
  }
  camera.lookAt(lookTarget);
  // keep the engine glow visible as a bright point when far away
  const glowWorld = Math.max((9 + thin * 30) * power * flicker, dist * 0.012 * power);
  flameGlow.scale.setScalar(glowWorld);

  // ---- stats + sound
  if (T >= IGNITION - 1) statsEl.style.opacity = 1;
  const altM = alt * 1.5, spdKmh = rocketVel.length() * 1.5 * 3.6;
  if (T <= END) statsEl.innerHTML = `T${T < LIFTOFF ? '−' : '+'}${Math.abs(T - LIFTOFF).toFixed(1)} s<br>ALTITUDE ${(altM / 1000).toFixed(2)} km<br>VITESSE ${spdKmh.toFixed(0)} km/h`;
  setRumble(power * 0.9 * (1 - smoothstep(10, 26, tau) * 0.85), 250 + power * 300);

  if (T > END && state === 'run') { state = 'done'; replayBtn.classList.remove('hidden'); }
}

// ---------------------------------------------------------------- loop
const clock = new THREE.Clock();
const SPEED = Math.min(8, Math.max(0.1, parseFloat(new URLSearchParams(location.search).get('speed')) || 1));
function frame() {
  const dt = Math.min(clock.getDelta(), 1 / 20) * SPEED;
  const time = clock.elapsedTime;
  rocket.updateMatrixWorld();
  if (state === 'done') updateDone(dt, time); else update(dt, time);
  sky.position.copy(camera.position);
  const scale = renderer.domElement.height / (2 * Math.tan(THREE.MathUtils.degToRad(camera.fov) / 2));
  smoke.mat.uniforms.scale.value = scale; fire.mat.uniforms.scale.value = scale;
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
// after the show: keep the rocket flying and the smoke drifting
function updateDone(dt, time) { state = 'run'; update(dt, time); state = 'done'; }
prevNozzle.set(0, ROCKET_BASE_Y - 0.8, 0);
frame();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
