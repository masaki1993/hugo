<script type="module">
import * as THREE from 'three';

// ---------------------------------------------------------------- renderer / scene
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.localClippingEnabled = true;
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
const HORIZON = new THREE.Color(0xf2b27a);
scene.fog = new THREE.Fog(HORIZON, 250, 1800);

const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.5, 30000);
const CAM_HOME = new THREE.Vector3(42, 9, 52);
camera.position.copy(CAM_HOME);

// ---------------------------------------------------------------- sky (follows camera, always behind)
const skyMat = new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false, depthTest: false, fog: false,
  uniforms: { top: { value: new THREE.Color(0x0d1b3d) }, mid: { value: new THREE.Color(0x4a6aa8) }, horizon: { value: HORIZON }, sunDir: { value: new THREE.Vector3(0.6, 0.08, -0.8).normalize() } },
  vertexShader: `varying vec3 vDir; void main(){ vDir = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
  fragmentShader: `uniform vec3 top, mid, horizon, sunDir; varying vec3 vDir;
    void main(){ float h = vDir.y;
      vec3 c = mix(horizon, mid, smoothstep(0.0, 0.25, h));
      c = mix(c, top, smoothstep(0.2, 0.9, h));
      c = mix(c, horizon * 0.55, smoothstep(0.0, -0.1, h));
      float s = max(dot(vDir, sunDir), 0.0);
      c += vec3(1.0, 0.6, 0.3) * (pow(s, 8.0) * 0.35 + pow(s, 600.0) * 2.0);
      gl_FragColor = vec4(c, 1.0); }`
});
const sky = new THREE.Mesh(new THREE.SphereGeometry(1000, 32, 16), skyMat);
sky.renderOrder = -10;
scene.add(sky);

// stars, faint, high in the sky
{
  const n = 1500, p = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) {
    const u = Math.random() * Math.PI * 2, v = 0.25 + Math.random() * 0.75;
    const r = Math.sqrt(1 - v * v);
    p.set([Math.cos(u) * r * 900, v * 900, Math.sin(u) * r * 900], i * 3);
  }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(p, 3));
  const stars = new THREE.Points(g, new THREE.PointsMaterial({ size: 1.5, sizeAttenuation: false, color: 0xffffff, transparent: true, opacity: 0.55, depthWrite: false, depthTest: false, fog: false }));
  stars.renderOrder = -9;
  sky.add(stars);
}

// ---------------------------------------------------------------- lights
scene.add(new THREE.HemisphereLight(0x9fb6ff, 0x3a2a1e, 0.9));
const sun = new THREE.DirectionalLight(0xffc48a, 2.0);
sun.position.set(60, 25, -80);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -40, right: 40, top: 50, bottom: -20, near: 1, far: 250 });
scene.add(sun);
const fireLight = new THREE.PointLight(0xff8a2a, 0, 120, 1.6);
scene.add(fireLight);

// ---------------------------------------------------------------- ground & surroundings
const ground = new THREE.Mesh(new THREE.PlaneGeometry(6000, 6000), new THREE.MeshStandardMaterial({ color: 0x4d5a36, roughness: 1 }));
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);
const apron = new THREE.Mesh(new THREE.CircleGeometry(60, 64), new THREE.MeshStandardMaterial({ color: 0x8b8a84, roughness: 0.95 }));
apron.rotation.x = -Math.PI / 2; apron.position.y = 0.02; apron.receiveShadow = true; scene.add(apron);
// access road
const road = new THREE.Mesh(new THREE.PlaneGeometry(8, 900), new THREE.MeshStandardMaterial({ color: 0x55534f, roughness: 1 }));
road.rotation.x = -Math.PI / 2; road.position.set(0, 0.03, 500); scene.add(road);
// distant sea + hills silhouettes
const sea = new THREE.Mesh(new THREE.PlaneGeometry(6000, 3000), new THREE.MeshStandardMaterial({ color: 0x2e4c7a, roughness: 0.25, metalness: 0.3 }));
sea.rotation.x = -Math.PI / 2; sea.position.set(0, 0.05, -2200); scene.add(sea);
{
  const hillMat = new THREE.MeshStandardMaterial({ color: 0x3c4a33, roughness: 1, flatShading: true });
  for (let i = 0; i < 26; i++) {
    const a = Math.PI * 0.15 + Math.random() * Math.PI * 1.3; // behind camera side mostly
    const d = 700 + Math.random() * 600;
    const h = new THREE.Mesh(new THREE.ConeGeometry(80 + Math.random() * 120, 30 + Math.random() * 60, 7), hillMat);
    h.position.set(Math.cos(a) * d, 10, Math.sin(a) * d); scene.add(h);
  }
  // a distant assembly building and a second pad tower, generic shapes
  const bMat = new THREE.MeshStandardMaterial({ color: 0xcfcac0, roughness: 0.9 });
  const vab = new THREE.Mesh(new THREE.BoxGeometry(60, 80, 50), bMat);
  vab.position.set(-260, 40, 380); vab.castShadow = true; scene.add(vab);
  const door = new THREE.Mesh(new THREE.PlaneGeometry(18, 60), new THREE.MeshStandardMaterial({ color: 0x5a5d66 }));
  door.position.set(-260, 32, 405.1); scene.add(door);
  for (let i = 0; i < 6; i++) {
    const tank = new THREE.Mesh(new THREE.SphereGeometry(5, 20, 12), new THREE.MeshStandardMaterial({ color: 0xeeeeee, roughness: 0.4 }));
    tank.position.set(55 + (i % 3) * 13, 6, -30 + Math.floor(i / 3) * 14); tank.castShadow = true; scene.add(tank);
    const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.4, 2), new THREE.MeshStandardMaterial({ color: 0x777777 }));
    leg.position.set(tank.position.x, 1, tank.position.z); scene.add(leg);
  }
  // lightning masts
  for (const [x, z] of [[-30, -28], [26, -32], [-34, 22], [32, -6]]) {
    const m = new THREE.Mesh(new THREE.CylinderGeometry(0.25, 0.6, 50, 8), new THREE.MeshStandardMaterial({ color: 0xdddddd }));
    m.position.set(x, 25, z); m.castShadow = true; scene.add(m);
  }
}

// ---------------------------------------------------------------- launch platform
const PAD_TOP = 4;
const concrete = new THREE.MeshStandardMaterial({ color: 0xa9a59c, roughness: 0.9 });
const darkMat = new THREE.MeshStandardMaterial({ color: 0x1d1d1f, roughness: 1 });
const steelGrey = new THREE.MeshStandardMaterial({ color: 0x6f7378, roughness: 0.6, metalness: 0.5 });
function box(w, h, d, mat, x, y, z) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  m.position.set(x, y, z); m.castShadow = true; m.receiveShadow = true; scene.add(m); return m;
}
// two side blocks + deck bridges leave a flame trench running along z
box(10, PAD_TOP, 26, concrete, -8, PAD_TOP / 2, 0);
box(10, PAD_TOP, 26, concrete, 8, PAD_TOP / 2, 0);
box(6, 1, 9, concrete, 0, PAD_TOP - 0.5, -8.5);
box(6, 1, 9, concrete, 0, PAD_TOP - 0.5, 8.5);
box(6, 0.3, 26, darkMat, 0, 0.15, 0);                       // trench floor
const deflector = new THREE.Mesh(new THREE.ConeGeometry(3, 2.6, 4), steelGrey); // flame deflector wedge
deflector.rotation.y = Math.PI / 4; deflector.scale.set(1, 1, 0.5); deflector.position.set(0, 1.3, 0); scene.add(deflector);
// ramp edges + yellow safety stripes
const yellow = new THREE.MeshStandardMaterial({ color: 0xf2c230, roughness: 0.7 });
box(26, 0.06, 0.5, yellow, 0, PAD_TOP + 0.03, 12.6);
box(26, 0.06, 0.5, yellow, 0, PAD_TOP + 0.03, -12.6);
// hold-down clamps around the opening
for (const [x, z] of [[-2.6, -2.6], [2.6, -2.6], [-2.6, 2.6], [2.6, 2.6]]) box(0.7, 1.3, 0.7, steelGrey, x, PAD_TOP + 0.65, z);

// ---------------------------------------------------------------- launch tower (lattice)
const towerMat = new THREE.MeshStandardMaterial({ color: 0xc8432b, roughness: 0.6, metalness: 0.3 });
const TOWER_X = -8, TOWER_W = 3.2, TOWER_H = 40;
function latticeBeams(list) {
  const geo = new THREE.BoxGeometry(1, 1, 1);
  const mesh = new THREE.InstancedMesh(geo, towerMat, list.length);
  const up = new THREE.Vector3(0, 1, 0), m = new THREE.Matrix4(), q = new THREE.Quaternion(), s = new THREE.Vector3();
  list.forEach(([a, b, t], i) => {
    const dir = b.clone().sub(a), len = dir.length();
    q.setFromUnitVectors(up, dir.normalize());
    s.set(t, len, t);
    m.compose(a.clone().add(b).multiplyScalar(0.5), q, s);
    mesh.setMatrixAt(i, m);
  });
  mesh.castShadow = true; mesh.receiveShadow = true;
  return mesh;
}
{
  const beams = [], V = (x, y, z) => new THREE.Vector3(x, y, z), hw = TOWER_W / 2, seg = 2.5;
  const corners = [[-hw, -hw], [hw, -hw], [hw, hw], [-hw, hw]];
  for (const [cx, cz] of corners) beams.push([V(TOWER_X + cx, PAD_TOP, cz), V(TOWER_X + cx, PAD_TOP + TOWER_H, cz), 0.35]);
  for (let y = PAD_TOP; y < PAD_TOP + TOWER_H - 0.01; y += seg) {
    for (let k = 0; k < 4; k++) {
      const [ax, az] = corners[k], [bx, bz] = corners[(k + 1) % 4];
      beams.push([V(TOWER_X + ax, y + seg, az), V(TOWER_X + bx, y + seg, bz), 0.18]);
      const flip = (Math.round(y / seg) % 2) ? 1 : 0;
      beams.push([V(TOWER_X + (flip ? ax : bx), y, flip ? az : bz), V(TOWER_X + (flip ? bx : ax), y + seg, flip ? bz : az), 0.12]);
    }
  }
  scene.add(latticeBeams(beams));
  // elevator shaft core + roof + mast
  box(1.4, TOWER_H, 1.4, new THREE.MeshStandardMaterial({ color: 0x8a8f96, roughness: 0.7 }), TOWER_X, PAD_TOP + TOWER_H / 2, 0);
  box(TOWER_W + 0.6, 0.4, TOWER_W + 0.6, towerMat, TOWER_X, PAD_TOP + TOWER_H + 0.2, 0);
  const mast = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.22, 10, 6), steelGrey);
  mast.position.set(TOWER_X, PAD_TOP + TOWER_H + 5.4, 0); scene.add(mast);
}
// blinking red warning lights on tower
const warnLights = [];
for (const y of [PAD_TOP + 15, PAD_TOP + 30, PAD_TOP + TOWER_H + 10.4]) {
  const l = new THREE.Mesh(new THREE.SphereGeometry(0.25, 8, 6), new THREE.MeshBasicMaterial({ color: 0xff2020 }));
  l.position.set(TOWER_X, y, y > PAD_TOP + TOWER_H ? 0 : TOWER_W / 2 + 0.1); scene.add(l); warnLights.push(l);
}

// service arms that swing away before liftoff
const arms = [];
function makeArm(y, withRoom) {
  const pivot = new THREE.Group();
  pivot.position.set(TOWER_X + TOWER_W / 2, y, TOWER_W / 2 - 0.2);
  const len = (0 - 1.55) - (TOWER_X + TOWER_W / 2);
  const V = (x, yy, z) => new THREE.Vector3(x, yy, z), beams = [];
  for (const dz of [0, -1.2]) {
    beams.push([V(0, 0, dz), V(len, 0, dz), 0.18]);
    beams.push([V(0, 1.2, dz), V(len, 1.2, dz), 0.18]);
    for (let x = 0; x < len; x += 1.2) beams.push([V(x, 0, dz), V(x + 1.2, 1.2, dz), 0.1]);
  }
  const g = latticeBeams(beams); pivot.add(g);
  if (withRoom) {
    const room = new THREE.Mesh(new THREE.BoxGeometry(1.6, 2.2, 1.8), new THREE.MeshStandardMaterial({ color: 0xf2f2f2, roughness: 0.6 }));
    room.position.set(len - 0.8, 1.1, -0.6); room.castShadow = true; pivot.add(room);
  } else {
    const umb = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.12, 2.5, 6), darkMat); // umbilical hose
    umb.rotation.z = Math.PI / 2; umb.position.set(len - 1, 0.3, -0.6); pivot.add(umb);
  }
  scene.add(pivot);
  arms.push({ pivot, delay: arms.length * 0.4 });
}
makeArm(PAD_TOP + 9, false);
makeArm(PAD_TOP + 19, false);
makeArm(PAD_TOP + 26, true);

// ---------------------------------------------------------------- rocket (two stages + fairing + satellite, with interior parts)
// Rocket-local coordinates: y = 0 is the bottom of the 1st-stage skirt, nose tip at y = 30.
const rocket = new THREE.Group();
const stage1 = new THREE.Group(), stage2 = new THREE.Group(), payload = new THREE.Group();
const fairA = new THREE.Group(), fairB = new THREE.Group();   // fairing halves (+x / -x)
rocket.add(stage1, stage2, payload, fairA, fairB);
const ROCKET_BASE_Y = PAD_TOP + 0.6;
const S2_NOZZLE_Y = 12.8;                                       // bottom of the 2nd-stage nozzle
// cutaway plane (world space). Far away = nothing clipped.
const cutPlane = new THREE.Plane(new THREE.Vector3(0, 0, -1), 1e6);
const clip = [cutPlane];
const partMats = {};                                            // per-part materials (for highlight)
{
  const R = 1.5;
  const skinMat = (color, o = {}) => new THREE.MeshStandardMaterial({ color, roughness: 0.4, side: THREE.DoubleSide, clippingPlanes: clip, ...o });
  const white = skinMat(0xf6f6f4, { roughness: 0.35 });
  const red = skinMat(0xd61f26);
  const blue = skinMat(0x1f47c4);
  const metalSkin = skinMat(0x3b3d42, { roughness: 0.35, metalness: 0.9 });
  const metal = new THREE.MeshStandardMaterial({ color: 0x4a4d55, roughness: 0.35, metalness: 0.9, side: THREE.DoubleSide });
  const copper = new THREE.MeshStandardMaterial({ color: 0xc8733a, roughness: 0.35, metalness: 0.8 });
  const add = (parent, geo, mat, y) => { const m = new THREE.Mesh(geo, mat); m.position.y = y; m.castShadow = true; m.receiveShadow = true; parent.add(m); return m; };
  const tube = (parent, y0, y1, mat, r = R) => add(parent, new THREE.CylinderGeometry(r, r, y1 - y0, 48, 1, true), mat, (y0 + y1) / 2);
  const band = (parent, y, h, mat) => add(parent, new THREE.CylinderGeometry(R + 0.02, R + 0.02, h, 48, 1, true), mat, y);
  function tankGeo(r, h, dh) {
    const pts = [], N = 10;
    for (let i = 0; i <= N; i++) { const a = -Math.PI / 2 + i / N * Math.PI / 2; pts.push(new THREE.Vector2(Math.cos(a) * r + 1e-3, dh + Math.sin(a) * dh)); }
    for (let i = 0; i <= N; i++) { const a = i / N * Math.PI / 2; pts.push(new THREE.Vector2(Math.cos(a) * r + 1e-3, h - dh + Math.sin(a) * dh)); }
    return new THREE.LatheGeometry(pts, 40);
  }
  const tank = (parent, key, y0, y1, color) => {
    const mat = new THREE.MeshStandardMaterial({ color, roughness: 0.45, metalness: 0.2, side: THREE.DoubleSide, clippingPlanes: clip });
    mat.emissive.setHex(color).multiplyScalar(0.18); mat.userData.baseEm = mat.emissive.clone();
    partMats[key] = [mat];
    return add(parent, tankGeo(1.3, y1 - y0, 0.55), mat, y0);
  };
  const LOX = 0x6fb7ff, FUEL = 0xf0a33c;

  // ---------- 1st stage
  tube(stage1, 1, 14.4, white);
  add(stage1, new THREE.CylinderGeometry(R, R * 0.9, 1.0, 48, 1, true), metalSkin, 0.5);  // engine skirt
  band(stage1, 3.8, 1.0, red); band(stage1, 5.0, 1.0, blue);
  band(stage1, 10.6, 0.6, blue); band(stage1, 11.3, 0.6, red);
  band(stage1, 14.35, 0.1, new THREE.MeshStandardMaterial({ color: 0x222222, clippingPlanes: clip, side: THREE.DoubleSide })); // separation seam
  tank(stage1, 's1fuel', 2.45, 7.2, FUEL);
  tank(stage1, 's1lox', 7.4, 12.4, LOX);
  // engine: combustion chamber + bell nozzle
  const s1chamber = new THREE.MeshStandardMaterial().copy(copper), s1nozzle = metal.clone();
  partMats.s1engine = [s1chamber, s1nozzle];
  add(stage1, new THREE.CylinderGeometry(0.45, 0.4, 0.8, 24), s1chamber, 1.4);
  add(stage1, new THREE.CylinderGeometry(0.4, 1.0, 1.6, 32, 1, true), s1nozzle, 0.2);

class Particles {
  constructor(max, additive) {
    this.max = max; this.next = 0;
    this.pos = new Float32Array(max * 3); this.vel = new Float32Array(max * 3);
    this.col = new Float32Array(max * 3); this.size = new Float32Array(max); this.alpha = new Float32Array(max); this.rot = new Float32Array(max);
    this.life = new Float32Array(max); this.maxLife = new Float32Array(max).fill(1); this.alive = new Uint8Array(max);
    this.s0 = new Float32Array(max); this.s1 = new Float32Array(max); this.a0 = new Float32Array(max);
    this.c0 = new Float32Array(max * 3); this.c1 = new Float32Array(max * 3); this.drag = new Float32Array(max); this.buoy = new Float32Array(max);
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(this.pos, 3).setUsage(THREE.DynamicDrawUsage));
    g.setAttribute('aColor', new THREE.BufferAttribute(this.col, 3).setUsage(THREE.DynamicDrawUsage));
    g.setAttribute('aSize', new THREE.BufferAttribute(this.size, 1).setUsage(THREE.DynamicDrawUsage));
    g.setAttribute('aAlpha', new THREE.BufferAttribute(this.alpha, 1).setUsage(THREE.DynamicDrawUsage));
    g.setAttribute('aRot', new THREE.BufferAttribute(this.rot, 1));
    this.geo = g;
    this.mat = new THREE.ShaderMaterial({
      transparent: true, depthWrite: false, fog: false,
      blending: additive ? THREE.AdditiveBlending : THREE.NormalBlending,
      uniforms: { scale: { value: 1 }, map: { value: puffTex }, additive: { value: additive ? 1 : 0 } },
      vertexShader: `attribute vec3 aColor; attribute float aSize, aAlpha, aRot; uniform float scale;
        varying vec3 vC; varying float vA, vR;
        void main(){ vC = aColor; vA = aAlpha; vR = aRot; vec4 mv = modelViewMatrix * vec4(position,1.0);
          gl_PointSize = min(aSize * scale / max(-mv.z, 0.1), 2048.0); gl_Position = projectionMatrix * mv; }`,
      fragmentShader: `uniform sampler2D map; uniform float additive; varying vec3 vC; varying float vA, vR;
        void main(){ vec2 p = gl_PointCoord - 0.5; float c = cos(vR), s = sin(vR);
          p = vec2(c*p.x - s*p.y, s*p.x + c*p.y);
          float d = length(p) * 2.0;
          float a = additive > 0.5 ? pow(max(1.0 - d, 0.0), 1.6) : texture2D(map, p + 0.5).a * smoothstep(1.0, 0.6, d) * 1.6;
          a *= vA; if (a < 0.003) discard; gl_FragColor = vec4(vC, a); }`
    });
    this.points = new THREE.Points(g, this.mat);
    this.points.frustumCulled = false;
    this.points.renderOrder = additive ? 4 : 3;
    scene.add(this.points);
  }
  emit(p, v, life, s0, s1, c0, c1, a0, drag = 0, buoy = 0) {
    const i = this.next; this.next = (this.next + 1) % this.max;
    this.pos.set([p.x, p.y, p.z], i * 3); this.vel.set([v.x, v.y, v.z], i * 3);
    this.c0.set(c0, i * 3); this.c1.set(c1, i * 3);
    this.life[i] = 0; this.maxLife[i] = life; this.s0[i] = s0; this.s1[i] = s1; this.a0[i] = a0;
    this.drag[i] = drag; this.buoy[i] = buoy; this.alive[i] = 1; this.rot[i] = Math.random() * 6.28;
  }
  update(dt) {
    for (let i = 0; i < this.max; i++) {
      if (!this.alive[i]) continue;
      const L = (this.life[i] += dt), t = L / this.maxLife[i];
      if (t >= 1) { this.alive[i] = 0; this.alpha[i] = 0; this.size[i] = 0; continue; }
      const k = Math.exp(-this.drag[i] * dt), j = i * 3;
      this.vel[j] *= k; this.vel[j + 1] = this.vel[j + 1] * k + this.buoy[i] * dt; this.vel[j + 2] *= k;
      this.pos[j] += this.vel[j] * dt; this.pos[j + 1] += this.vel[j + 1] * dt; this.pos[j + 2] += this.vel[j + 2] * dt;
      if (this.pos[j + 1] < 0.3) { this.pos[j + 1] = 0.3; this.vel[j + 1] = Math.abs(this.vel[j + 1]) * 0.2; }
      const e = 1 - Math.pow(1 - t, 2.2);
      this.size[i] = this.s0[i] + (this.s1[i] - this.s0[i]) * e;
      this.alpha[i] = this.a0[i] * Math.min(1, t * 8) * (1 - t) * (1 - t * 0.3);
      for (let c = 0; c < 3; c++) this.col[j + c] = this.c0[j + c] + (this.c1[j + c] - this.c0[j + c]) * Math.min(1, t * 2.5);
    }
    for (const n of ['position', 'aColor', 'aSize', 'aAlpha']) this.geo.attributes[n].needsUpdate = true;
  }
  reset() { this.alive.fill(0); this.alpha.fill(0); this.size.fill(0); this.geo.attributes.aRot.needsUpdate = true; }
}

function startAudio() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const buf = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate), d = buf.getChannelData(0);
    let last = 0; for (let i = 0; i < d.length; i++) { last = (last + 0.02 * (Math.random() * 2 - 1)) / 1.02; d[i] = last * 3.5; }
    const src = ctx.createBufferSource(); src.buffer = buf; src.loop = true;
    const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 400;
    const gain = ctx.createGain(); gain.gain.value = 0;
    src.connect(lp).connect(gain).connect(ctx.destination); src.start();
    audio = { ctx, gain, lp };
  } catch (e) { audio = null; }
}
function setRumble(v, f) { if (!audio) return; audio.gain.gain.setTargetAtTime(v, audio.ctx.currentTime, 0.15); audio.lp.frequency.setTargetAtTime(f, audio.ctx.currentTime, 0.3); }

function textSprite() {
  const c = document.createElement('canvas'); c.width = 512; c.height = 96;
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(c), depthTest: false, transparent: true, fog: false }));
  s.renderOrder = 21; s.userData.canvas = c;
  s.setText = (txt, color) => {
    const x = c.getContext('2d'); x.clearRect(0, 0, 512, 96);
    x.font = 'bold 52px "Hiragino Sans","Noto Sans JP",sans-serif'; x.textAlign = 'center'; x.textBaseline = 'middle';
    x.lineWidth = 9; x.strokeStyle = 'rgba(0,0,0,.75)'; x.strokeText(txt, 256, 48); x.fillStyle = color; x.fillText(txt, 256, 48);
    s.material.map.needsUpdate = true;
  };
  return s;
}
function makeArrow(color, labelColor) {
  const g = new THREE.Group();
  const mat = new THREE.MeshBasicMaterial({ color, depthTest: false, transparent: true, opacity: 0.92, fog: false });
  const shaft = new THREE.Mesh(new THREE.CylinderGeometry(0.35, 0.35, 1, 12).translate(0, 0.5, 0), mat);
  const head = new THREE.Mesh(new THREE.ConeGeometry(0.95, 1.8, 16), mat);
  shaft.renderOrder = head.renderOrder = 20;
  g.add(shaft, head);
  const label = textSprite(); label.scale.set(10, 1.9, 1); scene.add(label);
  g.userData = { label, labelColor };
  g.set = (origin, dir, len, scale = 1) => {
    g.position.copy(origin); g.quaternion.setFromUnitVectors(UP, dir); g.scale.setScalar(scale);
    const L = Math.max(len, 2.0);
    shaft.scale.y = L - 1.8; head.position.y = L - 0.9;
    label.position.copy(origin).addScaledVector(dir, (L + 1.6) * scale);
    label.scale.set(10 * scale, 1.9 * scale, 1);
  };
  g.show = v => { g.visible = v; label.visible = v; };
  scene.add(g); g.show(false);
  return g;
}

function updateFlow(time) {
  const m = new THREE.Matrix4();
  for (const [mesh, path, sp] of [[flowLox, stage1.userData.paths.lox, 0.22], [flowFuel, stage1.userData.paths.fuel, 0.45]]) {

const IGNITION = 7, LIFTOFF = 10, END = LIFTOFF + 32;
const MECO = 13, SEP = 13.8, IGN2 = 15, FAIR = 18;            // seconds after liftoff
let state = 'idle', simT = 0;

const FLY_DIR = new THREE.Vector3(-0.75, 0, -0.66).normalize();  // downrange, away from camera
const lookTarget = new THREE.Vector3(0, 16, 0);
const prevNozzle = new THREE.Vector3();
let speedScalar = 0, events = {}, nozzleY = -0.8;
const debris = [];  // separated pieces: { obj, vel, spin }

function setFlameStage(n) {

function resetScene() {

  debris.length = 0; events = {}; speedScalar = 0;
  rocket.position.set(0, ROCKET_BASE_Y, 0); rocket.quaternion.identity(); rocket.updateMatrixWorld(true);
  heading.set(0, 1, 0); rocketVel.set(0, 0, 0);

  lookTarget.set(0, 16, 0);

  outerFlame.visible = innerFlame.visible = flameGlow.visible = false;
  fireLight.intensity = 0; countEl.style.opacity = 0; statsEl.style.opacity = 0;

const rnd = (a, b) => a + Math.random() * (b - a);
const _v = new THREE.Vector3(), _p = new THREE.Vector3(), _q = new THREE.Quaternion();
function smoothstep(a, b, x) { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); }
let textUntil = 0;
function showText(txt) { countEl.textContent = txt; countEl.style.opacity = txt ? 1 : 0; }
function flash(key, T) { if (events[key]) return false; events[key] = true; showText(tr(key)); textUntil = T + 2.2; return true; }

function detach(obj, vel, spin) {
  scene.attach(obj);
  debris.push({ obj, vel: vel.clone(), spin: spin.clone() });
}
function burst(pos, n, scale) {
  for (let i = 0; i < n; i++) {
    const v = new THREE.Vector3(rnd(-1, 1), rnd(-1, 1), rnd(-1, 1)).multiplyScalar(6 * scale).addScaledVector(rocketVel, 0.8);
    smoke.emit(pos, v, rnd(3, 6), 2 * scale, 9 * scale, [1, 1, 1], [0.85, 0.85, 0.88], 0.5, 1.2, 0);
  }
}

// ---------------------------------------------------------------- flight update
function update(dt, time) {
  if (state === 'idle') {
    const a = time * 0.05;
    camera.position.set(Math.sin(a) * 18 + CAM_HOME.x, CAM_HOME.y + Math.sin(time * 0.3) * 1.5, Math.cos(a) * 8 + CAM_HOME.z);
    camera.lookAt(lookTarget);
    smoke.update(dt); fire.update(dt);
    if (Math.random() < 0.4) smoke.emit(_p.set(rnd(-1.2, 1.2), PAD_TOP + 14 + rnd(0, 6), 1.6), _v.set(rnd(0.5, 1.5), rnd(-0.6, 0.2), rnd(0.5, 1.5)), 3, 0.6, 3.5, [1, 1, 1], [0.9, 0.92, 0.95], 0.25, 0.3, -0.2);
    return;
  }

  simT += dt;
  const T = simT;
  const tau = Math.max(0, T - LIFTOFF);

  // ---- countdown / event text
  if (T < LIFTOFF) {
    if (T >= IGNITION && T < IGNITION + 1) showText(tr('ignition'));
    else showText(String(Math.ceil(LIFTOFF - T)));
  } else if (T < LIFTOFF + 2.5) showText(tr('liftoff'));
  else if (T > textUntil) showText('');

  arms.forEach(a => { a.pivot.rotation.y = smoothstep(1.5 + a.delay, 5 + a.delay, T) * (Math.PI / 2 * 0.95); });

  // ---- engine power & staging
  let power = 0;
  if (T >= IGNITION) power = smoothstep(IGNITION, IGNITION + 2.2, T);
  if (tau >= MECO) { power = 1 - smoothstep(MECO, MECO + 0.4, tau); flash('meco', T); }
  if (tau >= SEP && !events.sep) {
    flash('sep', T);
    detach(stage1, rocketVel.clone().multiplyScalar(0.97).addScaledVector(heading, -4), new THREE.Vector3(0.5, 0, 0.9));
    burst(_p.set(0, 14.4, 0).applyMatrix4(rocket.matrixWorld), 30, 1);
  }
  const stage2On = tau >= IGN2;
  if (stage2On) {
    if (flash('ign2', T)) { setFlameStage(2); rocket.updateMatrixWorld(); prevNozzle.set(0, nozzleY, 0).applyMatrix4(rocket.matrixWorld); }
    power = smoothstep(IGN2, IGN2 + 0.6, tau);
  }
  if (tau >= FAIR && !events.fair) {
    flash('fair', T);
    const side = new THREE.Vector3(1, 0, 0).applyQuaternion(rocket.quaternion);
    detach(fairA, rocketVel.clone().multiplyScalar(0.99).addScaledVector(side, 7), new THREE.Vector3(0, 0, -1.4));
    detach(fairB, rocketVel.clone().multiplyScalar(0.99).addScaledVector(side, -7), new THREE.Vector3(0, 0, 1.4));
  }
  const flicker = 0.9 + Math.random() * 0.15;
  const alt = rocket.position.y - ROCKET_BASE_Y;
  const thin = Math.min(alt / 1500, 1);   // thinner air -> plume expands
  const sz2 = stage2On ? 0.6 : 1;          // smaller upper-stage engine
  outerFlame.visible = innerFlame.visible = flameGlow.visible = power > 0.01;
  outerFlame.material.uniforms.power.value = power * flicker;
  innerFlame.material.uniforms.power.value = power * flicker;
  outerFlame.material.uniforms.time.value = time; innerFlame.material.uniforms.time.value = time;
  const flameLen = (7 + Math.min(tau, 14) * 0.9 + thin * 14) * power * flicker * (stage2On ? 0.75 : 1);
  outerFlame.scale.set((1 + thin * 2.2) * sz2, Math.max(flameLen, 0.01), (1 + thin * 2.2) * sz2);
  innerFlame.scale.set((1 + thin * 0.8) * sz2, Math.max(flameLen * 0.55, 0.01), (1 + thin * 0.8) * sz2);
  flameGlow.material.opacity = power;

  // ---- rocket motion (integrated speed so the coast between stages is visible)
  if (T >= LIFTOFF) {
    const pitch = smoothstep(5, 22, tau) * 1.05;
    heading.set(FLY_DIR.x * Math.sin(pitch), Math.cos(pitch), FLY_DIR.z * Math.sin(pitch)).normalize();
    const acc = stage2On ? power * (3 + 1.3 * tau) : (tau < MECO ? 2.6 + 1.8 * tau : -3);
    speedScalar = Math.max(0, speedScalar + acc * dt);
    rocketVel.copy(heading).multiplyScalar(speedScalar);
    rocket.position.addScaledVector(rocketVel, dt);
    _q.setFromUnitVectors(UP, heading);
    rocket.quaternion.slerp(_q, Math.min(1, dt * 3));
    if (tau < 2) rocket.position.x += (Math.random() - 0.5) * 0.02 * (2 - tau);
  }
  rocket.updateMatrixWorld();

  // ---- separated pieces fall away tumbling
  for (const d of debris) {
    d.vel.y -= 9 * dt; d.vel.multiplyScalar(Math.exp(-0.05 * dt));
    d.obj.position.addScaledVector(d.vel, dt);
    d.obj.rotateX(d.spin.x * dt); d.obj.rotateZ(d.spin.z * dt);
  }

  // ---- particles
  const nozzle = _p.set(0, nozzleY, 0).applyMatrix4(rocket.matrixWorld);
  const down = _v.copy(heading).multiplyScalar(-1);
  if (power > 0.01) {
    const nFire = Math.floor(10 * power + thin * 6);
    const fireSpeed = 45 + thin * 50;
    for (let i = 0; i < nFire; i++) {
      const p = new THREE.Vector3().lerpVectors(prevNozzle, nozzle, Math.random());
      const v = down.clone().multiplyScalar(fireSpeed * rnd(0.7, 1.1)).add(new THREE.Vector3(rnd(-1, 1), rnd(-1, 1), rnd(-1, 1)).multiplyScalar(4 + thin * 9)).addScaledVector(rocketVel, 0.6);
      const sz = (2.4 + thin * 5) * rnd(0.8, 1.3) * sz2;
      fire.emit(p, v, rnd(0.25, 0.45) * (1 + thin * 0.6), sz, sz * 1.8, [1, 0.85, 0.5], [0.9, 0.25, 0.05], 0.9 * power);
    }
  }
  if (T >= IGNITION) {
    if (alt < 60) {
      const gPower = power * (1 - smoothstep(10, 60, alt));
      for (let i = 0; i < Math.floor(14 * gPower); i++) {
        const side = Math.random() < 0.5 ? 1 : -1, warm = Math.random() < 0.35;
        smoke.emit(new THREE.Vector3(rnd(-2.5, 2.5), rnd(0.8, 3), side * 13), new THREE.Vector3(rnd(-6, 6), rnd(2, 8), side * rnd(18, 42)),
          rnd(6, 10), rnd(3, 5), rnd(16, 28), warm ? [1, 0.7, 0.45] : [0.95, 0.93, 0.9], [0.78, 0.77, 0.76], 0.55, 0.55, 1.2);
      }
      if (T >= LIFTOFF - 0.6) {
        for (let i = 0; i < Math.floor(8 * gPower); i++) {
          const a = Math.random() * Math.PI * 2, r = rnd(4, 9);
          smoke.emit(new THREE.Vector3(Math.cos(a) * r, PAD_TOP + rnd(0.5, 3), Math.sin(a) * r), new THREE.Vector3(Math.cos(a) * rnd(8, 20), rnd(1, 6), Math.sin(a) * rnd(8, 20)),
            rnd(5, 9), rnd(3, 5), rnd(14, 24), [1, 0.75, 0.5], [0.8, 0.79, 0.78], 0.5, 0.5, 1.0);
        }
      }
    }
    if (T >= LIFTOFF && power > 0.05) {
      const dist = nozzle.distanceTo(prevNozzle);
      const n = Math.min(40, 3 + Math.floor(dist / (1.2 + thin * 4)));
      for (let i = 0; i < n; i++) {
        const p = new THREE.Vector3().lerpVectors(prevNozzle, nozzle, Math.random()).addScaledVector(down, 6 + thin * 22);
        const sz = (3 + thin * 16 + alt * 0.004) * (stage2On ? 0.7 : 1);
        smoke.emit(p, new THREE.Vector3(rnd(-1, 1), rnd(-0.5, 1), rnd(-1, 1)).multiplyScalar(2 + thin * 3).addScaledVector(down, 10),
          rnd(6, 10), sz * 0.6, sz * 2.4, [1, 0.72, 0.45], [0.86, 0.84, 0.82], 0.5 * (1 - thin * 0.35) * power, 0.8, 0.4);
      }
    }
  }
  prevNozzle.copy(nozzle);
  smoke.update(dt); fire.update(dt);

  fireLight.position.copy(nozzle).addScaledVector(down, 3);
  fireLight.intensity = power * flicker * 260 * (1 - smoothstep(50, 300, alt));
  fireLight.distance = 140;

  // ---- camera
  let shake = 0;
  if (T >= IGNITION) shake = power * 0.35 * (1 - smoothstep(LIFTOFF + 3, LIFTOFF + 12, T));
  if (T < IGNITION) camera.position.lerp(CAM_HOME, Math.min(1, dt * 1.5));
  else { camera.position.copy(CAM_HOME); camera.position.y += smoothstep(LIFTOFF, LIFTOFF + 12, T) * 6; }
  camera.position.x += (Math.random() - 0.5) * shake;
  camera.position.y += (Math.random() - 0.5) * shake;

  const aimOff = events.sep ? 20 : 13;
  const desired = T < LIFTOFF ? new THREE.Vector3(0, 16, 0) : rocket.position.clone().addScaledVector(heading, aimOff);
  const chase = tau > MECO - 1.5 && tau < FAIR + 4.5;   // fly alongside the rocket to watch staging up close
  if (chase) {
    const center = rocket.position.clone().addScaledVector(heading, events.sep ? 20 : 15);
    const toGround = CAM_HOME.clone().sub(center); toGround.addScaledVector(heading, -toGround.dot(heading)).normalize();
    const c = (tau - (MECO - 1.5)) / (FAIR + 6 - MECO);          // slow drift for a cinematic feel
    camera.position.copy(center).addScaledVector(toGround, 46 - 10 * c).addScaledVector(heading, -14 + 10 * c);
    camera.fov = 38; camera.updateProjectionMatrix();
    lookTarget.copy(center).addScaledVector(heading, -2);
  } else {
    lookTarget.lerp(desired, Math.min(1, dt * (T < LIFTOFF + 4 ? 2.5 : 6)));
  }
  const dist = camera.position.distanceTo(rocket.position);
  if (!chase && tau < 30) {  // zoom lens on the ground camera; afterwards it holds and the rocket shrinks into the sky
    const targetFov = THREE.MathUtils.clamp(2 * Math.atan(48 / dist) * 180 / Math.PI, 3.5, 50);
    camera.fov += (targetFov - camera.fov) * (tau > FAIR ? 1 : Math.min(1, dt * 2.5));
    camera.updateProjectionMatrix();
  }
  camera.lookAt(lookTarget);
  camera.updateMatrixWorld();
  flameGlow.scale.setScalar(Math.max((9 + thin * 10) * power * flicker * sz2, chase ? 0 : dist * 0.012 * power));

  // ---- force arrows (thrust vs gravity)
  const showF = forcesChk.checked && T >= IGNITION - 1 && tau < 24;
  thrustArrow.show(showF); gravityArrow.show(showF); gasArrow.show(false);
  if (showF) {
    const right = new THREE.Vector3().setFromMatrixColumn(camera.matrixWorld, 0);
    const k = events.sep ? 0.7 : 1;
    const fuel1 = 1 - smoothstep(0, MECO, tau);
    const weight = events.sep ? 4.5 : 9 - 3 * (1 - fuel1);
    const base = rocket.position.clone();
    thrustArrow.set(base.clone().addScaledVector(right, 4.5 * k).addScaledVector(heading, events.sep ? 14 : 1), heading, 13 * power * (stage2On ? 0.6 : 1) + 0.01, k);
    gravityArrow.set(base.clone().addScaledVector(right, -4.5 * k).addScaledVector(heading, events.sep ? 20 : 13), new THREE.Vector3(0, -1, 0), weight, k);
  }

  // ---- stats + sound
  if (T >= IGNITION - 1) statsEl.style.opacity = 1;
  if (T <= END) {
    const altM = alt * 1.5, spdKmh = rocketVel.length() * 1.5 * 3.6;
    const f1 = events.sep ? 0 : 1 - smoothstep(0, 1, (T - IGNITION) / (LIFTOFF + MECO - IGNITION)) * 0.97;
    const f2 = 1 - Math.min(1, Math.max(0, tau - IGN2) / 26);
    statsEl.innerHTML = `T${T < LIFTOFF ? '−' : '+'}${Math.abs(T - LIFTOFF).toFixed(1)} s<br>${tr('alt')} ${(altM / 1000).toFixed(2)} km<br>${tr('speed')} ${spdKmh.toFixed(0)} km/h`
      + `<div style="margin-top:6px">${tr('fuel1')}</div><div class="bar"><i style="width:${(f1 * 100).toFixed(0)}%"></i></div>`
      + `<div>${tr('fuel2')}</div><div class="bar"><i style="width:${(f2 * 100).toFixed(0)}%"></i></div>`;
  }
  setRumble(power * 0.9 * (1 - smoothstep(10, 26, tau) * 0.85), 250 + power * 300);

  if (T > END && state === 'run') { state = 'done'; replayBtn.classList.remove('hidden'); exploreBtn.classList.remove('hidden'); }
}

}
function renderInfo() {
  const L = TXT[lang];
  if (view.mech) {
    infoEl.innerHTML = `<h4>${L.mechTitle}</h4><ol>${L.mechSteps.map(s => `<li>${s}</li>`).join('')}</ol><p style="margin:6px 0 0">${L.mechNote}</p>`;
  } else if (view.sel) {
    const [n, d] = L.parts[view.sel];
    infoEl.innerHTML = `<h4>${n}</h4>${d}`;
  } else {
    infoEl.innerHTML = `<h4>${L.intro[0]}</h4>${L.intro[1]}<h4 style="margin-top:8px">${L.sequence[0]}</h4>${L.sequence[1]}`;
  }
  labelEls.forEach(l => l.el.classList.toggle('sel', l.p.id === view.sel));
  [...plistEl.children].forEach(li => li.classList.toggle('sel', li.dataset.id === view.sel));
  $('tCut').classList.toggle('on', view.cut); $('tExp').classList.toggle('on', view.exp); $('tMech').classList.toggle('on', view.mech);
}
function partWorld(p, out) { return out.set(...p.at).applyMatrix4(p.obj.matrixWorld); }
function selectPart(id) {
  view.sel = view.sel === id ? null : id;
  view.mech = false;
  if (view.sel) {
    const p = PARTS.find(q => q.id === id);
    rocket.updateMatrixWorld(true);
    partWorld(p, orbit.tTarget); orbit.tTarget.x = 0; orbit.tTarget.z = 0;
    orbit.tr = 24;
  } else { orbit.tTarget.set(0, ROCKET_BASE_Y + 15, 0); orbit.tr = 50; }
  renderInfo();
}
function enterExplore() {
  if (!audio) startAudio();
  resetScene();
  state = 'explore';
  arms.forEach(a => a.pivot.rotation.y = Math.PI / 2 * 0.95);   // swing service arms out of the way
  orbit.target.set(0, ROCKET_BASE_Y + 15, 0); orbit.tTarget.copy(orbit.target);
  orbit.r = orbit.tr = 50; orbit.az = 0.3; orbit.el = 0.12;
  Object.assign(view, { cut: true, exp: false, mech: false, sel: null });
  camera.fov = 40; camera.updateProjectionMatrix();
  launchBtn.classList.add('hidden'); replayBtn.classList.add('hidden'); exploreBtn.classList.add('hidden'); forcesEl.classList.add('hidden');
  panelEl.classList.remove('hidden'); labelsEl.classList.remove('hidden'); linesEl.classList.remove('hidden');
  buildLabels(); renderInfo();
}
function exitExplore(toIdle = true) {
  if (state !== 'explore') return;
  headLight.intensity = 0;
  panelEl.classList.add('hidden'); labelsEl.classList.add('hidden'); linesEl.classList.add('hidden');
  setHighlight(null);
  stage2.position.set(0, 0, 0); payload.position.set(0, 0, 0); fairA.position.set(0, 0, 0); fairB.position.set(0, 0, 0);
  if (toIdle) { resetScene(); state = 'idle'; launchBtn.classList.remove('hidden'); exploreBtn.classList.remove('hidden'); }
}
exploreBtn.onclick = enterExplore;
$('pClose').onclick = () => exitExplore(true);
$('tCut').onclick = () => { view.cut = !view.cut; renderInfo(); };
$('tExp').onclick = () => {
  view.exp = !view.exp; view.mech = false;
  if (!view.sel) { orbit.tTarget.set(0, ROCKET_BASE_Y + (view.exp ? 20 : 15), 0); orbit.tr = view.exp ? 66 : 50; }
  renderInfo();
};
$('tMech').onclick = () => {
  view.mech = !view.mech;
  if (view.mech) { view.sel = null; view.exp = false; view.cut = true; orbit.tTarget.set(0, ROCKET_BASE_Y + 4, 0); orbit.tr = 30; }
  else { orbit.tTarget.set(0, ROCKET_BASE_Y + 15, 0); orbit.tr = 50; }
  renderInfo();
};

// orbit controls (mouse + touch, incl. pinch)
const pointers = new Map(); let pinch0 = 0;
renderer.domElement.addEventListener('pointerdown', e => { if (state !== 'explore') return; pointers.set(e.pointerId, { x: e.clientX, y: e.clientY }); renderer.domElement.setPointerCapture(e.pointerId); });
renderer.domElement.addEventListener('pointermove', e => {
  if (state !== 'explore' || !pointers.has(e.pointerId)) return;
  const prev = pointers.get(e.pointerId);
  if (pointers.size === 1) {
    orbit.az -= (e.clientX - prev.x) * 0.006;
    orbit.el = THREE.MathUtils.clamp(orbit.el + (e.clientY - prev.y) * 0.004, -0.3, 1.3);
  }
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pointers.size === 2) {
    const [a, b] = [...pointers.values()], d = Math.hypot(a.x - b.x, a.y - b.y);
    if (pinch0) orbit.tr = THREE.MathUtils.clamp(orbit.tr * pinch0 / d, 10, 110);
    pinch0 = d;
  }
});
const endPtr = e => { pointers.delete(e.pointerId); if (pointers.size < 2) pinch0 = 0; };
renderer.domElement.addEventListener('pointerup', endPtr);
renderer.domElement.addEventListener('pointercancel', endPtr);
renderer.domElement.addEventListener('wheel', e => { if (state !== 'explore') return; e.preventDefault(); orbit.tr = THREE.MathUtils.clamp(orbit.tr * Math.pow(1.1, Math.sign(e.deltaY)), 10, 110); }, { passive: false });

function setHighlight(id, pulse = 0) {
  for (const [k, mats] of Object.entries(partMats)) {
    const on = k === id;
    for (const m of mats) {
      if (m.emissive) { if (on) m.emissive.setHex(0xffc400); else m.emissive.copy(m.userData.baseEm || new THREE.Color(0)); m.emissiveIntensity = on ? 0.25 + 0.35 * pulse : 1; }
      if (k === 'interstage') m.opacity = on ? 0.2 + 0.25 * pulse : 0;
    }
  }
}

function updateExplore(dt, time) {
  smoke.update(dt); fire.update(dt);
  // camera orbit
  const k = Math.min(1, dt * 4);
  orbit.r += (orbit.tr - orbit.r) * k;
  orbit.target.lerp(orbit.tTarget, k);
  const ce = Math.cos(orbit.el), R = orbit.r * Math.max(1, 1.25 / camera.aspect);   // pull back on portrait screens
  camera.position.set(orbit.target.x + R * ce * Math.sin(orbit.az), Math.max(1, orbit.target.y + R * Math.sin(orbit.el)), orbit.target.z + R * ce * Math.cos(orbit.az));
  camera.lookAt(orbit.target);
  if (innerWidth > 800) camera.setViewOffset(innerWidth, innerHeight, 170, 0, innerWidth, innerHeight); else camera.setViewOffset(innerWidth, innerHeight, 0, innerHeight * 0.18, innerWidth, innerHeight);
  camera.updateProjectionMatrix();
  camera.updateMatrixWorld();

  headLight.intensity = 1.6;
  // cutaway plane always faces the viewer, through the rocket axis
  if (view.cut) {
    const n = new THREE.Vector3(camera.position.x, 0, camera.position.z).normalize().negate();
    cutPlane.normal.copy(n); cutPlane.constant = 0;
  } else cutPlane.constant = 1e6;

  // exploded view
  view.expT += ((view.exp ? 1 : 0) - view.expT) * Math.min(1, dt * 3);
  const e = view.expT;
  stage2.position.y = 5 * e;
  payload.position.y = 9 * e;
  fairA.position.set(3.2 * e, 12 * e, 0); fairB.position.set(-3.2 * e, 12 * e, 0);
  rocket.updateMatrixWorld(true);

  // highlight selected part
  setHighlight(view.sel, 0.5 + 0.5 * Math.sin(time * 5));

  // "how it works": propellant flow + flame + arrows
  flowLox.visible = flowFuel.visible = view.mech;
  if (view.mech) updateFlow(time);
  const pw = view.mech ? 0.75 : 0;
  outerFlame.visible = innerFlame.visible = flameGlow.visible = pw > 0;
  const fl = 0.9 + Math.random() * 0.15;
  outerFlame.material.uniforms.power.value = innerFlame.material.uniforms.power.value = pw * fl;
  outerFlame.material.uniforms.time.value = innerFlame.material.uniforms.time.value = time;
  outerFlame.scale.set(1, 6 * fl, 1); innerFlame.scale.set(1, 3.3 * fl, 1);
  flameGlow.scale.setScalar(6 * fl); flameGlow.material.opacity = pw;
  fireLight.position.set(0, ROCKET_BASE_Y - 2, 0); fireLight.intensity = pw * 80;
  thrustArrow.show(view.mech); gasArrow.show(view.mech); gravityArrow.show(false);
  if (view.mech) {
    const right = new THREE.Vector3().setFromMatrixColumn(camera.matrixWorld, 0);
    thrustArrow.set(new THREE.Vector3(0, ROCKET_BASE_Y + 3, 0).addScaledVector(right, -4.2), UP, 10, 0.55);
    gasArrow.set(new THREE.Vector3(0, ROCKET_BASE_Y - 0.6, 0).addScaledVector(right, 2.2), new THREE.Vector3(0, -1, 0), 4.5, 0.55);
  }

  // labels: project anchors to screen, then spread them on two sides so they don't overlap
  const W = innerWidth, H = innerHeight, items = [];
  const center = new THREE.Vector3(0, ROCKET_BASE_Y + 15, 0).project(camera);
  const cx = (center.x + 1) / 2 * W;
  labelEls.forEach((l, i) => {
    const w = partWorld(l.p, new THREE.Vector3()).project(camera);
    const x = (w.x + 1) / 2 * W, y = (1 - w.y) / 2 * H;
    const visible = w.z < 1 && x > -50 && x < W + 50 && (!view.mech || MECH_PARTS.includes(l.p.id));
    items.push({ l, x, y, visible, side: i % 2 ? 1 : -1 });
  });
  const off = W <= 800 ? 46 : 130;
  for (const side of [-1, 1]) {
    const col = items.filter(it => it.side === side && it.visible).sort((a, b) => a.y - b.y);
    let last = -1e9;
    for (const it of col) { it.ly = Math.max(it.y, last + 28); last = it.ly; }
  }
  let svg = '';
  for (const it of items) {
    const { el, dot } = it.l;
    el.style.display = dot.style.display = it.visible ? '' : 'none';
    if (!it.visible) continue;
    const lx = cx + it.side * off;
    dot.style.left = it.x + 'px'; dot.style.top = it.y + 'px';
    el.style.top = it.ly + 'px';
    if (it.side > 0) { el.style.left = lx + 'px'; el.style.right = ''; }
    else { el.style.left = ''; el.style.right = (W - lx) + 'px'; }
    const sel = it.l.p.id === view.sel;
    svg += `<line x1="${it.x}" y1="${it.y}" x2="${lx}" y2="${it.ly}" stroke="${sel ? '#ffd23f' : 'rgba(255,255,255,.65)'}" stroke-width="${sel ? 2.5 : 1.2}"/>`;
  }
  linesEl.innerHTML = svg;
}

// ---------------------------------------------------------------- language
function applyLang() {
  document.documentElement.lang = lang;
  $('title').textContent = tr('title'); $('back').textContent = tr('back'); $('langBtn').textContent = tr('lang');
  launchBtn.textContent = tr('launch'); replayBtn.textContent = tr('replay'); exploreBtn.textContent = tr('explore');
  $('forcesTxt').textContent = tr('forces');
  $('pTitle').textContent = tr('pTitle'); $('pClose').textContent = tr('close');
  $('tCut').textContent = tr('cut'); $('tExp').textContent = tr('exp'); $('tMech').textContent = tr('mech');
  $('hint').textContent = tr('hint');
  setArrowTexts();
  if (state === 'explore') { buildLabels(); renderInfo(); }
}
$('langBtn').onclick = () => { lang = lang === 'ja' ? 'fr' : 'ja'; try { localStorage.setItem('rocketLang', lang); } catch (e) {} applyLang(); };
applyLang();
resetScene();

// ---------------------------------------------------------------- loop
const clock = new THREE.Clock();
const SPEED = Math.min(8, Math.max(0.1, parseFloat(new URLSearchParams(location.search).get('speed')) || 1));
function frame() {
  const dt = Math.min(clock.getDelta(), 1 / 20) * SPEED;
  const time = clock.elapsedTime;
  const blink = (Math.floor(time * 1.5) % 2) === 0;
  warnLights.forEach(l => l.material.color.setHex(blink ? 0xff2020 : 0x330505));
  rocket.updateMatrixWorld();
  if (state === 'explore') updateExplore(dt, time);
  else if (state === 'done') { state = 'run'; update(dt, time); state = 'done'; }
  else update(dt, time);
  sky.position.copy(camera.position);
  const scale = renderer.domElement.height / (2 * Math.tan(THREE.MathUtils.degToRad(camera.fov) / 2));
  smoke.mat.uniforms.scale.value = scale; fire.mat.uniforms.scale.value = scale;
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
frame();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
