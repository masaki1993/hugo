<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>本気のドッジボール</title>
    <link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Kaisei+Opti:wght@500;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            overflow: hidden;
            background:
                radial-gradient(circle at 20% 15%, rgba(255, 236, 150, 0.22), transparent 32%),
                radial-gradient(circle at 85% 18%, rgba(122, 205, 255, 0.20), transparent 30%),
                linear-gradient(135deg, #271a12 0%, #48311f 42%, #181c25 100%);
            color: #fff6dc;
            font-family: 'DotGothic16', monospace;
            touch-action: none;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            background-image:
                linear-gradient(rgba(255,255,255,0.035) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
            background-size: 34px 34px;
            mix-blend-mode: overlay;
        }

        #arena {
            display: block;
            width: 100vw;
            height: 100vh;
        }

        .topbar {
            position: fixed;
            top: 16px;
            left: 16px;
            right: 16px;
            z-index: 4;
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            gap: 12px;
            align-items: start;
            pointer-events: none;
        }

        .score-card,
        .help-card {
            border: 2px solid rgba(255, 246, 220, 0.35);
            border-radius: 16px;
            background: rgba(24, 18, 13, 0.58);
            box-shadow: 0 18px 50px rgba(0, 0, 0, 0.24), inset 0 1px 0 rgba(255,255,255,0.16);
            backdrop-filter: blur(10px);
            padding: 12px 14px;
        }

        .score-card {
            width: min(320px, 44vw);
        }

        .score-card.right {
            justify-self: end;
        }

        .label {
            display: flex;
            justify-content: space-between;
            color: #f6d887;
            font-size: clamp(0.72rem, 1.8vw, 0.9rem);
            letter-spacing: 0.08em;
        }

        .count {
            margin-top: 8px;
            font-family: 'Kaisei Opti', serif;
            font-size: clamp(1.55rem, 4vw, 2.5rem);
            font-weight: 700;
            line-height: 1;
        }

        .meter {
            height: 8px;
            margin-top: 10px;
            overflow: hidden;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.16);
        }

        .meter > span {
            display: block;
            width: 100%;
            height: 100%;
            border-radius: inherit;
            transition: width 0.35s ease;
        }

        #allyMeter {
            background: linear-gradient(90deg, #66f2ff, #f9f871);
        }

        #rivalMeter {
            background: linear-gradient(90deg, #ff705f, #ffd15c);
        }

        .help-card {
            justify-self: center;
            text-align: center;
            max-width: 360px;
            font-size: clamp(0.72rem, 1.6vw, 0.95rem);
            line-height: 1.6;
            color: #fff9e7;
        }

        .help-card strong {
            color: #7ff7ff;
            font-weight: 400;
        }

        .button-row {
            position: fixed;
            left: 18px;
            bottom: 18px;
            z-index: 5;
            display: flex;
            gap: 10px;
        }

        button,
        .home-link {
            border: 2px solid rgba(255, 246, 220, 0.42);
            border-radius: 999px;
            background: rgba(255, 246, 220, 0.12);
            color: #fff6dc;
            cursor: pointer;
            font: 400 0.92rem/1 'DotGothic16', monospace;
            letter-spacing: 0.04em;
            padding: 12px 18px;
            text-decoration: none;
            transition: transform 0.15s ease, background 0.15s ease;
        }

        button:hover,
        .home-link:hover {
            transform: translateY(-2px);
            background: rgba(255, 246, 220, 0.22);
        }

        .overlay {
            position: fixed;
            inset: 0;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: rgba(14, 10, 8, 0.72);
            backdrop-filter: blur(8px);
            text-align: center;
        }

        .overlay.hidden {
            display: none;
        }

        .panel {
            position: relative;
            width: min(680px, 92vw);
            overflow: hidden;
            border: 3px solid rgba(255, 246, 220, 0.62);
            border-radius: 28px;
            background:
                linear-gradient(135deg, rgba(91, 49, 27, 0.96), rgba(22, 31, 43, 0.96)),
                repeating-linear-gradient(45deg, rgba(255,255,255,0.05) 0 8px, transparent 8px 20px);
            box-shadow: 0 40px 90px rgba(0,0,0,0.45);
            padding: clamp(28px, 7vw, 56px);
        }

        .panel::before {
            content: "DODGEBALL";
            position: absolute;
            top: 10px;
            right: -18px;
            color: rgba(255,255,255,0.07);
            font-family: 'Kaisei Opti', serif;
            font-size: clamp(3rem, 12vw, 7rem);
            font-weight: 700;
            letter-spacing: 0.08em;
            transform: rotate(7deg);
        }

        h1 {
            position: relative;
            font-family: 'Kaisei Opti', serif;
            font-size: clamp(2.2rem, 8vw, 5rem);
            line-height: 1;
            color: #fff0a8;
            text-shadow: 0 8px 0 #762d21, 0 20px 36px rgba(0,0,0,0.45);
        }

        .panel p {
            position: relative;
            max-width: 500px;
            margin: 22px auto 0;
            color: #fff9e7;
            font-size: clamp(0.95rem, 2.4vw, 1.12rem);
            line-height: 1.9;
        }

        .start {
            position: relative;
            margin-top: 28px;
            background: linear-gradient(180deg, #fff0a8, #ffb84e);
            color: #29180d;
            border-color: #fff6dc;
            box-shadow: 0 12px 0 #7e3421, 0 22px 34px rgba(0,0,0,0.35);
            font-family: 'Kaisei Opti', serif;
            font-size: 1.25rem;
            font-weight: 700;
            padding: 15px 38px;
        }

        .touch-pad {
            position: fixed;
            right: 18px;
            bottom: 18px;
            z-index: 5;
            display: none;
            gap: 10px;
        }

        .touch-pad button {
            width: 72px;
            height: 72px;
            padding: 0;
            background: rgba(127, 247, 255, 0.18);
            font-size: 0.8rem;
            pointer-events: auto;
        }

        @media (max-width: 760px) {
            .topbar {
                grid-template-columns: 1fr 1fr;
                align-items: stretch;
            }

            .help-card {
                grid-column: 1 / -1;
                order: 3;
                max-width: none;
            }

            .score-card {
                width: auto;
            }

            .touch-pad {
                display: flex;
            }

            .button-row {
                bottom: 104px;
            }
        }
    </style>
</head>
<body>
    <canvas id="arena"></canvas>

    <div class="topbar">
        <section class="score-card">
            <div class="label"><span>なかま</span><span>内野</span></div>
            <div class="count"><span id="allyCount">12</span> / <span class="teamTotal">12</span></div>
            <div class="meter"><span id="allyMeter"></span></div>
        </section>
        <section class="help-card">
            <strong>移動</strong> 矢印/WASD　
            <strong>投げる</strong> Space/クリック　
            <strong>狙い</strong> マウス/タッチ
        </section>
        <section class="score-card right">
            <div class="label"><span>あいて</span><span>内野</span></div>
            <div class="count"><span id="rivalCount">12</span> / <span class="teamTotal">12</span></div>
            <div class="meter"><span id="rivalMeter"></span></div>
        </section>
    </div>

    <div class="button-row">
        <button id="resetButton" type="button">リスタート</button>
        <a class="home-link" href="index.html">ゲーム選択</a>
    </div>

    <div class="touch-pad" aria-hidden="true">
        <button id="catchButton" type="button">よける</button>
        <button id="throwButton" type="button">投げる</button>
    </div>

    <div id="startOverlay" class="overlay">
        <div class="panel">
            <h1>本気の<br>ドッジボール</h1>
            <p>
                12対12の本気ドッジボール。味方は勝手に攻撃せず、ボールを取ったら「ぼく」へパス。
                相手はだんだん強く投げてくる。よけて、拾って、自分で当てよう。
            </p>
            <button id="startButton" class="start" type="button">試合開始</button>
        </div>
    </div>

    <div id="finishOverlay" class="overlay hidden">
        <div class="panel">
            <h1 id="finishTitle">勝ち！</h1>
            <p id="finishText">全員に当てた！もう一回やる？</p>
            <button id="againButton" class="start" type="button">もう一回</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('arena');
        const ctx = canvas.getContext('2d');
        const allyCountEl = document.getElementById('allyCount');
        const rivalCountEl = document.getElementById('rivalCount');
        const allyMeterEl = document.getElementById('allyMeter');
        const rivalMeterEl = document.getElementById('rivalMeter');
        const startOverlay = document.getElementById('startOverlay');
        const finishOverlay = document.getElementById('finishOverlay');
        const finishTitle = document.getElementById('finishTitle');
        const finishText = document.getElementById('finishText');

        const keys = new Set();
        const pointer = { x: 0, y: 0, down: false };
        const court = { x: 0, y: 0, w: 0, h: 0, mid: 0, outer: 76 };
        const TEAM_TOTAL = 12;
        const teams = [];
        const dust = [];
        const sparks = [];
        let ball;
        let running = false;
        let lastTime = 0;
        let matchTime = 0;
        let shake = 0;
        let gameOver = false;

        const teamStyle = {
            ally: { body: '#54dfff', trim: '#fff0a8', dark: '#0c5262' },
            rival: { body: '#ff695c', trim: '#ffd25a', dark: '#6b1f18' }
        };

        function resize() {
            const dpr = Math.min(window.devicePixelRatio || 1, 2);
            canvas.width = Math.floor(window.innerWidth * dpr);
            canvas.height = Math.floor(window.innerHeight * dpr);
            canvas.style.width = `${window.innerWidth}px`;
            canvas.style.height = `${window.innerHeight}px`;
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

            const padX = Math.max(22, window.innerWidth * 0.06);
            const padY = Math.max(172, window.innerHeight * 0.23);
            court.x = padX;
            court.y = padY;
            court.w = window.innerWidth - padX * 2;
            court.h = window.innerHeight - padY * 1.34;
            court.mid = court.x + court.w / 2;
            court.outer = Math.max(58, Math.min(92, court.w * 0.09));
            pointer.x = court.x + court.w * 0.3;
            pointer.y = court.y + court.h * 0.5;
            placePlayers();
        }

        function resetGame() {
            teams.length = 0;
            dust.length = 0;
            sparks.length = 0;
            gameOver = false;
            matchTime = 0;
            shake = 0;
            createTeam('ally', TEAM_TOTAL, court.x + court.w * 0.18);
            createTeam('rival', TEAM_TOTAL, court.x + court.w * 0.82);
            ball = {
                x: court.mid,
                y: court.y + court.h / 2,
                vx: 0,
                vy: 0,
                r: 13,
                holder: null,
                thrower: null,
                target: null,
                lastTeam: null,
                cooldown: 0,
                spin: 0
            };
            updateHud();
        }

        function createTeam(team, count, startX) {
            for (let i = 0; i < count; i++) {
                const row = i % 4;
                const col = Math.floor(i / 4);
                const side = team === 'ally' ? 1 : -1;
                const player = {
                    id: `${team}-${i}`,
                    team,
                    name: team === 'ally' && i === 0 ? 'ぼく' : `${team === 'ally' ? 'とも' : 'てき'}${i + 1}`,
                    x: startX + col * 48 * side + (row % 2) * 10 * side,
                    y: court.y + court.h * (0.18 + row * 0.21),
                    vx: 0,
                    vy: 0,
                    r: team === 'ally' && i === 0 ? 17 : 15,
                    speed: team === 'ally' && i === 0 ? 230 : 145 + Math.random() * 28,
                    active: true,
                    isUser: team === 'ally' && i === 0,
                    aiTimer: Math.random(),
                    dodgeUntil: 0,
                    throwTimer: 0.5 + Math.random(),
                    targetX: startX,
                    targetY: court.y + court.h / 2,
                    blink: 0
                };
                teams.push(player);
            }
        }

        function placePlayers() {
            if (!teams.length) return;
            for (const player of teams) {
                clampToZone(player);
            }
            if (ball && !ball.holder) {
                ball.x = Math.max(court.x - court.outer, Math.min(court.x + court.w + court.outer, ball.x));
                ball.y = Math.max(court.y - court.outer, Math.min(court.y + court.h + court.outer, ball.y));
            }
        }

        function loop(now) {
            const dt = Math.min(0.033, (now - lastTime) / 1000 || 0.016);
            lastTime = now;
            if (running && !gameOver) update(dt);
            draw();
            requestAnimationFrame(loop);
        }

        function update(dt) {
            matchTime += dt;
            for (const player of teams) {
                if (player.isUser) updateUser(player, dt);
                else updateAi(player, dt);
                separatePlayers(player, dt);
                player.blink = Math.max(0, player.blink - dt);
                clampToZone(player);
            }

            updateBall(dt);
            updateEffects(dt);
            checkWin();
            shake = Math.max(0, shake - dt * 24);
        }

        function updateUser(player, dt) {
            let ax = 0;
            let ay = 0;
            if (keys.has('arrowleft') || keys.has('a')) ax -= 1;
            if (keys.has('arrowright') || keys.has('d')) ax += 1;
            if (keys.has('arrowup') || keys.has('w')) ay -= 1;
            if (keys.has('arrowdown') || keys.has('s')) ay += 1;
            const len = Math.hypot(ax, ay) || 1;
            const lastBoost = isLastInner(player) ? 1.35 : 1;
            player.vx = (ax / len) * player.speed * lastBoost;
            player.vy = (ay / len) * player.speed * lastBoost;
            player.x += player.vx * dt;
            player.y += player.vy * dt;

            if (Math.hypot(player.vx, player.vy) > 30) {
                addDust(player.x, player.y + player.r, 1);
            }
        }

        function updateAi(player, dt) {
            player.aiTimer -= dt;
            player.throwTimer -= dt;

            const enemies = livingPlayers(opposite(player.team), true);
            const chaser = ballChaser(player.team);
            const incoming = isIncomingBall(player);
            const nearbyBall = ball && !ball.holder && Math.hypot(ball.x - player.x, ball.y - player.y) < 210;

            if (incoming && nearbyBall && chaser !== player) {
                const dodgeDir = ball.y < player.y ? 1 : -1;
                player.targetX = player.x + (player.team === 'ally' ? -18 : 18);
                player.targetY = player.y + dodgeDir * 120;
                player.dodgeUntil = 0.18;
            } else if (ball.holder === player && enemies.length) {
                const target = passOrThrowTarget(player, enemies);
                player.targetX = player.x + (player.team === 'ally' ? 10 : -22);
                player.targetY = target.y + Math.sin(performance.now() * 0.004 + player.aiTimer) * 26;
                if (player.throwTimer <= 0) throwBall(player, target.x, target.y, target);
            } else if (!ball.holder && chaser === player) {
                player.targetX = ball.x;
                player.targetY = ball.y;
            } else if (!ball.holder && canReachBall(player)) {
                chooseSupportPosition(player);
            } else if (player.team === 'ally') {
                chooseHomePosition(player);
            } else if (player.aiTimer <= 0) {
                choosePatrol(player);
                player.aiTimer = 1.15 + Math.random() * 1.35;
            }

            const calm = player.team === 'ally' && !player.isUser ? 0.72 : 1;
            moveToward(player, player.targetX, player.targetY, dt, (player.dodgeUntil > 0 ? 1.35 : 1) * calm);
            player.dodgeUntil = Math.max(0, player.dodgeUntil - dt);
        }

        function isIncomingBall(player) {
            if (!ball || ball.holder || ball.lastTeam === player.team) return false;
            return player.team === 'ally' ? ball.vx < -120 : ball.vx > 120;
        }

        function ballChaser(team) {
            if (!ball || ball.holder) return null;
            if (isProtectedOutfieldPass(team)) return null;
            const candidates = teams.filter(player => !player.isUser && player.team === team && canReachBall(player));
            return nearest(ball, candidates);
        }

        function isProtectedOutfieldPass(team) {
            return team === 'rival'
                && ball.lastTeam === 'ally'
                && ball.target
                && ball.target.isUser
                && !ball.target.active;
        }

        function bestThrowTarget(player, enemies) {
            const activeEnemies = enemies.filter(enemy => enemy.active);
            const list = activeEnemies.length ? activeEnemies : enemies;
            const user = enemies.find(enemy => enemy.isUser);
            if (player.team === 'rival' && user) return user;

            let best = null;
            let bestScore = Infinity;
            for (const enemy of list) {
                const lane = Math.abs(enemy.y - player.y);
                const dist = Math.hypot(enemy.x - player.x, enemy.y - player.y);
                const score = lane * 1.7 + dist * 0.35;
                if (score < bestScore) {
                    best = enemy;
                    bestScore = score;
                }
            }
            return best || { x: court.mid, y: court.y + court.h / 2 };
        }

        function passOrThrowTarget(player, enemies) {
            if (player.team === 'ally' && !player.isUser) {
                const user = teams.find(member => member.isUser);
                const activeEnemies = enemies.filter(enemy => enemy.active);
                return user || bestThrowTarget(player, activeEnemies) || { x: court.x + court.w * 0.25, y: court.y + court.h / 2 };
            }
            if (player.team === 'rival' && isUserInOutfield()) {
                return ownOutfieldTarget(player) || nearest(player, teams.filter(member => member.team === player.team && member !== player));
            }
            return bestThrowTarget(player, enemies);
        }

        function isUserInOutfield() {
            const user = teams.find(member => member.isUser);
            return Boolean(user && !user.active);
        }

        function ownOutfieldTarget(player) {
            const outfieldMate = nearest(player, teams.filter(member => member.team === player.team && !member.active));
            return outfieldMate || null;
        }

        function chooseSupportPosition(player) {
            const index = Number(player.id.split('-')[1]) || 0;
            const lanes = [0.18, 0.34, 0.50, 0.66, 0.82, 0.26, 0.74];
            const laneY = court.y + court.h * lanes[index % lanes.length];
            const towardMiddle = player.team === 'ally' ? court.mid - 88 : court.mid + 88;
            const towardBack = player.team === 'ally' ? court.x + court.w * 0.23 : court.x + court.w * 0.77;
            const ballTooClose = ball && Math.hypot(ball.x - player.x, ball.y - player.y) < 120;
            player.targetX = ballTooClose ? towardBack : towardMiddle;
            player.targetY = laneY;
        }

        function chooseHomePosition(player) {
            const index = Number(player.id.split('-')[1]) || 0;
            const col = Math.floor(index / 4);
            const row = index % 4;
            const baseX = court.x + court.w * (0.15 + col * 0.105);
            const baseY = court.y + court.h * (0.18 + row * 0.21);
            player.targetX = baseX + Math.sin(matchTime * 0.7 + index) * 8;
            player.targetY = baseY + Math.cos(matchTime * 0.6 + index) * 6;
        }

        function updateBall(dt) {
            ball.cooldown = Math.max(0, ball.cooldown - dt);
            ball.spin += Math.hypot(ball.vx, ball.vy) * dt * 0.08;

            if (ball.holder) {
                const holder = ball.holder;
                const aim = holder.isUser ? pointer : aimAtEnemy(holder);
                const angle = Math.atan2(aim.y - holder.y, aim.x - holder.x);
                ball.x = holder.x + Math.cos(angle) * (holder.r + ball.r + 4);
                ball.y = holder.y + Math.sin(angle) * (holder.r + ball.r + 4);
                ball.vx = 0;
                ball.vy = 0;
                return;
            }

            ball.x += ball.vx * dt;
            ball.y += ball.vy * dt;
            ball.vx *= Math.pow(0.988, dt * 60);
            ball.vy *= Math.pow(0.988, dt * 60);

            if (Math.hypot(ball.vx, ball.vy) > 280) {
                sparks.push({ x: ball.x, y: ball.y, life: 0.26, r: 18 + Math.random() * 10 });
            }

            bounceBall();
            pickupOrHit();
        }

        function bounceBall() {
            const left = hasOutfieldPlayer('rival') ? court.x - court.outer : court.x;
            const right = hasOutfieldPlayer('ally') ? court.x + court.w + court.outer : court.x + court.w;
            const top = court.y - court.outer * 0.32;
            const bottom = court.y + court.h + court.outer * 0.32;

            if (ball.x - ball.r < left) {
                ball.x = left + ball.r;
                ball.vx = Math.abs(ball.vx) * 0.78;
            }
            if (ball.x + ball.r > right) {
                ball.x = right - ball.r;
                ball.vx = -Math.abs(ball.vx) * 0.78;
            }
            if (ball.y - ball.r < top) {
                ball.y = top + ball.r;
                ball.vy = Math.abs(ball.vy) * 0.78;
            }
            if (ball.y + ball.r > bottom) {
                ball.y = bottom - ball.r;
                ball.vy = -Math.abs(ball.vy) * 0.78;
            }
        }

        function hasOutfieldPlayer(team) {
            return teams.some(player => player.team === team && !player.active);
        }

        function pickupOrHit() {
            const speed = Math.hypot(ball.vx, ball.vy);
            for (const player of teams) {
                if (ball.cooldown > 0) continue;
                const dist = Math.hypot(ball.x - player.x, ball.y - player.y);
                if (dist > ball.r + player.r) continue;

                const canCatch = player.active && ball.lastTeam !== player.team && ballChaser(player.team) === player && speed < 360;
                if (speed < 240 || ball.lastTeam === player.team || canCatch) {
                    holdBall(player);
                    return;
                }

                if (ball.lastTeam && ball.lastTeam !== player.team) {
                    knockOut(player);
                    return;
                }
            }
        }

        function holdBall(player) {
            ball.holder = player;
            ball.thrower = null;
            ball.target = null;
            ball.lastTeam = player.team;
            ball.cooldown = 0.18;
            player.throwTimer = nextThrowDelay(player);
            player.blink = 0.12;
        }

        function throwBall(player, tx, ty, target = null) {
            if (ball.holder !== player || gameOver) return;
            const angle = Math.atan2(ty - player.y, tx - player.x);
            const power = throwPower(player);
            ball.holder = null;
            ball.thrower = player;
            ball.target = target;
            ball.lastTeam = player.team;
            ball.vx = Math.cos(angle) * power;
            ball.vy = Math.sin(angle) * power;
            ball.x = player.x + Math.cos(angle) * (player.r + ball.r + 6);
            ball.y = player.y + Math.sin(angle) * (player.r + ball.r + 6);
            ball.cooldown = player.team === 'ally' && !player.isUser ? 0.18 : 0.08;
            player.throwTimer = nextThrowDelay(player);
            shake = 4;
            for (let i = 0; i < 16; i++) addSpark(ball.x, ball.y, angle + Math.PI + (Math.random() - 0.5) * 1.2);
        }

        function throwPower(player) {
            const lastBoost = isLastInner(player) ? 1.32 : 1;
            if (player.team === 'ally' && !player.isUser) {
                const user = teams.find(member => member.isUser);
                return (user ? 300 : 455) * lastBoost;
            }
            if (player.isUser) return (keys.has(' ') ? 560 : 485) * lastBoost;
            const ramp = Math.min(1, matchTime / 95);
            return (390 + ramp * 115 + Math.random() * 45) * lastBoost;
        }

        function nextThrowDelay(player) {
            if (player.team === 'ally' && !player.isUser) {
                const user = teams.find(member => member.isUser);
                return user ? 0.22 : (isLastInner(player) ? 0.35 : 0.62);
            }
            const ramp = Math.min(1, matchTime / 90);
            const lastBonus = isLastInner(player) ? 0.35 : 0;
            return Math.max(0.38, 1.45 - ramp * 0.65 - lastBonus + Math.random() * 0.55);
        }

        function knockOut(player) {
            const victimWasActive = player.active;
            const returner = victimWasActive && ball.thrower && !ball.thrower.active && ball.thrower.team !== player.team
                ? ball.thrower
                : null;
            player.active = false;
            player.blink = 0.45;
            ball.vx *= -0.35;
            ball.vy *= -0.35;
            ball.cooldown = 0.3;
            shake = 10;
            for (let i = 0; i < 28; i++) addSpark(player.x, player.y, Math.random() * Math.PI * 2);
            sendToOuter(player);
            if (returner) returnToInner(returner);
            ball.thrower = null;
            updateHud();
        }

        function returnToInner(player) {
            player.active = true;
            player.blink = 0.7;
            const index = Number(player.id.split('-')[1]) || 0;
            const row = index % 4;
            const col = Math.floor(index / 4);
            if (player.team === 'ally') {
                player.x = court.x + court.w * (0.16 + col * 0.09);
            } else {
                player.x = court.x + court.w * (0.84 - col * 0.09);
            }
            player.y = court.y + court.h * (0.18 + row * 0.21);
            player.targetX = player.x;
            player.targetY = player.y;
        }

        function sendToOuter(player) {
            const rightOuter = player.team === 'ally';
            player.x = rightOuter ? court.x + court.w + court.outer * 0.62 : court.x - court.outer * 0.62;
            player.y = court.y + court.h * (0.18 + Math.random() * 0.64);
            player.targetX = player.x;
            player.targetY = player.y;
        }

        function canReachBall(player) {
            if (!ball || ball.holder) return false;
            const nearCenter = Math.abs(ball.x - court.mid) < 24;
            if (player.active) {
                return player.team === 'ally'
                    ? ball.x < court.mid + 8 || nearCenter
                    : ball.x > court.mid - 8 || nearCenter;
            }
            return player.team === 'ally'
                ? ball.x > court.x + court.w - court.outer * 0.45
                : ball.x < court.x + court.outer * 0.45;
        }

        function separatePlayers(player, dt) {
            for (const other of teams) {
                if (other === player || other.team !== player.team || other.active !== player.active) continue;
                const dx = player.x - other.x;
                const dy = player.y - other.y;
                const dist = Math.hypot(dx, dy) || 1;
                const minDist = player.r + other.r + 13;
                if (dist >= minDist) continue;

                const push = (minDist - dist) * 0.5;
                player.x += (dx / dist) * push * dt * 18;
                player.y += (dy / dist) * push * dt * 18;
            }
        }

        function clampToZone(player) {
            if (!court.w) return;
            const top = court.y + player.r + 6;
            const bottom = court.y + court.h - player.r - 6;
            let minX;
            let maxX;

            if (player.active) {
                if (player.team === 'ally') {
                    minX = court.x + player.r + 8;
                    maxX = court.mid - player.r - 10;
                } else {
                    minX = court.mid + player.r + 10;
                    maxX = court.x + court.w - player.r - 8;
                }
            } else if (player.team === 'ally') {
                minX = court.x + court.w - player.r - 16;
                maxX = court.x + court.w + court.outer - player.r;
            } else {
                minX = court.x - court.outer + player.r;
                maxX = court.x + player.r + 16;
            }

            player.x = Math.max(minX, Math.min(maxX, player.x));
            player.y = Math.max(top, Math.min(bottom, player.y));
        }

        function choosePatrol(player) {
            const y = court.y + court.h * (0.18 + Math.random() * 0.64);
            if (player.active) {
                const left = player.team === 'ally' ? court.x + 32 : court.mid + 46;
                const right = player.team === 'ally' ? court.mid - 46 : court.x + court.w - 32;
                player.targetX = left + Math.random() * (right - left);
                player.targetY = y;
            } else {
                player.targetX = player.team === 'ally'
                    ? court.x + court.w + court.outer * (0.25 + Math.random() * 0.55)
                    : court.x - court.outer * (0.25 + Math.random() * 0.55);
                player.targetY = y;
            }
        }

        function moveToward(player, tx, ty, dt, boost) {
            const dx = tx - player.x;
            const dy = ty - player.y;
            const len = Math.hypot(dx, dy) || 1;
            const lastBoost = isLastInner(player) ? 1.35 : 1;
            const speed = player.speed * boost * lastBoost * (player.active ? 1 : 0.82);
            player.vx = (dx / len) * Math.min(speed, len / Math.max(dt, 0.001));
            player.vy = (dy / len) * Math.min(speed, len / Math.max(dt, 0.001));
            player.x += player.vx * dt;
            player.y += player.vy * dt;
            if (Math.hypot(player.vx, player.vy) > 45) addDust(player.x, player.y + player.r, 0.6);
        }

        function aimAtEnemy(player) {
            const enemies = livingPlayers(opposite(player.team), true);
            const target = passOrThrowTarget(player, enemies) || { x: court.mid, y: court.y + court.h / 2 };
            return target;
        }

        function livingPlayers(team, includeOuter) {
            return teams.filter(player => player.team === team && (player.active || includeOuter));
        }

        function activeCount(team) {
            return teams.filter(player => player.team === team && player.active).length;
        }

        function isLastInner(player) {
            return player.active && activeCount(player.team) === 1;
        }

        function nearest(from, list) {
            let best = null;
            let bestDist = Infinity;
            for (const item of list) {
                const dist = Math.hypot(item.x - from.x, item.y - from.y);
                if (dist < bestDist) {
                    best = item;
                    bestDist = dist;
                }
            }
            return best;
        }

        function opposite(team) {
            return team === 'ally' ? 'rival' : 'ally';
        }

        function checkWin() {
            const allies = activeCount('ally');
            const rivals = activeCount('rival');
            if (allies > 0 && rivals > 0) return;

            gameOver = true;
            finishOverlay.classList.remove('hidden');
            if (rivals === 0) {
                finishTitle.textContent = '勝ち！';
                finishText.textContent = '相手12人を全員外野へ。自分で決めたナイススロー！';
            } else {
                finishTitle.textContent = '負けた！';
                finishText.textContent = '味方が全員外野へ。もう一回作戦を変えよう。';
            }
        }

        function updateHud() {
            const allies = activeCount('ally');
            const rivals = activeCount('rival');
            allyCountEl.textContent = allies;
            rivalCountEl.textContent = rivals;
            allyMeterEl.style.width = `${(allies / TEAM_TOTAL) * 100}%`;
            rivalMeterEl.style.width = `${(rivals / TEAM_TOTAL) * 100}%`;
        }

        function updateEffects(dt) {
            for (let i = dust.length - 1; i >= 0; i--) {
                const p = dust[i];
                p.life -= dt;
                p.x += p.vx * dt;
                p.y += p.vy * dt;
                if (p.life <= 0) dust.splice(i, 1);
            }
            for (let i = sparks.length - 1; i >= 0; i--) {
                const p = sparks[i];
                p.life -= dt;
                p.x += p.vx * dt;
                p.y += p.vy * dt;
                p.vx *= 0.94;
                p.vy *= 0.94;
                if (p.life <= 0) sparks.splice(i, 1);
            }
        }

        function addDust(x, y, scale) {
            if (Math.random() > 0.38) return;
            dust.push({
                x,
                y,
                vx: (Math.random() - 0.5) * 34,
                vy: -10 - Math.random() * 18,
                r: (3 + Math.random() * 5) * scale,
                life: 0.28 + Math.random() * 0.18
            });
        }

        function addSpark(x, y, angle) {
            const speed = 80 + Math.random() * 240;
            sparks.push({
                x,
                y,
                vx: Math.cos(angle) * speed,
                vy: Math.sin(angle) * speed,
                r: 3 + Math.random() * 5,
                life: 0.26 + Math.random() * 0.22
            });
        }

        function draw() {
            const ox = shake ? (Math.random() - 0.5) * shake : 0;
            const oy = shake ? (Math.random() - 0.5) * shake : 0;
            ctx.save();
            ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
            ctx.translate(ox, oy);
            drawGym();
            drawCourt();
            drawEffects();
            drawPlayers();
            drawBall();
            drawAim();
            ctx.restore();
        }

        function drawGym() {
            const g = ctx.createLinearGradient(0, 0, 0, window.innerHeight);
            g.addColorStop(0, '#2f2418');
            g.addColorStop(0.52, '#543922');
            g.addColorStop(1, '#151a21');
            ctx.fillStyle = g;
            ctx.fillRect(0, 0, window.innerWidth, window.innerHeight);

            ctx.fillStyle = 'rgba(255, 226, 142, 0.16)';
            for (let x = -80; x < window.innerWidth + 80; x += 170) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x + 72, 0);
                ctx.lineTo(x + 210, window.innerHeight);
                ctx.lineTo(x + 120, window.innerHeight);
                ctx.closePath();
                ctx.fill();
            }
        }

        function drawCourt() {
            ctx.save();
            ctx.shadowColor = 'rgba(0,0,0,0.45)';
            ctx.shadowBlur = 28;
            roundRect(court.x, court.y, court.w, court.h, 24);
            const floor = ctx.createLinearGradient(court.x, court.y, court.x + court.w, court.y + court.h);
            floor.addColorStop(0, '#d7964c');
            floor.addColorStop(0.48, '#f2bd67');
            floor.addColorStop(0.52, '#eda656');
            floor.addColorStop(1, '#d07d42');
            ctx.fillStyle = floor;
            ctx.fill();
            ctx.restore();

            ctx.strokeStyle = 'rgba(85, 45, 20, 0.23)';
            ctx.lineWidth = 1;
            for (let x = court.x + 28; x < court.x + court.w; x += 48) {
                ctx.beginPath();
                ctx.moveTo(x, court.y);
                ctx.lineTo(x - 38, court.y + court.h);
                ctx.stroke();
            }

            ctx.strokeStyle = '#fff6dc';
            ctx.lineWidth = 5;
            roundRect(court.x, court.y, court.w, court.h, 24);
            ctx.stroke();

            ctx.setLineDash([16, 12]);
            ctx.beginPath();
            ctx.moveTo(court.mid, court.y + 8);
            ctx.lineTo(court.mid, court.y + court.h - 8);
            ctx.stroke();
            ctx.setLineDash([]);

            ctx.globalAlpha = 0.22;
            ctx.fillStyle = '#ff695c';
            ctx.fillRect(court.x - court.outer, court.y, court.outer, court.h);
            ctx.fillStyle = '#54dfff';
            ctx.fillRect(court.x + court.w, court.y, court.outer, court.h);
            ctx.globalAlpha = 1;

            ctx.fillStyle = 'rgba(255, 246, 220, 0.78)';
            ctx.font = '18px DotGothic16';
            ctx.textAlign = 'center';
            ctx.fillText('外野', court.x - court.outer / 2, court.y + 30);
            ctx.fillText('外野', court.x + court.w + court.outer / 2, court.y + 30);
        }

        function drawPlayers() {
            const ordered = [...teams].sort((a, b) => a.y - b.y);
            for (const player of ordered) drawPlayer(player);
        }

        function drawPlayer(player) {
            const style = teamStyle[player.team];
            ctx.save();
            ctx.translate(player.x, player.y);
            if (!player.active) ctx.globalAlpha = 0.72;
            if (player.blink > 0) ctx.rotate(Math.sin(player.blink * 80) * 0.08);

            ctx.fillStyle = 'rgba(0,0,0,0.28)';
            ctx.beginPath();
            ctx.ellipse(0, player.r + 10, player.r * 1.15, 7, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = style.dark;
            ctx.beginPath();
            ctx.arc(0, -player.r * 0.48, player.r * 0.68, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = style.body;
            roundRect(-player.r * 0.78, -player.r * 0.2, player.r * 1.56, player.r * 1.55, 7);
            ctx.fill();

            ctx.fillStyle = style.trim;
            ctx.fillRect(-player.r * 0.78, player.r * 0.24, player.r * 1.56, 4);

            if (player.isUser) {
                ctx.strokeStyle = '#fff0a8';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.arc(0, 0, player.r + 8 + Math.sin(performance.now() * 0.008) * 2, 0, Math.PI * 2);
                ctx.stroke();
            }

            ctx.fillStyle = '#fff9e7';
            ctx.font = '12px DotGothic16';
            ctx.textAlign = 'center';
            ctx.fillText(player.name, 0, -player.r - 13);

            if (!player.active) {
                ctx.fillStyle = 'rgba(20, 16, 12, 0.65)';
                ctx.fillText('外', 0, 5);
            }
            ctx.restore();
        }

        function drawBall() {
            if (!ball) return;
            ctx.save();
            ctx.translate(ball.x, ball.y);
            ctx.rotate(ball.spin);
            ctx.fillStyle = 'rgba(0,0,0,0.25)';
            ctx.beginPath();
            ctx.ellipse(4, ball.r + 8, ball.r * 0.9, 5, 0, 0, Math.PI * 2);
            ctx.fill();

            const g = ctx.createRadialGradient(-5, -6, 3, 0, 0, ball.r);
            g.addColorStop(0, '#ffffff');
            g.addColorStop(0.42, '#fff7a8');
            g.addColorStop(1, '#ffb84e');
            ctx.fillStyle = g;
            ctx.beginPath();
            ctx.arc(0, 0, ball.r, 0, Math.PI * 2);
            ctx.fill();

            ctx.strokeStyle = '#f26b3a';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(0, 0, ball.r * 0.62, -1.1, 1.9);
            ctx.stroke();
            ctx.beginPath();
            ctx.arc(0, 0, ball.r * 0.62, 2.05, 5.0);
            ctx.stroke();
            ctx.restore();
        }

        function drawAim() {
            const user = teams.find(player => player.isUser);
            if (!user || ball?.holder !== user) return;
            ctx.save();
            ctx.strokeStyle = 'rgba(127, 247, 255, 0.78)';
            ctx.lineWidth = 3;
            ctx.setLineDash([8, 8]);
            ctx.beginPath();
            ctx.moveTo(user.x, user.y);
            ctx.lineTo(pointer.x, pointer.y);
            ctx.stroke();
            ctx.setLineDash([]);
            ctx.fillStyle = 'rgba(127, 247, 255, 0.95)';
            ctx.beginPath();
            ctx.arc(pointer.x, pointer.y, 7, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        }

        function drawEffects() {
            for (const p of dust) {
                ctx.globalAlpha = Math.max(0, p.life * 2.3);
                ctx.fillStyle = '#fff0a8';
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                ctx.fill();
            }
            for (const p of sparks) {
                ctx.globalAlpha = Math.max(0, p.life * 2.5);
                ctx.fillStyle = '#7ff7ff';
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.globalAlpha = 1;
        }

        function roundRect(x, y, w, h, r) {
            ctx.beginPath();
            ctx.moveTo(x + r, y);
            ctx.arcTo(x + w, y, x + w, y + h, r);
            ctx.arcTo(x + w, y + h, x, y + h, r);
            ctx.arcTo(x, y + h, x, y, r);
            ctx.arcTo(x, y, x + w, y, r);
            ctx.closePath();
        }

        function handleThrow() {
            const user = teams.find(player => player.isUser);
            if (user && ball?.holder === user) {
                throwBall(user, pointer.x, pointer.y);
            }
        }

        window.addEventListener('resize', resize);
        window.addEventListener('keydown', event => {
            keys.add(event.key.toLowerCase());
            if (event.key === ' ') event.preventDefault();
        });
        window.addEventListener('keyup', event => {
            if (event.key === ' ') handleThrow();
            keys.delete(event.key.toLowerCase());
        });
        window.addEventListener('pointermove', event => {
            pointer.x = event.clientX;
            pointer.y = event.clientY;
        });
        window.addEventListener('pointerdown', event => {
            pointer.down = true;
            pointer.x = event.clientX;
            pointer.y = event.clientY;
        });
        window.addEventListener('pointerup', event => {
            pointer.down = false;
            pointer.x = event.clientX;
            pointer.y = event.clientY;
            handleThrow();
        });

        document.getElementById('startButton').addEventListener('click', () => {
            startOverlay.classList.add('hidden');
            running = true;
            resetGame();
        });
        document.getElementById('againButton').addEventListener('click', () => {
            finishOverlay.classList.add('hidden');
            running = true;
            resetGame();
        });
        document.getElementById('resetButton').addEventListener('click', () => {
            finishOverlay.classList.add('hidden');
            startOverlay.classList.add('hidden');
            running = true;
            resetGame();
        });
        document.getElementById('throwButton').addEventListener('click', handleThrow);
        document.getElementById('catchButton').addEventListener('click', () => {
            const user = teams.find(player => player.isUser);
            if (!user) return;
            user.targetY = user.y + (ball.y < user.y ? 120 : -120);
        });

        resize();
        resetGame();
        requestAnimationFrame(loop);
    </script>
</body>
</html>
