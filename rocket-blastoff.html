<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>ロケット はっしゃ しれいしつ</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; color: #fff; touch-action: none;
    font-family: "Hiragino Maru Gothic ProN", "Hiragino Sans", "Yu Gothic", "Meiryo", system-ui, sans-serif; user-select: none; -webkit-user-select: none; }
  #cv { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  .hidden { display: none !important; }
  rt { font-size: 55%; font-weight: 700; opacity: .9; }

  #topbar { position: fixed; top: 8px; left: 130px; right: 110px; z-index: 5; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; pointer-events: none; }
  .chip { background: rgba(6,12,28,.72); border: 1px solid rgba(255,255,255,.25); border-radius: 10px; padding: 3px 10px; font-weight: 800; font-size: 14px; white-space: nowrap; }
  #clock { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 18px; color: #ffe27a; }
  #steps { position: fixed; top: 42px; left: 130px; right: 110px; z-index: 5; display: flex; gap: 4px; flex-wrap: wrap; pointer-events: none; }
  #steps span { font-size: 11px; font-weight: 800; padding: 1px 7px; border-radius: 9px; background: rgba(6,12,28,.7); color: #bcd; }
  #steps span.done { background: rgba(60,200,120,.35); color: #dfd; }
  #steps span.now { background: #ffd23f; color: #222; }
  #side { position: fixed; top: 8px; right: 8px; z-index: 6; display: flex; gap: 6px; }
  #side button { background: rgba(6,12,28,.72); color: #fff; border: 1px solid rgba(255,255,255,.35); border-radius: 9px; padding: 4px 9px; font: 800 13px inherit; font-family: inherit; cursor: pointer; }
  #side button.on { background: #2f6bff; }

  .tele { position: fixed; bottom: 10px; z-index: 4; display: flex; gap: 8px; align-items: center; background: rgba(4,8,20,.72);
    border: 1px solid rgba(255,255,255,.2); border-radius: 12px; padding: 6px 10px; pointer-events: none; }
  #tele1 { left: 10px; } #tele2 { right: 10px; flex-direction: row-reverse; text-align: right; }
  .tele canvas { width: 70px; height: 70px; }
  .tele b { display: block; font-size: 12px; letter-spacing: 1px; color: #9fc6ff; }
  .tele .num { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 17px; font-weight: 800; }
  .tele small { font-size: 10px; color: #9ab; margin-left: 2px; }

  #tip { position: fixed; left: 50%; top: 74px; transform: translateX(-50%); z-index: 5; max-width: min(92vw, 760px); text-align: center;
    background: rgba(255,255,255,.94); color: #123; border-radius: 14px; padding: 6px 14px; font-weight: 900; font-size: clamp(14px, 2vw, 19px); box-shadow: 0 4px 0 rgba(0,0,0,.35); pointer-events: none; }
  #tip:empty { display: none; }
  #flash { position: fixed; left: 0; right: 0; top: 30%; text-align: center; z-index: 5; pointer-events: none; font-weight: 900;
    font-size: clamp(24px, 5vw, 54px); text-shadow: 0 3px 0 #000, 0 0 14px #000; opacity: 0; transition: opacity .25s; }

  #fact { position: fixed; left: 50%; bottom: 92px; transform: translateX(-50%); z-index: 5; max-width: min(92vw, 640px); pointer-events: none;
    background: rgba(255,247,214,.96); color: #5a3a00; border-radius: 14px; padding: 6px 14px; font-weight: 800; font-size: clamp(13px, 1.8vw, 16px);
    box-shadow: 0 4px 0 rgba(0,0,0,.3); opacity: 0; transition: opacity .3s; text-align: center; }
  #fact b { color: #c0360a; }
  .gauge { position: fixed; left: 50%; transform: translateX(-50%); z-index: 5; width: min(80vw, 560px); pointer-events: none;
    background: rgba(4,8,20,.75); border: 1px solid rgba(255,255,255,.25); border-radius: 12px; padding: 5px 12px 7px; }
  #gA { top: 110px; } #gS { top: 160px; }
  .gauge .gl { display: flex; justify-content: space-between; font-weight: 800; font-size: 13px; margin-bottom: 3px; }
  .gauge .gl span:last-child { font-family: ui-monospace, Menlo, Consolas, monospace; color: #ffe27a; }
  .gauge .tr { position: relative; height: 16px; background: rgba(255,255,255,.14); border-radius: 8px; overflow: hidden; }
  .gauge .gr { position: absolute; top: 0; bottom: 0; background: rgba(60,220,120,.55); border-left: 2px solid #5f5; border-right: 2px solid #5f5; }
  .gauge .fill { position: absolute; left: 0; top: 0; bottom: 0; background: linear-gradient(90deg, #3a8bff, #7fd3ff); opacity: .75; }
  .gauge .nd { position: absolute; top: -2px; bottom: -2px; width: 4px; margin-left: -2px; background: #ffd23f; box-shadow: 0 0 6px #ff0; border-radius: 2px; }
  .gauge .mk { position: absolute; top: 0; bottom: 0; width: 2px; background: #fff; opacity: .8; }
  .gauge .mkl { position: absolute; top: 0; font-size: 10px; font-weight: 800; transform: translateX(-50%); color: #fff; text-shadow: 0 0 3px #000; }

  #dock { position: fixed; left: 50%; bottom: 12px; transform: translateX(-50%); z-index: 6; display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; width: min(calc(100vw - 470px), 900px); }
  #dock button { min-width: 130px; padding: 10px 16px; border-radius: 16px; border: 3px solid rgba(255,255,255,.85); color: #fff; font-family: inherit; font-weight: 900;
    font-size: 18px; cursor: pointer; box-shadow: 0 5px 0 rgba(0,0,0,.45); background: linear-gradient(#ff7a3d, #d03a10); touch-action: manipulation; }
  #dock button small { display: block; font-size: 11px; font-weight: 700; opacity: .9; }
  #dock button.c2 { background: linear-gradient(#4aa3ff, #1a5fd0); }
  #dock button.c3 { background: linear-gradient(#3fe08a, #12924c); }
  #dock button.c4 { background: linear-gradient(#b48cff, #6a3fd0); }
  #dock button.down { transform: translateY(4px); box-shadow: 0 1px 0 rgba(0,0,0,.45); filter: brightness(1.2); }
  #dock button.dim { opacity: .45; }
  .glow { animation: glow .7s infinite alternate; }
  @keyframes glow { from { box-shadow: 0 5px 0 rgba(0,0,0,.45), 0 0 0 0 rgba(255,230,80,.0); } to { box-shadow: 0 5px 0 rgba(0,0,0,.45), 0 0 0 8px rgba(255,230,80,.9); filter: brightness(1.25); } }
  .steer { position: fixed; bottom: 96px; z-index: 6; width: 76px; height: 76px; border-radius: 50%; border: 3px solid rgba(255,255,255,.8);
    background: rgba(40,80,160,.75); color: #fff; font-size: 30px; font-weight: 900; cursor: pointer; touch-action: none; }
  #stL { left: 14px; } #stR { right: 14px; }
  .steer.down { background: #ffd23f; color: #222; }

  .ov { position: fixed; inset: 0; z-index: 20; display: flex; align-items: center; justify-content: center; background: rgba(2,6,18,.78); padding: 14px; overflow: auto; }
  .box { background: linear-gradient(#ffffff, #e8f1ff); color: #10203a; border-radius: 22px; padding: 18px 22px; width: min(100%, 780px); box-shadow: 0 10px 0 rgba(0,0,0,.35); margin: auto; }
  .box h2 { font-size: clamp(22px, 3.6vw, 32px); color: #0d4fb0; margin-bottom: 6px; line-height: 1.5; }
  .box p, .box li { font-size: clamp(15px, 2vw, 18px); font-weight: 700; line-height: 1.9; }
  .box b { color: #c0360a; }
  .box canvas { display: block; width: 100%; max-width: 560px; margin: 4px auto 8px; border-radius: 14px; background: #0b1630; }
  .bigbtn { display: block; margin: 12px auto 0; padding: 12px 34px; border-radius: 18px; border: 3px solid #fff; color: #fff; font-family: inherit;
    font-weight: 900; font-size: 22px; background: linear-gradient(#ff7a3d, #d03a10); cursor: pointer; box-shadow: 0 6px 0 rgba(0,0,0,.35); }
  .bigbtn.blue { background: linear-gradient(#4aa3ff, #1a5fd0); }
  .row { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  .row .bigbtn { margin: 10px 0 0; }

  #title .box { width: min(100%, 900px); text-align: center; }
  #title h1 { font-size: clamp(26px, 5vw, 46px); color: #0d4fb0; letter-spacing: 2px; }
  .pick { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; margin: 10px 0; }
  .rk { width: min(46%, 380px); min-width: 250px; border-radius: 18px; border: 4px solid #cfe0ff; background: #0b1630; color: #fff; cursor: pointer; padding: 8px; font-family: inherit; text-align: center; }
  .rk.sel { border-color: #ffd23f; box-shadow: 0 0 0 4px rgba(255,210,63,.5); }
  .rk canvas { width: 100%; height: auto; display: block; border-radius: 12px; }
  .rk h3 { font-size: 22px; margin-top: 4px; } .rk p { font-size: 13px; font-weight: 700; opacity: .9; line-height: 1.6; }
  .modes { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  .modes button { min-width: 200px; padding: 10px 16px; border-radius: 16px; border: 3px solid #fff; color: #fff; font-family: inherit; font-weight: 900; font-size: 22px; cursor: pointer; box-shadow: 0 6px 0 rgba(0,0,0,.35); }
  .modes button small { display: block; font-size: 12px; font-weight: 700; }
  .m-ruka { background: linear-gradient(#ff9ad5, #e0569e); } .m-normal { background: linear-gradient(#4aa3ff, #1a5fd0); }
  .keys { font-size: 12px; font-weight: 700; color: #456; margin-top: 10px; line-height: 1.8; }
  .keys kbd { background: #123; color: #fff; border-radius: 5px; padding: 0 6px; margin: 0 2px; font-family: inherit; }

  #resList { list-style: none; margin: 8px 0; }
  #resList li { display: flex; justify-content: space-between; gap: 10px; border-bottom: 1px dashed #b8c8e8; padding: 3px 0; }
  #resList li span:last-child { white-space: nowrap; }
  #resTotal { font-size: clamp(30px, 6vw, 52px); font-weight: 900; text-align: center; color: #d03a10; }
  #resLearn { background: #fff7d6; border-radius: 12px; padding: 8px 14px; margin-top: 8px; }
  #resLearn li { font-size: 15px; line-height: 1.7; margin-left: 18px; }

  @media (max-width: 760px), (max-height: 560px) {
    #topbar, #steps { left: 120px; right: 96px; } #steps { display: none; }
    .chip { font-size: 11px; padding: 2px 6px; } #clock { font-size: 14px; }
    .tele { padding: 4px 6px; gap: 4px; bottom: 6px; } .tele canvas { width: 48px; height: 48px; } .tele .num { font-size: 13px; } .tele b { font-size: 10px; }
    #dock { bottom: 72px; gap: 6px; width: 96vw; }
    #fact { bottom: 150px; } #dock button { min-width: 96px; font-size: 14px; padding: 7px 10px; border-radius: 12px; }
    .steer { width: 58px; height: 58px; bottom: 72px; font-size: 24px; }
    #gA { top: 70px; } #gS { top: 114px; } .gauge { width: min(70vw, 460px); padding: 3px 8px 5px; } .gauge .gl { font-size: 11px; }
    #tip { top: 40px; font-size: 13px; padding: 4px 10px; }
  }
  @media (max-aspect-ratio: 1/1) {
    #gA { top: 74px; bottom: auto; } #gS { top: 120px; bottom: auto; }
    #tip { top: 40px; }
    #fact { bottom: 150px; }
  }
  @media (max-height: 520px) {
    .tele { display: none; }
    #gA { top: 66px; bottom: auto; } #gS { top: 108px; bottom: auto; }
    #dock { bottom: 8px; } .steer { bottom: 8px; }
    #tip { top: 36px; }
  }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="topbar"><span class="chip" id="mName">ロケット</span><span class="chip" id="clock">T-00:00</span><span class="chip" id="pName"></span></div>
<div id="steps"></div>
<div id="side"><button id="bX" type="button">🔍 なかみ</button><button id="bMute" type="button">🔊</button></div>
<div class="tele" id="tele1"><canvas id="e1" width="140" height="140"></canvas><div><b id="n1">SUPER HEAVY</b><div><span class="num" id="v1">0</span><small>km/h</small></div><div><span class="num" id="h1">0.0</span><small>km</small></div></div></div>
<div class="tele" id="tele2"><canvas id="e2" width="140" height="140"></canvas><div><b id="n2">STARSHIP</b><div><span class="num" id="v2">0</span><small>km/h</small></div><div><span class="num" id="h2">0.0</span><small>km</small></div></div></div>
<div id="tip"></div>
<div id="flash"></div>
<div id="fact"></div>
<div class="gauge hidden" id="gS"><div class="gl"><span class="lab"></span><span class="val"></span></div><div class="tr"><div class="fill"></div><div class="gr"></div><div class="marks"></div><div class="nd"></div></div></div>
<div class="gauge hidden" id="gA"><div class="gl"><span class="lab"></span><span class="val"></span></div><div class="tr"><div class="fill"></div><div class="gr"></div><div class="marks"></div><div class="nd"></div></div></div>
<div id="dock"></div>
<button id="stL" class="steer hidden" type="button">◀</button>
<button id="stR" class="steer hidden" type="button">▶</button>

<div id="title" class="ov">
  <div class="box">
    <h1>🚀 ロケット はっしゃ しれいしつ</h1>
    <p>どの ロケットを とばす？</p>
    <div class="pick">
      <button class="rk sel" data-r="star" type="button"><canvas width="380" height="230" id="pk1"></canvas><h3>スターシップ</h3><p>せかい さいだいの ロケット。ブースターを タワーの「おはし」で キャッチ！</p></button>
      <button class="rk" data-r="h3" type="button"><canvas width="380" height="230" id="pk2"></canvas><h3>H3（エイチスリー）</h3><p>にっぽんの ロケット。SRB-3 と フェアリングを きりはなして えいせいを うちゅうへ！</p></button>
    </div>
    <div class="modes">
      <button class="m-ruka" data-m="ruka" type="button">ルカ モード<small>かんたん ・ ボタンが ひかって おしえる</small></button>
      <button class="m-normal" data-m="normal" type="button">ふつう モード<small>タイミングを じぶんで みきわめる</small></button>
    </div>
    <div class="keys"><kbd>Space</kbd> メインボタン ・ <kbd>1</kbd><kbd>2</kbd><kbd>3</kbd> じゅんばんボタン ・ <kbd>◀</kbd><kbd>▶</kbd> かじとり ・ <kbd>▲</kbd><kbd>▼</kbd> エンジンの つよさ ・ <kbd>X</kbd> なかみ</div>
  </div>
</div>

<div id="card" class="ov hidden"><div class="box"><h2 id="cT"></h2><canvas id="cD" width="1040" height="560"></canvas><div id="cB"></div><div class="row" id="cBtns"></div></div></div>

<div id="result" class="ov hidden"><div class="box">
  <h2 id="rT">ミッション せいこう！</h2>
  <div id="resTotal"></div>
  <ul id="resList"></ul>
  <div id="resLearn"></div>
  <div class="row"><button class="bigbtn" id="rAgain" type="button">もういちど</button><button class="bigbtn blue" id="rOther" type="button">べつの ロケット</button></div>
</div></div>

<script>
'use strict';
const $ = id => document.getElementById(id);
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const lerp = (a, b, t) => a + (b - a) * t;
const sm = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const R = s => s.replace(/\{([^|}]+)\|([^}]+)\}/g, '<ruby>$1<rt>$2</rt></ruby>');
const rnd = (a, b) => a + Math.random() * (b - a);
const G0 = 9.81;
const rho = h => 1.225 * Math.exp(-Math.max(0, h) / 8500);
const kmh = v => Math.round(Math.abs(v) * 3.6);

// ================================================================= canvas
const cv = $('cv'); let g = cv.getContext('2d');
let W = 0, H = 0, DPR = 1;
function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
}
window.addEventListener('resize', resize); resize();

// ================================================================= dimensions (meters)
const SH = 71, SS = 52, SD = 9;          // Super Heavy length, Ship length, diameter
const OLM = 22, TOWER_X = -27, TOWER_H = 146, ARM_H = 105, FIT = 61;  // pad / tower / catch geometry
const H_REST = ARM_H - FIT;              // booster base height when hanging on the arms
const H1 = 37, H2L = 10, HF = 10, HD = 5.2, SRB_L = 15, SRB_D = 2.5, ML_TOP = 16;

// ================================================================= colors / sky
const hex = c => [parseInt(c.slice(1, 3), 16), parseInt(c.slice(3, 5), 16), parseInt(c.slice(5, 7), 16)];
const mix = (a, b, t) => { const A = hex(a), B = hex(b); return `rgb(${A.map((x, i) => Math.round(lerp(x, B[i], t))).join(',')})`; };
const SKY = [[0, '#2e7fd6', '#a7d3ff'], [8000, '#1d5db8', '#7fb6ef'], [25000, '#0b2b6e', '#3a6fc0'], [50000, '#030c2a', '#14347a'], [90000, '#000000', '#04102e'], [400000, '#000000', '#000000']];
function skyAt(h) {
  for (let i = 0; i < SKY.length - 1; i++) {
    const [h0, t0, b0] = SKY[i], [h1, t1, b1] = SKY[i + 1];
    if (h <= h1) { const t = clamp((h - h0) / (h1 - h0), 0, 1); return [mix(t0, t1, t), mix(b0, b1, t)]; }
  }
  return ['#000000', '#000000'];
}
const STARS = Array.from({ length: 260 }, () => ({ x: Math.random(), y: Math.random(), r: Math.random() * 1.4 + 0.3, a: Math.random() }));
const CLOUDS = Array.from({ length: 22 }, (_, i) => ({ h: 1500 + Math.random() * 9000, x: Math.random() * 6000, w: 60 + Math.random() * 140, s: Math.random() }));

// ================================================================= view helpers
// a view = { x, y, w, h (screen rect), cx, ch (camera world), z (px per m) }
function sx(v, x) { return v.x + v.w / 2 + (x - v.cx) * v.z; }
const VC = 0.5;
function sy(v, h) { return v.y + v.h * VC - (h - v.ch) * v.z; }

function drawBackground(v, site) {
  const h = v.ch;
  const [top, bot] = skyAt(h);
  const gr = g.createLinearGradient(0, v.y, 0, v.y + v.h);
  gr.addColorStop(0, top); gr.addColorStop(1, bot);
  g.fillStyle = gr; g.fillRect(v.x, v.y, v.w, v.h);
  // stars
  const sa = clamp((h - 22000) / 50000, 0, 1);
  if (sa > 0) {
    g.fillStyle = '#fff';
    for (const s of STARS) { g.globalAlpha = sa * (0.4 + 0.6 * s.a); g.fillRect(v.x + s.x * v.w, v.y + s.y * v.h, s.r, s.r); }
    g.globalAlpha = 1;
  }
  // earth / far ground
  const hz = v.y + v.h * VC + clamp(h / 300000, 0, 1) * v.h * 0.4;
  const Rpx = v.w * lerp(40, 1.15, Math.pow(clamp(h / 260000, 0, 1), 0.55));
  const ecx = v.x + v.w / 2, ecy = hz + Rpx;
  g.save(); g.beginPath(); g.rect(v.x, v.y, v.w, v.h); g.clip();
  const eg = g.createLinearGradient(0, hz, 0, hz + v.h * 0.6);
  if (site === 'h3') { eg.addColorStop(0, '#8fbfe0'); eg.addColorStop(0.15, '#2c6fa8'); eg.addColorStop(1, '#13406e'); }
  else if (site === 'ocean') { eg.addColorStop(0, '#9cc8e8'); eg.addColorStop(0.15, '#2a73b0'); eg.addColorStop(1, '#0d3a6a'); }
  else { eg.addColorStop(0, '#b9d2e6'); eg.addColorStop(0.15, '#3f7fb6'); eg.addColorStop(1, '#1c4e80'); }
  g.fillStyle = eg; g.beginPath(); g.arc(ecx, ecy, Rpx, 0, Math.PI * 2); g.fill();
  // land masses + clouds on earth when high
  const hiA = clamp((h - 30000) / 60000, 0, 1);
  if (hiA > 0) {
    g.globalAlpha = hiA * 0.55;
    g.fillStyle = site === 'h3' ? '#4f7f45' : '#8d8a5a';
    for (let i = 0; i < 4; i++) {
      const ang = -Math.PI / 2 + ((i - 1.5) * 0.22 * v.w + (site === 'h3' ? 0.05 : -0.08) * v.w) / Rpx;
      g.beginPath(); g.ellipse(ecx + Math.cos(ang) * (Rpx - v.h * 0.03), ecy + Math.sin(ang) * (Rpx - v.h * 0.03), v.w * 0.07, v.h * 0.018, ang + Math.PI / 2, 0, Math.PI * 2); g.fill();
    }
    g.globalAlpha = hiA;
    g.fillStyle = 'rgba(255,255,255,.75)';
    for (let i = 0; i < 14; i++) {
      const ang = -Math.PI / 2 + ((i - 7) * 0.075 * v.w + Math.sin(i * 7.3) * 0.03 * v.w) / Rpx;
      const dep = v.h * (0.02 + 0.05 * ((i * 37) % 7) / 7);
      g.beginPath(); g.ellipse(ecx + Math.cos(ang) * (Rpx - dep), ecy + Math.sin(ang) * (Rpx - dep), v.w * 0.035, v.h * 0.008, ang + Math.PI / 2, 0, Math.PI * 2); g.fill();
    }
    g.globalAlpha = 1;
  }
  // atmosphere limb
  const la = clamp((h - 15000) / 40000, 0, 1);
  if (la > 0) {
    g.lineWidth = 6 + 10 * la; g.strokeStyle = `rgba(110,180,255,${0.55 * la})`;
    g.beginPath(); g.arc(ecx, ecy, Rpx + 4, 0, Math.PI * 2); g.stroke();
    g.lineWidth = 2; g.strokeStyle = `rgba(200,230,255,${0.7 * la})`;
    g.beginPath(); g.arc(ecx, ecy, Rpx + 1, 0, Math.PI * 2); g.stroke();
  }
  // low-altitude scenery band (sea / land toward the horizon)
  const gy = sy(v, 0);
  if (h < 2500) {
    if (site === 'star') {
      const cx2 = clamp(sx(v, 260), v.x, v.x + v.w);
      const ag = g.createLinearGradient(0, hz, 0, gy); ag.addColorStop(0, '#d9cfae'); ag.addColorStop(1, '#bda874');
      g.fillStyle = ag; g.beginPath(); g.moveTo(v.x, hz); g.lineTo(cx2 - (gy - hz) * 0.8, hz); g.lineTo(cx2, gy); g.lineTo(v.x, gy); g.fill();
    } else if (site === 'h3') {
      g.fillStyle = '#3f8a3f';
      g.beginPath(); g.moveTo(v.x, gy); g.lineTo(v.x, hz + 6);
      const cx2 = clamp(sx(v, 170), v.x, v.x + v.w), ww = cx2 - v.x;
      for (let i = 0; i <= 10; i++) g.lineTo(v.x + ww * i / 10, hz + 2 - Math.sin(i * 1.3) * 8 - 10 * Math.sin(i / 10 * Math.PI));
      g.lineTo(cx2, gy); g.fill();
    }

  if (h < 16000) {
    const PZ = 0.06;
    for (const c of CLOUDS) {
      const yy = v.y + v.h * VC - (c.h - h) * PZ * (v.h / 700);
      if (yy < v.y - 60 || yy > v.y + v.h + 60) continue;
      let xx = ((c.x - v.cx * 0.02) % 6000 + 6000) % 6000 / 6000 * (v.w + 400) - 200 + v.x;
      const ww = c.w * (v.w / 1200 + 0.4);

      for (let k = 0; k < 4; k++) { g.beginPath(); g.ellipse(xx + (k - 1.5) * ww * 0.28, yy - Math.sin(k * 2 + c.s) * ww * 0.06, ww * 0.26, ww * 0.12, 0, 0, Math.PI * 2); g.fill(); }
    }

}

// near-ground objects (drawn in world coordinates)
function drawGround(v, site) {
  const gy = sy(v, 0);

  g.save(); g.beginPath(); g.rect(v.x, v.y, v.w, v.h); g.clip();
  if (site === 'ocean') {
    g.fillStyle = '#1d5d93'; g.fillRect(v.x, gy, v.w, v.y + v.h - gy);
    g.strokeStyle = 'rgba(255,255,255,.35)'; g.lineWidth = 2;
    for (let i = 0; i < 12; i++) { const yy = gy + 4 + i * 9; g.beginPath(); for (let x = 0; x <= v.w; x += 20) g.lineTo(v.x + x, yy + Math.sin(x * 0.05 + i + Date.now() / 600) * 2); g.stroke(); }
    // buoy target
    const bx = sx(v, 0), bz = v.z;
    g.strokeStyle = 'rgba(255,120,40,.9)'; g.lineWidth = 3;
    g.beginPath(); g.ellipse(bx, gy + 3, 30 * bz, 4 * bz, 0, 0, Math.PI * 2); g.stroke();
    g.fillStyle = '#ff7a2a'; g.fillRect(bx + 30 * bz - 3, gy - 10, 6, 10); g.fillRect(bx - 30 * bz - 3, gy - 10, 6, 10);
    g.restore(); return;

  g.fillRect(v.x, gy, v.w, v.y + v.h - gy);
  const sxx = sx(v, seaX);
  if (sxx < v.x + v.w) { g.fillStyle = '#2c6fa8'; g.fillRect(Math.max(v.x, sxx), gy, v.w, v.y + v.h - gy); g.fillStyle = '#e8d9a8'; g.fillRect(sxx - 8 * v.z, gy, 8 * v.z, 3 * v.z); }
  g.fillStyle = '#8b8f94'; g.fillRect(sx(v, -70), gy, 140 * v.z, 2.5 * v.z); // pad concrete
  if (site === 'star') drawStarbase(v); else drawYoshinobu(v);
  g.restore();
}

function lattice(x0, y0, w, hgt, step, col, lw) {
  g.strokeStyle = col; g.lineWidth = lw;
  g.strokeRect(x0, y0, w, hgt);
  g.beginPath();
  for (let y = y0; y < y0 + hgt - 0.1; y += step) { g.moveTo(x0, y); g.lineTo(x0 + w, y + step); g.moveTo(x0 + w, y); g.lineTo(x0, y + step); g.moveTo(x0, y); g.lineTo(x0 + w, y); }
  g.stroke();
}

function drawArms(v, which) {

// ================================================================= vehicle drawing (local coords: meters, y up = negative)
function steel(r) {
  const gr = g.createLinearGradient(-r, 0, r, 0);
  gr.addColorStop(0, '#5e666d'); gr.addColorStop(0.22, '#cfd5da'); gr.addColorStop(0.42, '#f3f5f6'); gr.addColorStop(0.68, '#a3abb2'); gr.addColorStop(1, '#4f565c');
  return gr;
}
function white(r) {
  const gr = g.createLinearGradient(-r, 0, r, 0);
  gr.addColorStop(0, '#9aa3ab'); gr.addColorStop(0.3, '#f2f4f6'); gr.addColorStop(0.55, '#ffffff'); gr.addColorStop(1, '#a7afb6');
  return gr;
}
function nozzle(x, top, len, w0, w1, col) {
  g.fillStyle = col || '#2c2f33';
  g.beginPath(); g.moveTo(x - w0 / 2, top); g.lineTo(x + w0 / 2, top); g.lineTo(x + w1 / 2, top + len); g.lineTo(x - w1 / 2, top + len); g.closePath(); g.fill();
  g.fillStyle = 'rgba(255,255,255,.18)'; g.fillRect(x - w1 / 2, top + len - 0.25, w1, 0.25);
}
function tank(x0, yTop, w, hgt, frac, col, frost, label) {
  // inside cutaway: outline + fill level from bottom
  g.strokeStyle = 'rgba(255,255,255,.85)'; g.lineWidth = 0.25; g.strokeRect(x0, yTop, w, hgt);
  g.fillStyle = col; g.fillRect(x0 + 0.2, yTop + hgt * (1 - frac), w - 0.4, hgt * frac);
  if (label) { g.fillStyle = '#fff'; g.font = '900 2.4px sans-serif'; g.textAlign = 'center'; g.fillText(label, x0 + w / 2, yTop + hgt / 2); }
}
function frostBand(r, y0, y1, a) {
  if (a <= 0) return;
  g.fillStyle = `rgba(245,250,255,${0.55 * a})`; g.fillRect(-r, y1, 2 * r, y0 - y1);
  g.strokeStyle = `rgba(255,255,255,${0.6 * a})`; g.lineWidth = 0.15;
  for (let y = y1 + 0.8; y < y0; y += 1.6) { g.beginPath(); g.moveTo(-r, y); g.lineTo(r, y + 0.3); g.stroke(); }
}

function drawBooster(b) {
  const r = SD / 2;

  // aft skirt & chines

  g.fillStyle = '#9aa2a9';
  g.beginPath(); g.moveTo(-r, -2); g.lineTo(-r - 0.9, -3); g.lineTo(-r - 0.9, -18); g.lineTo(-r, -22); g.fill();
  g.beginPath(); g.moveTo(r, -2); g.lineTo(r + 0.9, -3); g.lineTo(r + 0.9, -18); g.lineTo(r, -22); g.fill();

    g.fillStyle = 'rgba(110,220,120,.7)'; g.fillRect(-0.4, -SH + 27, 0.8, 38);  // downcomer
    g.fillStyle = '#fff'; g.font = '900 2px sans-serif'; g.textAlign = 'center'; g.fillText('エンジン 33こ', 0, -2);
  } else {
    frostBand(r, -6, -6 - 38 * b.lox, S ? S.frost : 0);
    frostBand(r, -SH + 26, -SH + 26 - 22 * b.ch4, S ? S.frost : 0);
  }
  // hot-stage ring (vented interstage)

    g.fillStyle = '#3b3f44'; g.fillRect(-r, -SH - 2.2, SD, 2.4);
    g.fillStyle = b.vent > 0 ? '#ffb347' : '#15171a';
    for (let x = -r + 0.6; x < r - 0.4; x += 1.1) g.fillRect(x, -SH - 1.8, 0.6, 1.5);
  }

    g.save(); g.translate(sgn * r, -SH + 6); g.rotate(sgn * fa * 0.3);
    g.fillStyle = '#4b5056'; g.fillRect(sgn > 0 ? 0 : -3.4, -2.4, 3.4, 4.8);
    g.strokeStyle = '#9aa2a9'; g.lineWidth = 0.18;

    for (let k = 0; k <= 5; k++) { const yy = -2.4 + k * 0.96; g.beginPath(); g.moveTo(sgn > 0 ? 0 : -3.4, yy); g.lineTo(sgn > 0 ? 3.4 : 0, yy); g.stroke(); }

function drawShip(s) {
  const r = SD / 2, body = 39;
  // engines: 3 vacuum (big bells) + 3 sea-level (small)

  // cutaway
  if (S && S.xray) {
    tank(-r + 0.8, -body + 2, SD - 1.6, 13, s.ch4, 'rgba(110,220,120,.85)', 0, 'メタン');
    tank(-r + 0.8, -body + 16, SD - 1.6, 20, s.lox, 'rgba(70,140,255,.85)', 0, 'さんそ');
    g.strokeStyle = 'rgba(255,255,255,.7)'; g.lineWidth = 0.25; g.strokeRect(-r + 0.8, -SS + 4, SD - 1.6, 8);
    g.fillStyle = '#fff'; g.font = '900 2px sans-serif'; g.textAlign = 'center'; g.fillText('にもつ', 0, -SS + 9);
  } else {

  g.beginPath(); g.moveTo(r - 0.3, -body - 1); g.lineTo(r + 1.9, -body - 2); g.lineTo(r + 1.2, -body - 7.5); g.lineTo(r - 0.9, -body - 7); g.fill();
  // plasma sheath

    pg.addColorStop(0, `rgba(255,140,220,${0.75 * s.plasma})`); pg.addColorStop(0.4, `rgba(255,120,60,${0.45 * s.plasma})`); pg.addColorStop(1, 'rgba(255,60,120,0)');
    g.fillStyle = pg; g.beginPath(); g.ellipse(r + 4, -SS / 2, 12, 34, 0, 0, Math.PI * 2); g.fill();
  }
}

// ---------------- exhaust plumes (drawn pointing +y in local coordinates)
function plume(x, y0, w, len, kind, alt, k) {
  if (k <= 0) return;
  const sp = 1 + clamp(alt / 18000, 0, 1) * 3.2;
  len *= (0.85 + Math.random() * 0.15) * (0.6 + 0.4 * k) * (1 + clamp(alt / 30000, 0, 1) * 0.6);
  const w1 = w * sp * 1.4;
  const cols = {
    raptor: ['rgba(255,250,235,.95)', 'rgba(255,170,70,.8)', 'rgba(140,120,255,0)'],
    rvac:   ['rgba(255,245,230,.9)', 'rgba(255,150,80,.55)', 'rgba(120,120,255,0)'],
    srb:    ['rgba(255,255,240,1)', 'rgba(255,205,110,.95)', 'rgba(255,120,40,0)'],
    hydro:  ['rgba(230,240,255,.8)', 'rgba(170,200,255,.35)', 'rgba(140,170,255,0)'],
  }[kind];
  const gr = g.createLinearGradient(0, y0, 0, y0 + len);
  gr.addColorStop(0, cols[0]); gr.addColorStop(0.35, cols[1]); gr.addColorStop(1, cols[2]);
  g.fillStyle = gr;
  g.beginPath(); g.moveTo(x - w / 2, y0);
  g.quadraticCurveTo(x - w1 / 2, y0 + len * 0.35, x - w1 * 0.1, y0 + len);
  g.lineTo(x + w1 * 0.1, y0 + len);
  g.quadraticCurveTo(x + w1 / 2, y0 + len * 0.35, x + w / 2, y0); g.fill();
  // shock diamonds (dense air only)
  if (alt < 22000 && kind !== 'srb') {
    g.fillStyle = kind === 'hydro' ? 'rgba(200,220,255,.7)' : 'rgba(255,255,230,.85)';
    for (let i = 1; i <= 4; i++) {
      const yy = y0 + len * 0.1 * i * 1.4, ww = w * 0.38;
      g.beginPath(); g.moveTo(x, yy - ww); g.lineTo(x + ww * 0.6, yy); g.lineTo(x, yy + ww); g.lineTo(x - ww * 0.6, yy); g.fill();
    }
  }
}

function stepParts(dt) {
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i];
    p.x += p.vx * dt; p.h += p.vh * dt; p.vx *= Math.exp(-0.6 * dt); p.vh *= Math.exp(-0.6 * dt);

}

    if (x < v.x - rr || x > v.x + v.w + rr || y < v.y - rr || y > v.y + v.h + rr) continue;
    g.globalAlpha = (1 - t) * 0.8;

let AC = null, master = null, rumbleG = null, muted = false;
function audioInit() {
  if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
  try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return; }
  master = AC.createGain(); master.gain.value = muted ? 0 : 0.6; master.connect(AC.destination);
  const buf = AC.createBuffer(1, AC.sampleRate * 2, AC.sampleRate), d = buf.getChannelData(0);
  let last = 0; for (let i = 0; i < d.length; i++) { last = (last + 0.02 * (Math.random() * 2 - 1)) / 1.02; d[i] = last * 3.5; }
  const src = AC.createBufferSource(); src.buffer = buf; src.loop = true;
  const f = AC.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 380;
  rumbleG = AC.createGain(); rumbleG.gain.value = 0;
  src.connect(f).connect(rumbleG).connect(master); src.start();

function tone(fr, dur, type = 'sine', vol = 0.15, when = 0, f2) {

}

// ================================================================= flight helpers
const nozW = (o, d = 3) => ({ x: o.x - Math.sin(o.ang) * d, h: o.h - Math.cos(o.ang) * d });
const along = (o, d) => ({ x: o.x + Math.sin(o.ang) * d, h: o.h + Math.cos(o.ang) * d });
function zPad() { return S.rocket === 'star' ? Math.min(H * 0.64 / 190, W * 0.9 / 110) : Math.min(H * 0.8 / 115, W * 0.9 / 90); }
function follow(o, dh, minH = -1e9) {
  const p = along(o, dh);
  S.cam.x = p.x; S.cam.h = Math.max(minH, p.h);
}
function syncStack() {
  const b = S.bst, s = S.ship, p = along(b, SH + 2.2);
  s.x = p.x; s.h = p.h; s.ang = b.ang; s.v = b.v; s.vx = b.vx; s.vh = b.vh;
}
function predictImpact(x, h, vx, vh) {
  for (let i = 0; i < 6000; i++) { const dt = 0.25; vh -= G0 * dt; x += vx * dt; h += vh * dt; if (h <= 0) return x; }
  return x;
}
// ship after staging (scripted toward ~26,400 km/h at T+8:30)
function shipFly(dts) {
  const s = S.ship;
  if (!s.free) return;
  if (S.shipOff) { s.x += s.vx * dts; s.h += s.vh * dts; return; }
  const T = Math.min(S.T, P && P.id === 'seco' ? 1e9 : 505);
  const v = 1500 + 5900 * Math.pow(sm(158, 520, T), 0.9);
  const p = lerp(S.sepP || 0.92, 1.53, sm(158, 300, T));
  s.v = v; s.vx = v * Math.sin(p); s.vh = v * Math.cos(p);
  s.x += s.vx * dts; s.h += s.vh * dts; s.ang = p;
  s.lox = s.ch4 = clamp(1 - (T - 158) / 380, 0.03, 1);
}
function stepDebris(dts) {
  for (const d of S.deb) {
    if (d.h <= 0) continue;
    d.vh -= G0 * dts; d.x += d.vx * dts; d.h += d.vh * dts; d.ang += d.va * dts;
    if (d.h < 0) d.h = 0;
  }
  S.deb = S.deb.filter(d => d.h > 0 || d.keep);
}

    g.fillStyle = 'rgba(0,0,0,.6)'; g.fillRect(px, py, pw, 18);
    g.fillStyle = '#fff'; g.font = '800 12px sans-serif'; g.textAlign = 'left';
    g.fillText(S.pip === 'ship' ? '📺 シップ（うちゅうへ）' : '📺 ブースター（タワーの うえ）', px + 6, py + 13);
  }
}

// ================================================================= particles emitters & HUD
function emit(dt) {
  if (S.rocket === 'star') {
    const b = S.bst;
    if (S.deluge && !S.lifted && Math.random() < 0.9) for (let i = 0; i < 2; i++) puff(rnd(-11, 11), 2, rnd(-4, 4), rnd(20, 35), 1.2, 1.2, '#dff3ff', 1);
    const n = b.eng.reduce((a, e) => a + e, 0);
    if (n >= 13 && b.h < OLM + 220) for (let i = 0; i < 4; i++) puff(rnd(-8, 8), rnd(1, 6), rnd(-60, 60), rnd(1, 14), rnd(5, 10), rnd(3, 6), '#eceff2');
  } else {
    const c = S.core;
    if (c.attachedSrb && c.srbThr > 0 && c.h < 48000 && S.lifted) {
      const p = nozW(c, 4), lp = S.lastNoz || p, dist = Math.hypot(p.x - lp.x, p.h - lp.h), r0 = c.h < 3000 ? 4.5 : 3.2;
      const n = Math.min(14, Math.max(1, Math.ceil(dist / (r0 * 0.9))));
      for (let k = 1; k <= n; k++) { const t = k / n, x = lerp(lp.x, p.x, t), hh = lerp(lp.h, p.h, t);
        for (const sd of [-1, 1]) { const off = HD / 2 + SRB_D / 2; puff(x + Math.cos(c.ang) * sd * off, hh - Math.sin(c.ang) * sd * off, rnd(-3, 3), rnd(-3, 3), r0, c.h < 3000 ? 7 : 4.5, '#f4f4f4', 1.3); } }
      S.lastNoz = p;
      if (c.h < ML_TOP + 150) for (let i = 0; i < 4; i++) puff(rnd(-8, 8), rnd(1, 6), rnd(-50, 50), rnd(1, 10), rnd(5, 9), rnd(3, 6), '#eeeeee');
    }
  }
}
function fmtT(T) {
  const s = Math.abs(T), hh = Math.floor(s / 3600), m = Math.floor(s / 60) % (hh ? 60 : 1e9), ss = Math.floor(s % 60);
  return (S.rocket === 'h3' ? 'X' : 'T') + (T < 0 ? '-' : '+') + (hh ? hh + ':' : '') + String(m).padStart(2, '0') + ':' + String(ss).padStart(2, '0');
}
let teleT = 0;
function hud(dt) {
  $('clock').textContent = fmtT(S.T);
  teleT -= dt;
  if (teleT <= 0) {
    teleT = 0.1;
    if (S.rocket === 'star') {
      const b = S.bst, s = S.ship;
      $('v1').textContent = kmh(b.v || 0).toLocaleString(); $('h1').textContent = Math.max(0, (b.h - (S.lifted ? OLM : b.h)) / 1000).toFixed(1);
      $('v2').textContent = kmh(s.v || 0).toLocaleString(); $('h2').textContent = Math.max(0, (!S.lifted ? 0 : S.attached ? s.h - OLM - SH : s.h) / 1000).toFixed(1);
      drawEngineRing($('e1'), L_SH, b.eng); drawEngineRing($('e2'), L_SS, s.eng);
    } else {
      const c = S.core, u = S.up;
      $('v1').textContent = kmh(c.v || 0).toLocaleString(); $('h1').textContent = Math.max(0, (S.lifted ? c.h - ML_TOP : 0) / 1000).toFixed(1);
      $('v2').textContent = kmh(u.v || 0).toLocaleString(); $('h2').textContent = Math.max(0, (S.lifted ? u.h - ML_TOP - H1 : 0) / 1000).toFixed(1);
      drawEngineRing($('e1'), L_H1, [c.eng[0], c.eng[1], c.attachedSrb && c.srbThr > 0, c.attachedSrb && c.srbThr > 0]);
      drawEngineRing($('e2'), L_H2, [u.eng]);
    }
  }
  const gid = P && P.glow && (ruka() || P.glowAlways) ? P.glow() : null;
  for (const b of dockBtns) b.el.classList.toggle('glow', b.id === gid);
  tip(P && P.tip ? P.tip() : '');
  if (flashT > 0) { flashT -= dt; if (flashT <= 0) $('flash').style.opacity = 0; }
  if (factT > 0) { factT -= dt; if (factT <= 0) $('fact').style.opacity = 0; }
  if (rumbleG) {
    let k = 0, alt = 0;
    if (S.rocket === 'star') { const b = S.bst; k = b.eng.reduce((a, e) => a + e, 0) / 33 * b.thr + S.ship.eng.reduce((a, e) => a + e, 0) / 12; alt = Math.min(b.h, S.ship.h); if (P && ['seco', 'reent', 'splash'].includes(P.id)) { k = S.ship.eng.reduce((a, e) => a + e, 0) / 8 + S.ship.plasma * 0.5; alt = S.ship.h; } }
    else { const c = S.core; k = (c.eng[0] ? 0.4 : 0) + (c.attachedSrb ? c.srbThr * 0.6 : 0) + (S.up.eng ? 0.15 : 0); alt = c.h; }
    rumbleG.gain.value = clamp(k, 0, 1.2) * 0.5 * (1 - clamp(alt / 90000, 0, 0.85));
  }
}

// ================================================================= main loop
let last = performance.now(), frozen = false;
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (S && !S.cardOpen && !S.done && P && !frozen) step(dt);
  render();
  requestAnimationFrame(loop);
}
function step(dt) {
  P.update(dt);
  if (S.rocket === 'star') {
    if (S.attached) syncStack();
    else if (P && !['seco', 'reent', 'splash'].includes(P.id)) shipFly(dt * S.ts);
  }
  stepDebris(dt * S.ts);
  stepParts(dt * Math.min(S.ts, 2));
  emit(dt);
  S.z += (S.zT - S.z) * Math.min(1, dt * 1.5);
  S.shake = (S.shake || 0) * Math.exp(-2.5 * dt);
  if (S.rocket === 'star' ? (S.lifted && S.bst.h < OLM + 600 && S.bst.eng[20]) : (S.lifted && S.core.h < ML_TOP + 600 && S.core.srbThr > 0)) S.shake = Math.max(S.shake, 7);
  stepConfetti(dt);
  if (S.nextIn > 0) { S.nextIn -= dt; if (S.nextIn <= 0) { S.nextIn = 0; nextPhase(); } }
  hud(dt);
}
requestAnimationFrame(loop);

// ================================================================= title
function pickRocket(r) { rocket = r; document.querySelectorAll('.rk').forEach(b => b.classList.toggle('sel', b.dataset.r === r)); }
document.querySelectorAll('.rk').forEach(b => b.addEventListener('click', () => pickRocket(b.dataset.r)));
document.querySelectorAll('.modes [data-m]').forEach(b => b.addEventListener('click', () => { audioInit(); mode = b.dataset.m; startMission(rocket); }));
function drawPreview(cvs, r) {
  const c = cvs.getContext('2d'), prevG = g, prevS = S;
  g = c; S = r === 'star' ? newStar() : newH3(); S.deb = []; S.mlx = 0; if (r === 'h3') S.core.x = 0;
  if (r === 'star') { S.bst.lox = S.bst.ch4 = S.ship.lox = S.ship.ch4 = 1; syncStack(); } else { S.core.lox = S.core.lh2 = 1; }
  const v = { x: 0, y: 0, w: cvs.width, h: cvs.height, cx: r === 'star' ? -6 : 0, ch: r === 'star' ? 82 : 46, z: r === 'star' ? cvs.height * 0.86 / 190 : cvs.height * 0.86 / 105 };
  renderScene(v);
  g = prevG; S = prevS;
}
drawPreview($('pk1'), 'star'); drawPreview($('pk2'), 'h3');

// test hook
if (location.hash === '#debug') window.__r = {
  get S() { return S; }, get P() { return P; }, start: (r, m) => { mode = m || 'normal'; startMission(r); },
  closeCard: () => { const b = $('cBtns').querySelector('button'); if (b) b.click(); },
  press: (id, d = true) => { const b = dockBtns.find(x => x.id === id); if (b) { if (d) btnDown(b); else btnUp(b); } },
  steer: v => { touchL = v < 0; touchR = v > 0; },
  step: (n, dt = 1 / 30) => { for (let i = 0; i < n; i++) { if (S && !S.cardOpen && !S.done && P) step(dt); } },
  goto: i => gotoPhase(i, true),
  freeze: f => { frozen = f; },
  render: () => render(),
};

</script>
