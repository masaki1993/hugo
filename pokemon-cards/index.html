<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>カード円環</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Shippori+Mincho:wght@500;700&display=swap" rel="stylesheet" />
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
    }
  }
  </script>
  <style>
    :root {
      --ink: #07060c;
      --gold: #e7c56a;
      --paper: #f3ead4;
      --dim: rgba(243, 234, 212, 0.62);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--ink);
      color: var(--paper);
      font-family: "Shippori Mincho", serif;
      touch-action: none;
    }

    #view {
      display: block;
      width: 100%;
      height: 100%;
    }

    header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      padding: 22px 28px 0;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      pointer-events: none;
      z-index: 2;
    }

    .mark {
      font-family: "Cormorant Garamond", serif;
      font-weight: 500;
      letter-spacing: 0.42em;
      text-transform: uppercase;
      font-size: 13px;
      color: var(--gold);
    }

    #hint {
      font-size: 13px;
      letter-spacing: 0.12em;
      color: var(--dim);
      text-align: right;
    }

    #dock {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 2;
      display: none;
      align-items: flex-end;
      justify-content: center;
      gap: 22px;
      padding: 28px 20px calc(22px + env(safe-area-inset-bottom));
      background: linear-gradient(to top, rgba(7, 6, 12, 0.94) 10%, rgba(7, 6, 12, 0));
    }

    body.is-focus #dock { display: flex; }

    .label {
      min-width: min(46vw, 280px);
      text-align: center;
    }

    #card-name {
      font-weight: 700;
      font-size: clamp(1.05rem, 2.4vw, 1.7rem);
      letter-spacing: 0.12em;
    }

    #card-sub {
      margin-top: 4px;
      font-family: "Cormorant Garamond", serif;
      font-style: italic;
      font-size: 15px;
      letter-spacing: 0.18em;
      color: var(--gold);
    }

    button {
      font-family: inherit;
      color: var(--gold);
      background: transparent;
      cursor: pointer;
    }

    .nav {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: 1px solid rgba(231, 197, 106, 0.55);
      font-size: 26px;
      line-height: 1;
      flex: 0 0 auto;
    }

    .nav:hover, #back:hover { color: var(--paper); border-color: var(--paper); }

    #back {
      position: absolute;
      right: 28px;
      bottom: calc(26px + env(safe-area-inset-bottom));
      border: none;
      border-bottom: 1px solid var(--gold);
      padding: 4px 2px 6px;
      letter-spacing: 0.28em;
      font-size: 13px;
    }

    #veil {
      position: fixed;
      inset: 0;
      z-index: 4;
      display: grid;
      place-items: center;
      background: var(--ink);
      transition: opacity 0.55s ease;
    }

    #veil p {
      font-size: 14px;
      letter-spacing: 0.34em;
      color: var(--gold);
    }

    #veil.is-gone {
      opacity: 0;
      pointer-events: none;
    }

    @media (max-width: 640px) {
      header { padding: 16px 16px 0; flex-direction: column; gap: 6px; }
      #hint { text-align: left; letter-spacing: 0.06em; }
      #back { position: static; }
      #dock { gap: 12px; }
      #card-name { letter-spacing: 0.04em; }
      .label { min-width: 0; }
    }
  </style>
</head>
<body>
  <canvas id="view"></canvas>
  <header>
    <p class="mark">Card Ring</p>
    <p id="hint">ドラッグで回す　·　クリックで拡大</p>
  </header>
  <footer id="dock">
    <button type="button" class="nav" id="prev" aria-label="前のカード">‹</button>
    <div class="label">
      <p id="card-name"></p>
      <p id="card-sub"></p>
    </div>
    <button type="button" class="nav" id="next" aria-label="次のカード">›</button>
    <button type="button" id="back">戻る</button>
  </footer>
  <div id="veil"><p>カードを揃えています</p></div>
  <script type="module" src="./main.js"></script>
</body>
</html>
