<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>カード円環</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Shippori+Mincho:wght@500;700&display=swap" rel="stylesheet" />
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
    }
  }
  </script>
  <style>
    :root {
      --ink: #07060c;
      --gold: #e7c56a;
      --paper: #f3ead4;
      --dim: rgba(243, 234, 212, 0.62);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--ink);
      color: var(--paper);
      font-family: "Shippori Mincho", serif;
      touch-action: none;
    }

    #view {
      display: block;
      width: 100%;
      height: 100%;
    }

    header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      padding: 22px 28px 0;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      pointer-events: none;
      z-index: 2;
    }

    .mark {
      font-family: "Cormorant Garamond", serif;
      font-weight: 500;
      letter-spacing: 0.42em;
      text-transform: uppercase;
      font-size: 13px;
      color: var(--gold);
    }

    #hint {
      font-size: 13px;
      letter-spacing: 0.12em;
      color: var(--dim);
      text-align: right;
    }

    #dock {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 2;
      display: none;
      align-items: flex-end;
      justify-content: center;
      gap: 22px;
      padding: 28px 20px calc(22px + env(safe-area-inset-bottom));
      background: linear-gradient(to top, rgba(7, 6, 12, 0.94) 10%, rgba(7, 6, 12, 0));
    }

    body.is-focus #dock { display: flex; }

    .label {
      min-width: min(46vw, 280px);
      text-align: center;
    }

    #card-name {
      font-weight: 700;
      font-size: clamp(1.05rem, 2.4vw, 1.7rem);
      letter-spacing: 0.12em;
    }

    #card-sub {
      margin-top: 4px;
      font-family: "Cormorant Garamond", serif;
      font-style: italic;
      font-size: 15px;
      letter-spacing: 0.18em;
      color: var(--gold);
    }

    button {
      font-family: inherit;
      color: var(--gold);
      background: transparent;
      cursor: pointer;
    }

    .nav {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: 1px solid rgba(231, 197, 106, 0.55);
      font-size: 26px;
      line-height: 1;
      flex: 0 0 auto;
    }

    .nav:hover, #back:hover { color: var(--paper); border-color: var(--paper); }

    #back {
      position: absolute;
      right: 28px;
      bottom: calc(26px + env(safe-area-inset-bottom));
      border: none;
      border-bottom: 1px solid var(--gold);
      padding: 4px 2px 6px;
      letter-spacing: 0.28em;
      font-size: 13px;
    }

    #veil {
      position: fixed;
      inset: 0;
      z-index: 4;
      display: grid;
      place-items: center;
      background: var(--ink);
      transition: opacity 0.55s ease;
    }

    #veil p {
      font-size: 14px;
      letter-spacing: 0.34em;
      color: var(--gold);
    }

    #veil.is-gone {
      opacity: 0;
      pointer-events: none;
    }

    #print-btn {
      position: fixed;
      top: 64px;
      right: 28px;
      z-index: 3;
      display: none;
      align-items: center;
      gap: 8px;
      padding: 9px 16px;
      border: 1px solid rgba(231, 197, 106, 0.7);
      border-radius: 999px;
      background: rgba(7, 6, 12, 0.72);
      font-size: 14px;
      letter-spacing: 0.16em;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    body:not(.is-loading) #print-btn { display: inline-flex; }
    #print-btn:hover { color: var(--paper); border-color: var(--paper); }
    #print-btn svg { width: 18px; height: 18px; }

    /* ---- 印刷するカードを選ぶ画面 ---- */
    #picker {
      position: fixed;
      inset: 0;
      z-index: 5;
      display: none;
      flex-direction: column;
      background: rgba(7, 6, 12, 0.96);
      touch-action: pan-y;
    }
    body.is-picking #picker { display: flex; }
    .picker-head {
      padding: calc(56px + env(safe-area-inset-top)) 20px 12px;
      text-align: center;
    }
    .picker-head h2 { font-size: 18px; letter-spacing: 0.16em; color: var(--gold); }
    .picker-head p { margin-top: 6px; font-size: 13px; color: var(--dim); letter-spacing: 0.06em; }
    #picker-grid {
      flex: 1;
      overflow-y: auto;
      padding: 8px 20px 20px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(96px, 1fr));
      grid-auto-rows: max-content;
      gap: 14px;
      align-content: start;
      min-height: 0;
      max-width: 980px;
      width: 100%;
      margin: 0 auto;
      -webkit-overflow-scrolling: touch;
    }
    .tile {
      position: relative;
      padding: 0;
      border: 2px solid transparent;
      border-radius: 8px;
      overflow: hidden;
      background: #1a1622;
      transition: transform 0.12s ease, border-color 0.12s ease;
    }
    .tile img { display: block; width: 100%; height: auto; aspect-ratio: 63 / 88; object-fit: cover; opacity: 0.55; transition: opacity 0.12s ease; }
    .tile.is-on { border-color: var(--gold); }
    .tile.is-on img { opacity: 1; }
    .tile:active { transform: scale(0.96); }
    .tile .count {
      position: absolute;
      top: 6px;
      right: 6px;
      min-width: 30px;
      height: 30px;
      padding: 0 6px;
      border-radius: 999px;
      background: var(--gold);
      color: var(--ink);
      font: 700 15px/30px system-ui, sans-serif;
      display: none;
    }
    .tile.is-on .count { display: block; }
    .tile .minus {
      position: absolute;
      top: 6px;
      left: 6px;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: rgba(7, 6, 12, 0.8);
      border: 1px solid var(--gold);
      color: var(--gold);
      font: 700 18px/27px system-ui, sans-serif;
      display: none;
    }
    .tile.is-on .minus { display: block; }
    .picker-foot {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 10px 14px;
      padding: 14px 16px calc(14px + env(safe-area-inset-bottom));
      border-top: 1px solid rgba(231, 197, 106, 0.25);
    }
    #picker-info { font-size: 14px; letter-spacing: 0.06em; min-width: 12em; text-align: center; }
    .picker-foot label { font-size: 13px; color: var(--dim); display: flex; align-items: center; gap: 6px; }
    .pbtn {
      padding: 10px 18px;
      border: 1px solid rgba(231, 197, 106, 0.6);
      border-radius: 999px;
      font-size: 14px;
      letter-spacing: 0.1em;
    }
    .pbtn.is-main { background: var(--gold); color: var(--ink); font-weight: 700; }
    .pbtn:disabled { opacity: 0.4; cursor: default; }

    #print-sheet { display: none; }

    @page { size: A4 portrait; margin: 8mm; }

    @media print {
      html, body {
        width: auto;
        height: auto;
        overflow: visible;
        background: #fff;
      }
      body > *:not(#print-sheet) { display: none !important; }
      #print-sheet { display: block; }
      /* A4 に 3×3 = 9枚。ページの中央に置くので両面印刷で裏とそろう */
      .print-page {
        height: 279mm;
        display: flex;
        align-items: center;
        justify-content: center;
        break-after: page;
        page-break-after: always;
      }
      .print-page:last-child { break-after: auto; page-break-after: auto; }
      .print-grid {
        display: grid;
        grid-template-columns: repeat(3, 63mm);
        grid-template-rows: repeat(3, 88mm);
        gap: 2mm;
      }
      /* 本物のポケモンカードと同じ 63mm × 88mm */
      .print-grid > * { width: 63mm; height: 88mm; }
      .print-grid img {
        display: block;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }
      .print-grid.is-front img { outline: 0.2mm solid #bbb; }
      /* 裏面は 1mm ずつ大きめ（すき間 2mm をちょうど埋める）なので少しズレても白が出にくい */
      .print-grid.is-back img { width: 65mm; height: 90mm; margin: -1mm; }
    }

    @media (max-width: 640px) {
      #print-btn { top: 14px; right: 16px; }
      header { padding: 16px 16px 0; flex-direction: column; gap: 6px; }
      #hint { text-align: left; letter-spacing: 0.06em; }
      #back { position: static; }
      #dock { gap: 12px; }
      #card-name { letter-spacing: 0.04em; }
      .label { min-width: 0; }
    }
  </style>
</head>
<body class="is-loading">
  <canvas id="view"></canvas>
  <header>
    <p class="mark">Card Ring</p>
    <p id="hint">ドラッグで回す　·　クリックで拡大</p>
  </header>
  <footer id="dock">
    <button type="button" class="nav" id="prev" aria-label="前のカード">‹</button>
    <div class="label">
      <p id="card-name"></p>
      <p id="card-sub"></p>
    </div>
    <button type="button" class="nav" id="next" aria-label="次のカード">›</button>
    <button type="button" id="back">戻る</button>
  </footer>
  <button type="button" id="print-btn" aria-label="カードを印刷">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M6 9V3h12v6"/><rect x="3" y="9" width="18" height="8" rx="1.5"/><path d="M6 14h12v7H6z"/></svg>
    印刷
  </button>
  <section id="picker" role="dialog" aria-modal="true" aria-labelledby="picker-title">
    <div class="picker-head">
      <h2 id="picker-title">印刷するカードを選ぶ</h2>
      <p>タップで追加（もう一度タップで +1 枚）· A4 1枚に 9枚まで</p>
    </div>
    <div id="picker-grid"></div>
    <div class="picker-foot">
      <p id="picker-info"></p>
      <label><input type="checkbox" id="picker-backs" checked /> うら面も印刷（両面）</label>
      <button type="button" class="pbtn" id="picker-clear">ぜんぶ外す</button>
      <button type="button" class="pbtn" id="picker-close">閉じる</button>
      <button type="button" class="pbtn is-main" id="picker-print">印刷する</button>
    </div>
  </section>
  <div id="print-sheet"></div>
  <div id="veil"><p>カードを揃えています</p></div>
  <script type="module" src="./main.js"></script>
<!-- ゲーム一覧に戻るボタン -->
<a id="backToList" href="../index.html" aria-label="ゲーム一覧に戻る" style="position:fixed;top:max(8px,env(safe-area-inset-top));left:max(8px,env(safe-area-inset-left));z-index:2147483647;padding:6px 12px;border-radius:999px;background:rgba(0,0,0,.6);color:#fff;border:1px solid rgba(255,255,255,.45);font:bold 13px/1.2 system-ui,-apple-system,'Hiragino Sans',sans-serif;text-decoration:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation;">← ゲーム一覧</a>
</body>
</html>
