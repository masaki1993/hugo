<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 900" width="650" height="900">
  <defs>
    <radialGradient id="sky" cx="50%" cy="50%" r="70%">
      <stop offset="0" stop-color="#5fb4ff"/>
      <stop offset="0.45" stop-color="#1f5fc4"/>
      <stop offset="1" stop-color="#0b1f5c"/>
    </radialGradient>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b6fd8"/>
      <stop offset="0.5" stop-color="#173f99"/>
      <stop offset="1" stop-color="#2b6fd8"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff1b8"/>
      <stop offset="0.5" stop-color="#e2b23c"/>
      <stop offset="1" stop-color="#a8761a"/>
    </linearGradient>
    <radialGradient id="core" cx="40%" cy="35%" r="70%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.35" stop-color="#ffe27a"/>
      <stop offset="1" stop-color="#f08a1c"/>
    </radialGradient>
    <clipPath id="inner"><rect x="34" y="34" width="582" height="832" rx="22"/></clipPath>
  </defs>
  <!-- outer blue border (bleeds a little past the cut line) -->
  <rect width="650" height="900" fill="url(#frame)"/>
  <!-- inner swirl field -->
  <g clip-path="url(#inner)">
    <rect x="34" y="34" width="582" height="832" fill="url(#sky)"/>
    <g fill="none" stroke="#ffffff" stroke-opacity="0.16" stroke-width="14" transform="translate(325 450)">
      <path d="M0 0 C 120 -40 180 -200 60 -300 S -260 -260 -300 -60"/>
      <path d="M0 0 C -120 40 -180 200 -60 300 S 260 260 300 60"/>
      <path d="M0 0 C 40 120 200 180 300 60 S 260 -260 60 -300" stroke-opacity="0.1"/>
      <path d="M0 0 C -40 -120 -200 -180 -300 -60 S -260 260 -60 300" stroke-opacity="0.1"/>
      <circle r="250" stroke-opacity="0.08" stroke-width="30"/>
      <circle r="380" stroke-opacity="0.06" stroke-width="40"/>
    </g>
    <g fill="#ffffff">
      <circle cx="120" cy="140" r="3" opacity="0.8"/><circle cx="520" cy="170" r="2.5" opacity="0.7"/>
      <circle cx="90" cy="700" r="2.5" opacity="0.7"/><circle cx="560" cy="760" r="3" opacity="0.8"/>
      <circle cx="470" cy="610" r="2" opacity="0.6"/><circle cx="180" cy="330" r="2" opacity="0.6"/>
    </g>
  </g>
  <rect x="34" y="34" width="582" height="832" rx="22" fill="none" stroke="url(#gold)" stroke-width="6"/>
  <!-- center emblem: original star crystal -->
  <g transform="translate(325 430)">
    <circle r="150" fill="#0b1f5c" stroke="url(#gold)" stroke-width="10"/>
    <circle r="128" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="3" stroke-dasharray="4 10"/>
    <path d="M0 -112 L 26 -36 L 106 -34 L 42 14 L 66 92 L 0 46 L -66 92 L -42 14 L -106 -34 L -26 -36 Z"
          fill="url(#core)" stroke="#fff7d6" stroke-width="5" stroke-linejoin="round"/>
    <circle r="22" fill="#ffffff" opacity="0.9"/>
  </g>
  <!-- title -->
  <g font-family="'Arial Black', 'Hiragino Sans', sans-serif" font-weight="900" text-anchor="middle">
    <text x="325" y="700" font-size="68" fill="#0b1f5c" stroke="#0b1f5c" stroke-width="14" stroke-linejoin="round" letter-spacing="6">CARD RING</text>
    <text x="325" y="700" font-size="68" fill="url(#gold)" letter-spacing="6">CARD RING</text>
    <text x="325" y="760" font-size="28" fill="#ffffff" fill-opacity="0.85" letter-spacing="10">TRADING CARD GAME</text>
  </g>
</svg>
