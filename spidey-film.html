<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
<title>スパイディ 町をまもれ！</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    width: 100%; height: 100%;
    background: #000; color: #fff;
    font-family: "Hiragino Maru Gothic ProN", "Yu Gothic", "Meiryo", system-ui, sans-serif;
    user-select: none; -webkit-user-select: none;
    overflow: hidden; touch-action: none;
  }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #000; }
  #stage { position: relative; width: min(100vw, 100vh * 16 / 9); height: min(100vh, 100vw * 9 / 16); }
  canvas { display: block; width: 100%; height: 100%; }
  #mute {
    position: absolute; top: 4px; left: 50%; transform: translateX(-50%); z-index: 5;
    background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.3);
    color: #fff; border-radius: 8px; font-size: 14px; padding: 2px 8px; cursor: pointer;
  }
  #modes { position: absolute; left: 0; right: 0; bottom: 17%; z-index: 6; display: flex; justify-content: center; gap: 4%; }
  #modes button {
    width: 30%; padding: 1.4% 0; border-radius: 16px; cursor: pointer;
    font-family: inherit; font-weight: 800; font-size: min(3.2vw, 5.6vh); color: #fff;
    border: 3px solid rgba(255,255,255,.8); box-shadow: 0 6px 0 rgba(0,0,0,.4);
  }
  #modes button small { display: block; font-size: 55%; font-weight: 600; opacity: .9; margin-top: 2px; }
  #modes .ruka { background: linear-gradient(#ff9ad5, #e0569e); }
  #modes .normal { background: linear-gradient(#ff5a5a, #b01828); }
  #modes button.sel { outline: 4px solid #ffd23f; outline-offset: 3px; }
  #touch {
    position: fixed; left: 0; right: 0; bottom: 0;
    display: none; justify-content: space-between; align-items: flex-end;
    padding: 0 12px 12px; pointer-events: none; z-index: 4;
  }
  #touch .pad, #touch .actions { display: flex; gap: 10px; pointer-events: auto; }
  #touch .actions { align-items: flex-end; flex-wrap: wrap; justify-content: flex-end; max-width: 330px; }
  #touch button {
    width: 70px; height: 70px; border-radius: 50%;
    background: rgba(255,255,255,.14); border: 2px solid rgba(255,255,255,.45);
    color: #fff; font-size: 14px; font-weight: 700; font-family: inherit; touch-action: none;
  }
  #touch button.on { background: rgba(255,255,255,.35); }
  #touch button[data-k="jump"] { background: rgba(40,110,255,.35); }
  #touch button[data-k="atk"] { background: rgba(255,70,70,.35); }
  #touch button[data-k="web"] { background: rgba(255,255,255,.35); color: #111; }
  #touch button[data-k="turn"], #touch button[data-k="eye"] { width: 58px; height: 58px; font-size: 12px; background: rgba(255,200,0,.3); }
  @media (pointer: coarse) { #touch { display: flex; } }
</style>
</head>
<body>
<div id="wrap">
  <div id="stage">
    <canvas id="c"></canvas>
    <button id="mute">🔊</button>
    <div id="modes">
      <button class="ruka sel" data-mode="ruka">ルカ モード<small>かんたん</small></button>
      <button class="normal" data-mode="normal">ふつう モード<small>ちょっとむずかしい</small></button>
    </div>
  </div>
</div>
<div id="touch">
  <div class="pad">
    <button data-k="left">◀</button>
    <button data-k="right">▶</button>
  </div>
  <div class="actions">
    <button data-k="turn">ふりむく</button>
    <button data-k="eye">アイ</button>
    <button data-k="atk">パンチ</button>
    <button data-k="web">ウェブ</button>
    <button data-k="jump">ジャンプ</button>
  </div>
</div>

<script>
(() => {
  const cv = document.getElementById('c');
  const ctx = cv.getContext('2d');
  const W = 1280, H = 720;
  cv.width = W; cv.height = H;
  const GROUND = 1400, SKY_TOP = GROUND - 1700;
  const STAGE_END = 6200, ARENA_X = 6400, ARENA_END = ARENA_X + 1500;
  let CHECK_X = 3200;
  const rand = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const sign = v => (v < 0 ? -1 : 1);

  // ---------- むずかしさ（ハートは そすう） ----------
  const MODES = {
    ruka:   { name: 'ルカ モード', hearts: 11, gameOver: false, shoot: false, enemySpd: 0.55, aim: 520, stunT: 150, webCD: 90, bossCD: 1.5, bombs: 1 },
    normal: { name: 'ふつう モード', hearts: 13, gameOver: true, shoot: true, enemySpd: 1, aim: 380, stunT: 90, webCD: 150, bossCD: 1, bombs: 2 },
  };
  let MODE = 'ruka', D = MODES.ruka;

  // ---------- 入力 ----------
  const keys = {}, press = {};
  const KEYMAP = {
    ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right',
    ArrowUp: 'jump', KeyW: 'jump', Space: 'jump',
    KeyZ: 'atk', KeyJ: 'atk', KeyX: 'web', KeyK: 'web', KeyC: 'turn', KeyL: 'turn', KeyV: 'eye', KeyE: 'eye', Enter: 'start'
  };
  addEventListener('keydown', e => {
    const k = KEYMAP[e.code]; if (!k) return;
    e.preventDefault();
    if (!keys[k]) press[k] = true;
    keys[k] = true;
    if (k !== 'left' && k !== 'right' && k !== 'eye') press.start = true;
    initAudio();
  });
  addEventListener('keyup', e => { const k = KEYMAP[e.code]; if (k) keys[k] = false; });
  document.querySelectorAll('#touch button').forEach(b => {
    const k = b.dataset.k;
    const down = e => { e.preventDefault(); if (!keys[k]) press[k] = true; keys[k] = true; if (k !== 'eye') press.start = true; b.classList.add('on'); initAudio(); };
    const up = e => { e.preventDefault(); keys[k] = false; b.classList.remove('on'); };
    b.addEventListener('pointerdown', down);
    b.addEventListener('pointerup', up);
    b.addEventListener('pointerleave', up);
    b.addEventListener('pointercancel', up);
  });
  cv.addEventListener('pointerdown', () => { press.start = true; initAudio(); });
  const take = k => { if (press[k]) { press[k] = false; return true; } return false; };
  const clearPress = () => { for (const k in press) press[k] = false; };

  const modesEl = document.getElementById('modes');
  const modeBtns = [...modesEl.querySelectorAll('button')];
  let modeSel = 0;
  function showSel() { modeBtns.forEach((b, i) => b.classList.toggle('sel', i === modeSel)); }
  modeBtns.forEach((b, i) => b.addEventListener('pointerdown', e => {
    e.stopPropagation(); initAudio(); modeSel = i; showSel(); chooseMode(b.dataset.mode);
  }));

  // ---------- サウンド ----------
  let AC = null, master = null, noiseBuf = null, muted = false, bgm = null;
  function initAudio() {
    if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
    try {
      AC = new (window.AudioContext || window.webkitAudioContext)();
      master = AC.createGain(); master.gain.value = muted ? 0 : 0.5; master.connect(AC.destination);
      noiseBuf = AC.createBuffer(1, AC.sampleRate, AC.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    } catch (e) { AC = null; }
  }
  document.getElementById('mute').addEventListener('click', e => {
    e.stopPropagation();
    muted = !muted;
    e.target.textContent = muted ? '🔇' : '🔊';
    if (master) master.gain.value = muted ? 0 : 0.5;
  });
  function tone(f, dur, type = 'square', vol = 0.15, f2 = null, when = 0) {
    if (!AC) return;
    const t = AC.currentTime + when;
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t);
    if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.02);
  }
  function noise(dur, vol = 0.2, freq = 1200, when = 0) {
    if (!AC) return;
    const t = AC.currentTime + when;
    const s = AC.createBufferSource(); s.buffer = noiseBuf;
    const f = AC.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = freq;
    const g = AC.createGain();
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    s.connect(f); f.connect(g); g.connect(master); s.start(t); s.stop(t + dur + 0.02);
  }
  const SFX = {
    jump: () => tone(300, 0.15, 'square', 0.06, 700),
    thwip: () => { noise(0.12, 0.25, 4000); tone(1400, 0.1, 'sine', 0.05, 600); },
    swing: () => noise(0.35, 0.1, 900),
    punch: n => { noise(0.1, 0.25, 1200); tone(160 + n * 40, 0.1, 'square', 0.08, 60); },
    hit: big => { noise(big ? 0.35 : 0.15, big ? 0.5 : 0.3, big ? 500 : 1500); tone(big ? 120 : 200, 0.2, 'square', 0.15, 50); },
    pop: () => { noise(0.25, 0.4, 900); tone(500, 0.2, 'square', 0.1, 1200); },
    hurt: () => { noise(0.3, 0.35, 700); tone(400, 0.35, 'sawtooth', 0.12, 80); },
    boom: () => { noise(0.7, 0.6, 250); tone(80, 0.6, 'sine', 0.3, 30); },
    laugh: () => { for (let i = 0; i < 4; i++) tone(520 - i * 30, 0.1, 'sawtooth', 0.06, 380, i * 0.12); },
    whoosh: () => { noise(0.5, 0.25, 1800); tone(200, 0.5, 'sawtooth', 0.05, 900); },
    tick: () => tone(1000, 0.05, 'square', 0.05),
    heal: () => [784, 988, 1175].forEach((f, i) => tone(f, 0.15, 'triangle', 0.1, null, i * 0.08)),
    fight: () => { tone(523, 0.12, 'square', 0.12); tone(784, 0.4, 'square', 0.12, null, 0.12); },
    win: () => [523, 659, 784, 1046].forEach((f, i) => tone(f, 0.3, 'square', 0.1, null, i * 0.14)),
    eye: () => tone(200, 0.3, 'sine', 0.08, 1600),
    sense: () => { tone(1800, 0.08, 'sine', 0.05); tone(2200, 0.08, 'sine', 0.05, null, 0.08); },
    dodge: () => tone(900, 0.15, 'triangle', 0.08, 1500),
    siren: () => { for (let i = 0; i < 4; i++) { tone(700, 0.25, 'triangle', 0.05, null, i * 0.5); tone(950, 0.25, 'triangle', 0.05, null, i * 0.5 + 0.25); } },
  };
  const SONGS = {
    stage: { tempo: 150, bass: [40, 40, 52, 40, 43, 43, 55, 43, 45, 45, 57, 45, 43, 43, 47, 50], lead: [64, 0, 67, 69, 71, 0, 69, 67, 64, 0, 62, 64, 67, 0, 71, 72] },
    boss:  { tempo: 172, bass: [38, 38, 50, 38, 41, 38, 45, 44, 38, 38, 50, 38, 36, 36, 48, 40], lead: [62, 0, 65, 67, 69, 0, 67, 65, 62, 0, 60, 62, 65, 0, 64, 0] },
    happy: { tempo: 120, bass: [48, 0, 55, 0, 53, 0, 55, 0, 48, 0, 55, 0, 50, 0, 55, 0], lead: [76, 79, 84, 79, 77, 81, 84, 81, 76, 79, 84, 88, 86, 83, 79, 0] },
  };
  let nextNote = 0, noteIdx = 0;
  const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
  setInterval(() => {
    if (!AC || !bgm) return;
    const S = SONGS[bgm];
    const st = 60 / S.tempo / 2;
    if (nextNote < AC.currentTime) nextNote = AC.currentTime + 0.05;
    while (nextNote < AC.currentTime + 0.12) {
      const w = nextNote - AC.currentTime, i = noteIdx % 16;
      if (S.bass[i]) tone(mtof(S.bass[i]), st * 0.9, 'triangle', 0.09, null, w);
      if (S.lead[i] && (bgm === 'happy' || (noteIdx >> 4) % 2 === 1)) tone(mtof(S.lead[i]), st * 0.8, 'square', 0.025, null, w);
      if (bgm !== 'happy') {
        noise(0.04, i % 2 ? 0.03 : 0.05, 8000, w);
        if (i % 4 === 0) tone(110, 0.12, 'sine', 0.18, 40, w);
        if (i % 8 === 4) noise(0.12, 0.08, 1800, w);
      }
      nextNote += st; noteIdx++;
    }
  }, 25);

  // ---------- フィルムグレイン ----------
  const grains = [];
  for (let n = 0; n < 4; n++) {
    const g = document.createElement('canvas'); g.width = 320; g.height = 180;
    const gx = g.getContext('2d'), id = gx.createImageData(320, 180);
    for (let i = 0; i < id.data.length; i += 4) {
      const v = Math.random() * 255;
      id.data[i] = id.data[i + 1] = id.data[i + 2] = v; id.data[i + 3] = 255;
    }
    gx.putImageData(id, 0, 0); grains.push(g);
  }

  // ---------- 町（ビル） ----------
  // 毎回おなじ町になるように 乱数を固定
  let seed = 7;
  const srand = () => { seed = (seed * 16807) % 2147483647; return seed / 2147483647; };
  const buildings = [];
  {
    let x = 500;
    const cols = ['#3b3654', '#4a3a4a', '#2f3e58', '#3f4a3e', '#50404a'];
    while (x < STAGE_END - 200) {
      const w = 260 + srand() * 220;
      const tall = srand();
      const h = tall < 0.25 ? 180 + srand() * 80 : tall < 0.75 ? 320 + srand() * 280 : 620 + srand() * 300;
      buildings.push({ x, w, top: GROUND - h, col: cols[Math.floor(srand() * cols.length)], tank: srand() < 0.35, ant: srand() < 0.3, s: Math.floor(srand() * 1000) });
      x += w + 180 + srand() * 200;
    }
    buildings.push({ x: ARENA_X + 260, w: 230, top: GROUND - 190, col: '#3b3654', tank: false, ant: false, s: 11 });
    buildings.push({ x: ARENA_END - 490, w: 230, top: GROUND - 190, col: '#2f3e58', tank: false, ant: false, s: 12 });
  }
  // チェックポイントは ビルの ない 道路に おく
  while (buildings.some(b => CHECK_X > b.x - 60 && CHECK_X < b.x + b.w + 60)) CHECK_X += 40;
  const nearB = (x, r = 700) => buildings.filter(b => b.x < x + r && b.x + b.w > x - r);

  // ---------- 状態 ----------
  let scene = 'title', sceneT = 0, timeScale = 1, hitstop = 0, simT = 0;
  let shake = 0, flash = 0, lb = 110, lbTarget = 110;
  let sub = null, banner = null, cutF = 0, loser = null;
  let bounds = { min: 60, max: ARENA_END - 60 };
  let checkpoint = 300, checkReached = false, bossReached = false, score = 0, barricade = false;
  let senseOn = false, eyeA = 0;
  const cam = { x: 700, y: GROUND - 300, z: 0.9 };
  let camT = { x: 700, y: GROUND - 300, z: 0.9 };
  let p, g, webs = [], hazards = [], parts = [], enemies = [], items = [], splats = [];

  function makeP(x) {
    return { x, y: GROUND, vx: 0, vy: 0, face: 1, hp: D.hearts, maxHp: D.hearts, onG: true, state: 'idle', t: 0, inv: 0,
      atkId: 0, hitId: -1, combo: 0, anim: 0, swing: null, climbSide: 0, webCD: 0, shootT: 0, wall: 0 };
  }
  function makeGoblin() {
    return { x: ARENA_X + 1100, y: GROUND - 900, vx: 0, vy: 0, face: -1, hp: D.hearts, maxHp: D.hearts, state: 'hover', t: 0,
      cd: 90, webCD: 0, iframe: 0, anim: 0, active: false, side: 1, onG: false };
  }
  function makeEnemies() {
    enemies = []; items = [];
    let x = 900;
    while (x < STAGE_END - 300) {
      const r = srand();
      if (r < 0.3) {
        enemies.push({ type: 'drone', x, home: x, y: GROUND - 260 - srand() * 300, baseY: 0, dir: -1, anim: srand() * 100, cd: 100 + srand() * 100, alive: true, webbed: 0 });
      } else {
        // ビルの上か 道路
        const b = buildings.find(b => x > b.x + 40 && x < b.x + b.w - 40);
        const top = b ? b.top : GROUND;
        enemies.push({ type: 'bot', x, home: x, y: top, minX: b ? b.x + 30 : x - 150, maxX: b ? b.x + b.w - 30 : x + 150, dir: -1, anim: srand() * 100, cd: 120 + srand() * 100, alive: true, webbed: 0 });
      }
      x += 220 + srand() * 220;
    }
    for (const e of enemies) if (e.type === 'drone') e.baseY = e.y;
    // ハートの アイテムは 高いビルの上
    for (const b of buildings) if (b.top < GROUND - 600 && b.x < STAGE_END) items.push({ x: b.x + b.w / 2, y: b.top - 40, got: false });
  }
  function newGame() {
    D = MODES[MODE]; seed = 99;
    p = makeP(400); g = makeGoblin();
    webs = []; hazards = []; parts = []; splats = [];
    makeEnemies();
    checkpoint = 300; checkReached = false; bossReached = false; score = 0; barricade = false;
    bounds = { min: 60, max: ARENA_END - 60 };
    cam.x = 700; cam.y = GROUND - 300; cam.z = 0.9;
  }
  function setScene(s) { scene = s; sceneT = 0; clearPress(); modesEl.style.display = s === 'title' ? 'flex' : 'none'; }
  function chooseMode(m) {
    if (scene !== 'title') return;
    MODE = m; newGame(); setScene('leader'); SFX.tick();
  }

  // ---------- パーティクル ----------
  function sparks(x, y, n, col = '#fff6a0', spd = 10) {
    for (let i = 0; i < n; i++) {
      const a = rand(0, Math.PI * 2), v = rand(spd * 0.3, spd);
      parts.push({ type: 'spark', x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: rand(15, 30), max: 30, col, size: rand(2, 5) });
    }
  }
  function smoke(x, y, n) {
    for (let i = 0; i < n; i++)
      parts.push({ type: 'dust', x: x + rand(-30, 30), y: y - rand(0, 30), vx: rand(-3, 3), vy: rand(-3, -0.5), life: rand(25, 50), max: 50, size: rand(10, 24) });
  }
  function popText(x, y, txt, col = '#fff') { parts.push({ type: 'text', x, y, vx: 0, vy: -2.2, life: 50, max: 50, txt, col }); }
  function comicFX(x, y, txt) { parts.push({ type: 'comic', x, y, vx: 0, vy: -0.5, life: 26, max: 26, txt, rot: rand(-0.3, 0.3) }); }
  function explode(x, y, r = 70) {
    SFX.boom(); shake = Math.max(shake, 12);
    sparks(x, y, 26, '#ffb040', 12); smoke(x, y, 10);
    parts.push({ type: 'impact', x, y, life: 12, max: 12, size: r * 1.3, col: '#ffd070' });
    if (Math.hypot(p.x - x, p.y - 45 - y) < r + 20) hurtP(sign(p.x - x));
  }

  // ---------- 当たり判定 ----------
  const overlap = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
  const pbox = () => ({ x: p.x - 18, y: p.y - 86, w: 36, h: 86 });
  function ebox(e) {
    return e.type === 'drone' ? { x: e.x - 30, y: e.y - 20, w: 60, h: 40 } : { x: e.x - 24, y: e.y - 56, w: 48, h: 56 };
  }
  const gbox = () => ({ x: g.x - 30, y: g.y - 90, w: 60, h: 90 });

  // ビルとの あたり判定（かべ と やね）
  function moveAndCollide(o, hw = 18, hh = 86) {
    const prevY = o.y;
    o.x += o.vx; o.wall = 0;
    for (const b of nearB(o.x, 600)) {
      if (o.x + hw > b.x && o.x - hw < b.x + b.w && o.y > b.top + 4 && o.y - hh < GROUND) {
        if (o.x < b.x + b.w / 2) { o.x = b.x - hw; o.wall = 1; } else { o.x = b.x + b.w + hw; o.wall = -1; }
        o.vx = 0;
      }
    }
    o.y += o.vy; o.onG = false;
    for (const b of nearB(o.x, 600)) {
      if (o.x + hw > b.x && o.x - hw < b.x + b.w && prevY <= b.top + 0.5 && o.y >= b.top && o.vy >= 0) { o.y = b.top; o.vy = 0; o.onG = true; }
    }
    if (o.y >= GROUND) { o.y = GROUND; o.vy = 0; o.onG = true; }
    const ceil = barricade ? GROUND - 820 : SKY_TOP + 100;
    if (o.y < ceil) { o.y = ceil; if (o.vy < 0) o.vy = 0; }
    if (o.x < bounds.min) { o.x = bounds.min; if (o.vx < 0) o.vx = 0; }
    if (o.x > bounds.max) { o.x = bounds.max; if (o.vx > 0) o.vx = 0; }
  }
  const insideBuilding = (x, y) => buildings.some(b => x > b.x && x < b.x + b.w && y > b.top);
  function surfaceBelow(x, y) {
    let best = GROUND;
    for (const b of nearB(x, 50)) if (x > b.x && x < b.x + b.w && b.top >= y - 1 && b.top < best) best = b.top;
    return best;
  }

  // ---------- プレイヤー ----------
  const playing = () => scene === 'play' || scene === 'boss';
  const input = k => playing() && keys[k];
  const inputP = k => playing() && take(k);
  const newAttack = () => p.atkId++;

  function webTarget() {
    let best = null, bd = D.aim;
    const list = enemies.filter(e => e.alive && !e.webbed).map(e => ({ x: e.x, y: e.type === 'drone' ? e.y : e.y - 30 }));
    if (g.active && g.state !== 'ko') list.push({ x: g.x, y: g.y - 50 });
    for (const c of list) {
      const dx = c.x - p.x, dy = c.y - (p.y - 62);
      if (Math.sign(dx) !== p.face) continue;
      const d = Math.hypot(dx, dy);
      if (d < bd && Math.abs(dy) < Math.abs(dx) * 1.2 + 60) { bd = d; best = c; }
    }
    return best;
  }
  function shootWeb() {
    p.webCD = 14; p.shootT = 12;
    const hx = p.x + p.face * 30, hy = p.y - 66;
    const t = webTarget();
    let vx = p.face * 24, vy = 0;
    if (t) { const dx = t.x - hx, dy = t.y - hy, d = Math.hypot(dx, dy) || 1; vx = dx / d * 24; vy = dy / d * 24; }
    webs.push({ x: hx, y: hy, ox: hx, oy: hy, vx, vy, life: 38 });
    SFX.thwip();
  }
  function startSwing() {
    const ax = p.x + p.face * 240 + p.vx * 6;
    let ay = p.y - 60 - 380;
    // ちかくの ビルの かどに くっつく
    for (const b of nearB(ax, 300)) {
      const edge = p.face > 0 ? b.x : b.x + b.w;
      if (Math.abs(edge - ax) < 200 && b.top < p.y - 200 && b.top > ay - 200) { ay = b.top + 20; break; }
    }
    ay = Math.max(ay, barricade ? GROUND - 900 : SKY_TOP + 120);
    p.swing = { ax, ay, len: Math.hypot(ax - p.x, ay - (p.y - 60)), t: 0 };
    p.state = 'swing';
    SFX.thwip(); SFX.swing();
  }
  function updateP() {
    p.anim++;
    if (p.inv > 0) p.inv--;
    if (p.webCD > 0) p.webCD--;
    if (p.shootT > 0) p.shootT--;
    const L = input('left'), R = input('right'), J = input('jump');

    if (p.state === 'ko') {
      p.vy += 0.8; p.vx *= 0.97; moveAndCollide(p); p.ang = (p.ang || 0) - 0.15;
      return;
    }
    if (inputP('turn') && p.state !== 'hurt') { p.face *= -1; p.turnLock = 30; comicFX(p.x, p.y - 120, 'クルッ'); }
    if (p.turnLock > 0) p.turnLock--;
    if (inputP('web') && p.webCD <= 0 && p.state !== 'hurt') shootWeb();

    if (p.state === 'hurt') {
      p.vy += 0.8; p.vx *= 0.92; moveAndCollide(p);
      if (--p.t <= 0) p.state = p.onG ? 'idle' : 'jump';
    } else if (p.state === 'swing') {
      const s = p.swing; s.t++;
      p.vy += 0.75;
      if (R) p.vx += 0.32; if (L) p.vx -= 0.32;
      let cx = p.x + p.vx, cy = p.y - 60 + p.vy;
      const d = Math.hypot(cx - s.ax, cy - s.ay);
      if (d > s.len) { cx = s.ax + (cx - s.ax) * s.len / d; cy = s.ay + (cy - s.ay) * s.len / d; }
      s.len = Math.max(150, s.len - 0.6);
      p.vx = clamp(cx - p.x, -26, 26); p.vy = clamp(cy + 60 - p.y, -26, 26);
      if (!p.turnLock) { if (R && !L) p.face = 1; else if (L && !R) p.face = -1; }
      moveAndCollide(p);
      if (simT % 2 === 0 && Math.hypot(p.vx, p.vy) > 14) parts.push({ type: 'streak', x: p.x, y: p.y - 50, vx: 0, vy: 0, life: 10, max: 10 });
      if ((!J && s.t > 6) || s.t > 160 || p.onG || p.wall) {
        p.state = p.onG ? 'idle' : 'jump'; p.swing = null;
        if (!p.onG) { p.vy -= 3; p.vx *= 1.1; }
      }
    } else if (p.state === 'climb') {
      const side = p.climbSide;
      const toward = (side > 0 && R) || (side < 0 && L);
      const away = (side > 0 && L) || (side < 0 && R);
      p.vx = side * 1.5;
      p.vy = toward ? -6 : 1.2;
      p.face = side;
      if (inputP('jump')) {
        p.state = 'jump'; p.vx = -side * 9; p.vy = -15; p.face = -side; SFX.jump();
      } else {
        moveAndCollide(p);
        if (away) { p.state = 'jump'; p.vx = -side * 4; }
        else if (!p.wall) { p.state = 'jump'; p.vy = -9; p.vx = side * 4; } // やねに よじのぼる
        else if (p.onG && !toward) p.state = 'idle';
      }
    } else {
      const acc = p.onG ? 1.1 : 0.6, max = 9.5;
      if (L) p.vx -= acc; if (R) p.vx += acc;
      if (!L && !R) p.vx *= p.onG ? 0.8 : 0.98;
      p.vx = clamp(p.vx, -max - (p.onG ? 0 : 8), max + (p.onG ? 0 : 8));
      if (!p.turnLock && p.state !== 'punch' && p.state !== 'kick') { if (L && !R) p.face = -1; else if (R && !L) p.face = 1; }
      if (inputP('jump')) {
        if (p.onG) { p.vy = -17; p.onG = false; p.state = 'jump'; SFX.jump(); }
        else startSwing();
      }
      if (p.state !== 'swing') {
        if (inputP('atk')) {
          p.combo = (p.state === 'punch' || p.state === 'kick') ? p.combo : (p.combo + 1) % 3;
          if (p.state !== 'punch' && p.state !== 'kick') {
            p.state = p.combo === 2 ? 'kick' : 'punch'; p.t = 16; newAttack();
            p.vx += p.face * 3; SFX.punch(p.combo);
          }
        }
        p.vy = Math.min(p.vy + 0.8, 20);
        moveAndCollide(p);
        if (p.state === 'punch' || p.state === 'kick') { if (--p.t <= 0) p.state = p.onG ? 'idle' : 'jump'; }
        else {
          const into = (p.wall > 0 && R) || (p.wall < 0 && L);
          if (p.wall && into) { p.state = 'climb'; p.climbSide = p.wall; }
          else p.state = p.onG ? (Math.abs(p.vx) > 0.6 ? 'run' : 'idle') : 'jump';
        }
      }
    }
  }

  // ---------- ザコ（めっちゃ弱い） ----------
  function updateEnemies() {
    for (const e of enemies) {
      if (!e.alive) continue;
      e.anim++;
      if (e.webbed) { if (--e.webbed <= 0) defeat(e, false); continue; }
      if (Math.abs(e.x - p.x) > 1600) continue;
      if (e.type === 'bot') {
        e.x += e.dir * 1.6 * D.enemySpd;
        if (e.x < e.minX) e.dir = 1;
        if (e.x > e.maxX) e.dir = -1;
        if (e.y >= GROUND && insideBuilding(e.x + e.dir * 26, GROUND - 10)) e.dir *= -1;
        if (D.shoot && scene === 'play' && Math.abs(e.x - p.x) < 420 && Math.abs(e.y - p.y) < 120 && --e.cd <= 0) {
          e.cd = rand(140, 220); e.dir = sign(p.x - e.x);
          hazards.push({ type: 'ball', x: e.x + e.dir * 20, y: e.y - 34, vx: e.dir * 5, vy: 0, life: 150 });
          tone(700, 0.1, 'square', 0.04, 400);
        }
      } else {
        e.x += e.dir * 1.3 * D.enemySpd;
        if (e.x < e.home - 160) e.dir = 1;
        if (e.x > e.home + 160) e.dir = -1;
        e.y = e.baseY + Math.sin(e.anim * 0.05) * 30;
        if (D.shoot && scene === 'play' && Math.abs(e.x - p.x) < 60 && p.y > e.y && --e.cd <= 0) {
          e.cd = rand(120, 180);
          hazards.push({ type: 'bomb', x: e.x, y: e.y + 16, vx: 0, vy: 2, life: 200, grav: 0.3 });
        }
      }
    }
  }
  function defeat(e, punched) {
    e.alive = false;
    SFX.pop(); hitstop = 3; shake = 4;
    sparks(e.x, e.y - 20, 14, punched ? '#ffb040' : '#ffffff', 8);
    parts.push({ type: 'impact', x: e.x, y: e.y - 20, life: 10, max: 10, size: 50, col: '#fff' });
    score += 100; popText(e.x, e.y - 70, '+100', '#ffd23f');
  }

  // ---------- ボス：グリーンゴブリン ----------
  function updateGoblin() {
    if (!g.active) return;
    g.anim++;
    if (g.iframe > 0) g.iframe--;
    if (g.webCD > 0) g.webCD--;
    const dx = p.x - g.x;
    switch (g.state) {
      case 'ko':
        g.vy += 0.6; g.x += g.vx; g.y += g.vy; g.vx *= 0.98;
        if (g.y >= GROUND) { g.y = GROUND; g.vy *= -0.3; g.vx *= 0.8; }
        return;
      case 'hover': {
        g.face = sign(dx);
        const tx = clamp(p.x + g.side * 280, ARENA_X + 120, ARENA_END - 120);
        const ty = clamp(p.y - 280, GROUND - 720, GROUND - 200);
        g.vx = lerp(g.vx, clamp((tx - g.x) * 0.04, -7, 7), 0.08);
        g.vy = lerp(g.vy, clamp((ty - g.y) * 0.04, -6, 6), 0.08);
        g.x += g.vx; g.y += g.vy + Math.sin(g.anim * 0.08) * 0.6;
        if (--g.cd <= 0 && p.state !== 'ko') {
          if (Math.random() < 0.55) { g.state = 'throw'; g.t = 24; g.shots = D.bombs; }
          else { g.state = 'diveW'; g.t = Math.round(40 * Math.min(1.3, D.bossCD)); SFX.laugh(); }
        }
        break;
      }
      case 'throw':
        g.vx *= 0.9; g.vy *= 0.9; g.x += g.vx; g.y += g.vy;
        if (--g.t <= 0) {
          const T = 42;
          hazards.push({ type: 'pumpkin', x: g.x + g.face * 20, y: g.y - 60, vx: (p.x - g.x) / T, vy: ((p.y - 40) - (g.y - 60) - 0.5 * 0.35 * T * T) / T, life: 240, grav: 0.35 });
          tone(300, 0.15, 'square', 0.06, 150);
          if (--g.shots > 0) g.t = 22; else { g.state = 'hover'; g.cd = Math.round(rand(80, 130) * D.bossCD); g.side *= -1; }
        }
        break;
      case 'diveW':
        g.vx *= 0.85; g.vy *= 0.85; g.x += g.vx; g.y += g.vy - 0.6;
        if (--g.t <= 0) {
          const ddx = p.x - g.x, ddy = (p.y - 30) - g.y, d = Math.hypot(ddx, ddy) || 1;
          const sp = MODE === 'ruka' ? 10 : 14;
          g.vx = ddx / d * sp; g.vy = ddy / d * sp; g.state = 'dive'; g.t = 45; g.hitDone = false; SFX.whoosh();
        }
        break;
      case 'dive':
        g.x += g.vx; g.y += g.vy;
        if (g.y > GROUND - 40) { g.y = GROUND - 40; g.vy = -2; }
        if (simT % 2 === 0) parts.push({ type: 'spark', x: g.x - g.face * 40, y: g.y + 4, vx: -g.vx * 0.3, vy: 0, life: 14, max: 14, col: '#ff9030', size: 6 });
        if (--g.t <= 0) { g.state = 'rec'; g.t = 60; }
        break;
      case 'rec':
        // つかれて ひくく とんでいる：パンチの チャンス
        g.vx *= 0.9; g.vy = lerp(g.vy, ((GROUND - 30) - g.y) * 0.08, 0.15);
        g.x += g.vx; g.y += g.vy;
        if (--g.t <= 0) { g.state = 'hover'; g.cd = Math.round(rand(70, 120) * D.bossCD); g.side *= -1; }
        break;
      case 'stun':
        // ウェブで ぐるぐるまき
        g.vx *= 0.9; g.x += g.vx;
        if (g.y < surfaceBelow(g.x, g.y)) { g.vy = Math.min(g.vy + 0.6, 12); g.y = Math.min(g.y + g.vy, surfaceBelow(g.x, g.y)); }
        if (--g.t <= 0) {
          g.state = 'hover'; g.webCD = D.webCD; g.cd = 50; g.vy = -6;
          popText(g.x, g.y - 120, 'ぬけだした！', '#9fff7a'); sparks(g.x, g.y - 50, 20, '#ffffff', 8); SFX.laugh();
        }
        break;
    }
    g.x = clamp(g.x, ARENA_X + 60, ARENA_END - 60);
  }
  function hitGoblin(big) {
    if (g.state === 'ko' || g.iframe > 0) return;
    g.hp = Math.max(0, g.hp - 1); g.iframe = 20;
    hitstop = big ? 9 : 5; shake = big ? 12 : 6;
    SFX.hit(big);
    sparks(g.x, g.y - 50, 16, '#fff6a0', 10);
    parts.push({ type: 'impact', x: g.x, y: g.y - 50, life: 10, max: 10, size: big ? 80 : 55, col: '#fff' });
    popText(g.x, g.y - 130, '-1 ♥', '#ffd23f');
    if (g.hp <= 0) startKO('g');
  }

  // ---------- ダメージ ----------
  function hurtP(dir) {
    if (p.inv > 0 || p.state === 'ko' || !playing()) return;
    p.hp = Math.max(0, p.hp - 1);
    p.state = 'hurt'; p.t = 22; p.vx = dir * 9; p.vy = -8; p.onG = false; p.inv = 80; p.swing = null;
    hitstop = 6; shake = 10; flash = 0.2;
    SFX.hurt();
    sparks(p.x, p.y - 50, 14, '#ff6060', 9);
    popText(p.x, p.y - 120, '-1 ♥', '#ff7070');
    if (p.hp <= 0) {
      if (D.gameOver) startKO('p');
      else { p.hp = p.maxHp; p.inv = 150; banner = { text: 'まだまだ！', t: 0, max: 80, col: '#ff9ad5' }; SFX.heal(); }
    }
  }
  function startKO(who) {
    loser = who;
    hitstop = 14; shake = 22; flash = 1;
    bgm = null;
    if (who === 'g') {
      g.state = 'ko'; g.vx = sign(g.x - p.x) * 6; g.vy = -10; SFX.hit(true); SFX.siren();
      sparks(g.x, g.y - 50, 40, '#ffffff', 14);
      hazards = [];
    } else {
      p.state = 'ko'; p.vx = -p.face * 10; p.vy = -14; p.onG = false; p.inv = 999; p.swing = null; SFX.hurt();
    }
    setScene('ko');
  }

  function punchBox() {
    if ((p.state === 'punch' || p.state === 'kick') && p.t <= 12 && p.t >= 5)
      return { x: p.x + (p.face > 0 ? 8 : -78), y: p.y - (p.state === 'kick' ? 60 : 80), w: 70, h: 40 };
    return null;
  }
  function resolve() {
    const pb = pbox(), ab = punchBox();
    for (const e of enemies) {
      if (!e.alive || e.webbed) continue;
      const eb = ebox(e);
      if (ab && overlap(ab, eb)) { comicFX(e.x, e.y - 40, p.state === 'kick' ? 'バシッ!' : 'ポカッ!'); defeat(e, true); }
      else if (overlap(pb, eb)) hurtP(sign(p.x - e.x));
    }
    for (const it of items) {
      if (!it.got && Math.hypot(it.x - p.x, it.y - (p.y - 45)) < 50) {
        it.got = true; p.hp = Math.min(p.maxHp, p.hp + 1); SFX.heal();
        popText(it.x, it.y - 30, '+1 ♥', '#ff9ad5'); sparks(it.x, it.y, 14, '#ff9ad5', 6);
      }
    }
    if (!g.active || g.state === 'ko') return;
    const gb = gbox();
    if (g.state === 'dive' && !g.hitDone && overlap(gb, pb)) { g.hitDone = true; hurtP(sign(g.vx)); }
    if (ab && p.hitId !== p.atkId && overlap(ab, gb)) {
      p.hitId = p.atkId;
      comicFX(g.x, g.y - 60, p.state === 'kick' ? 'ドカッ!' : 'バシッ!');
      hitGoblin(p.state === 'kick');
      if (g.state !== 'stun') { g.vx = p.face * 6; if (g.state === 'dive') { g.state = 'rec'; g.t = 40; } }
    }
  }

  function updateWebs() {
    for (const w of webs) {
      w.x += w.vx; w.y += w.vy; w.life--;
      if (insideBuilding(w.x, w.y) || w.y > GROUND) {
        w.life = 0; splats.push({ x: w.x, y: Math.min(w.y, GROUND - 4), life: 120 });
        continue;
      }
      for (const e of enemies) {
        if (!e.alive || e.webbed) continue;
        if (overlap({ x: w.x - 12, y: w.y - 12, w: 24, h: 24 }, ebox(e))) {
          w.life = 0; e.webbed = 36; comicFX(e.x, e.y - 50, 'ペタッ!'); SFX.thwip(); break;
        }
      }
      // ボムを ウェブで とめる
      for (const h of hazards) {
        if (h.life > 0 && Math.hypot(h.x - w.x, h.y - w.y) < 28) {
          w.life = 0; h.life = 0; splats.push({ x: h.x, y: h.y, life: 50 }); popText(h.x, h.y - 30, 'キャッチ!', '#fff'); SFX.thwip();
        }
      }
      if (w.life > 0 && g.active && g.state !== 'ko' && overlap({ x: w.x - 12, y: w.y - 12, w: 24, h: 24 }, gbox())) {
        w.life = 0;
        if (g.state === 'stun') { popText(g.x, g.y - 140, 'もう ぐるぐる!', '#fff'); }
        else if (g.webCD > 0 || g.state === 'dive') {
          // ウェブばかりだと よけられる
          popText(g.x, g.y - 140, 'よけた！', '#9fff7a'); SFX.dodge();
          g.vy = -8; g.vx = rand(-6, 6);
        } else {
          hitGoblin(true);
          if (g.state !== 'ko') { g.state = 'stun'; g.t = D.stunT; g.vy = 0; comicFX(g.x, g.y - 60, 'ぐるぐる!'); }
        }
      }
    }
    webs = webs.filter(w => w.life > 0);
    for (const s of splats) s.life--;
    splats = splats.filter(s => s.life > 0);
  }

  function updateHazards() {
    for (const h of hazards) {
      h.x += h.vx; h.y += h.vy; h.vy += h.grav || 0; h.life--;
      if (h.type === 'ball') {
        if (overlap({ x: h.x - 8, y: h.y - 8, w: 16, h: 16 }, pbox())) { h.life = 0; hurtP(sign(h.vx)); }
        if (insideBuilding(h.x, h.y)) h.life = 0;
      } else {
        const ground = h.y >= GROUND - 6 || insideBuilding(h.x, h.y);
        const touch = Math.hypot(h.x - p.x, h.y - (p.y - 45)) < 40;
        if (ground || touch || h.life <= 0) { h.life = 0; explode(h.x, h.y, h.type === 'pumpkin' ? 80 : 60); }
      }
    }
    hazards = hazards.filter(h => h.life > 0);
  }

  function updateParts() {
    for (const q of parts) {
      q.x += q.vx || 0; q.y += q.vy || 0; q.life--;
      if (q.type === 'spark') { q.vx *= 0.92; q.vy = q.vy * 0.92 + 0.3; }
      if (q.type === 'dust') { q.vx *= 0.95; q.vy *= 0.95; }
    }
    parts = parts.filter(q => q.life > 0);
    if (parts.length > 500) parts.splice(0, parts.length - 500);
  }

  // スパイディセンス：あぶないものが ちかくに あると ピリピリ
  function checkSense() {
    let near = hazards.some(h => Math.hypot(h.x - p.x, h.y - (p.y - 50)) < 260);
    if (!near) near = enemies.some(e => e.alive && !e.webbed && Math.hypot(e.x - p.x, e.y - p.y) < 150);
    if (!near && g.active && (g.state === 'diveW' || g.state === 'dive' || g.state === 'throw')) near = true;
    if (near && !senseOn) SFX.sense();
    senseOn = near;
  }

  function say(name, text, dur, col = '#fff') { sub = { name, text, until: cutF + dur, col }; }

  // ---------- オープニング ----------
  function cutStep() {
    cutF++; p.anim++; g.anim++;
    if (cutF === 1) {
      say('', '夜の町。みんなが ぐっすり ねむっている……', 110);
      g.active = false; g.x = 2200; g.y = GROUND - 500; g.state = 'hover';
      p.x = -200; p.y = GROUND - 300; p.state = 'swing';
    }
    if (cutF < 110) camT = { x: 900 + cutF * 2, y: GROUND - 380, z: 0.75 };
    if (cutF >= 110 && cutF < 240) {
      g.x = lerp(g.x, 1150, 0.04); g.y = lerp(g.y, GROUND - 380, 0.04); g.face = -1;
      camT = { x: g.x - 60, y: g.y - 40, z: 1.1 };
    }
    if (cutF === 130) { SFX.laugh(); say('グリーンゴブリン', 'ハハハ！ この町は ゴブリンさまの ものだ！', 120, '#9fff7a'); }
    if (cutF === 250) hazards.push({ type: 'pumpkin', x: g.x, y: g.y - 50, vx: -3, vy: -4, life: 200, grav: 0.35 });
    if (cutF >= 250 && cutF < 320) camT = { x: 1050, y: GROUND - 260, z: 0.85 };
    // スパイディ スイングで とうじょう
    if (cutF >= 320 && cutF < 400) {
      const t = (cutF - 320) / 80;
      p.x = lerp(-100, 820, t); p.y = GROUND - 120 - Math.sin(t * Math.PI) * 260 - (1 - t) * 160;
      p.state = t < 0.85 ? 'swing' : 'jump'; p.face = 1;
      p.swing = t < 0.85 ? { ax: 360, ay: GROUND - 760, len: 1, t: 0 } : null;
      p.vx = 12; p.vy = 0;
      camT = { x: p.x + 120, y: GROUND - 300, z: 0.95 };
      if (cutF === 322) { SFX.thwip(); SFX.whoosh(); }
    }
    if (cutF === 400) { p.x = 820; p.y = GROUND; p.state = 'idle'; p.swing = null; p.vx = 0; smoke(p.x, GROUND, 6); say('スパイディ', 'そうは させないぞ、ゴブリン！', 120, '#ff7a7a'); }
    if (cutF >= 400 && cutF < 520) camT = { x: p.x + 30, y: GROUND - 90, z: 1.7 };
    if (cutF === 520) { SFX.laugh(); say('グリーンゴブリン', 'つかまえられるかな？ ハハハハ！', 110, '#9fff7a'); }
    if (cutF >= 520 && cutF < 630) { g.x += 9; g.y -= 3; camT = { x: Math.min(g.x, 1700), y: GROUND - 400, z: 0.9 }; }
    if (cutF === 630) { say('スパイディ', 'スパイディ、しゅつどう！', 100, '#ff7a7a'); p.eyeSquint = 40; SFX.eye(); }
    if (cutF >= 630) camT = { x: p.x + 20, y: GROUND - 90, z: 1.8 };
    if (cutF === 730) startStage();
  }
  function startStage() {
    g = makeGoblin(); hazards = [];
    p.x = checkpoint; p.y = GROUND; p.state = 'idle'; p.face = 1; p.swing = null; p.vx = 0; p.vy = 0;
    setScene('stageIntro'); sub = null;
    banner = { text: 'ゴブリンを おいかけろ！', t: 0, max: 110, col: '#ffd23f' };
    SFX.fight(); bgm = 'stage';
  }

  // ---------- ボス ----------
  function enterArena() {
    bossReached = true; barricade = true;
    bounds = { min: ARENA_X + 60, max: ARENA_END - 60 };

  function bossCutStep() {

  function beginBoss() {

  function retry() {

  // ---------- シミュレーション ----------
  function step() {
    simT++;
    if (hitstop > 0) { hitstop--; return; }
    if (p.eyeSquint > 0) p.eyeSquint--;
    if (scene === 'cut') { cutStep(); updateHazards(); }
    if (scene === 'bossCut') bossCutStep();
    if (scene === 'win') winStep();
    if (scene === 'play' || scene === 'boss' || scene === 'ko') {
      updateP();
      updateEnemies();
      updateGoblin();
      updateWebs();
      updateHazards();
      if (playing()) { resolve(); checkSense(); }
      if (scene === 'play') {
        if (!checkReached && p.x > CHECK_X) {
          checkReached = true; checkpoint = CHECK_X; SFX.heal();
          popText(CHECK_X, GROUND - 200, 'チェックポイント！', '#7fe0ff');

        if (p.x > ARENA_X + 120) enterArena();

    }
    if (scene === 'stageIntro') { p.anim++; }
    updateParts();
  }

  function sceneTick(dt) {
    sceneT += dt;
    if (shake > 0) shake = Math.max(0, shake - dt * 0.9);
    if (flash > 0) flash = Math.max(0, flash - dt * 0.04);
    if (banner) { banner.t += dt; if (banner.t > banner.max) banner = null; }
    const eyeOn = playing() && keys.eye;
    if (eyeOn && eyeA < 0.05) SFX.eye();
    eyeA = lerp(eyeA, eyeOn ? 1 : 0, Math.min(1, 0.15 * dt));
    switch (scene) {
      case 'title':
        lbTarget = 110;
        if (take('left')) { modeSel = 0; showSel(); SFX.tick(); }
        if (take('right')) { modeSel = 1; showSel(); SFX.tick(); }
        if (take('start')) chooseMode(modeSel === 0 ? 'ruka' : 'normal');
        break;
      case 'leader':
        if (take('start') && sceneT > 20) sceneT = Math.max(sceneT, 470);
        if (sceneT < 180 && Math.floor(sceneT) % 60 === 0) SFX.tick();
        if (sceneT >= 470) { setScene('cut'); cutF = 0; bgm = null; }
        break;
      case 'cut':
        lbTarget = 110;
        if (take('start') && cutF > 30) startStage();
        break;
      case 'stageIntro':
        lbTarget = 64;
        camT = { x: p.x + 160, y: p.y - 140, z: 0.9 };
        if (sceneT >= 90) setScene('play');
        break;
      case 'play': {
        lbTarget = 64;
        const z = lerp(0.9 - Math.min(0.15, Math.hypot(p.vx, p.vy) / 160), 0.42, eyeA);
        camT = { x: p.x + p.face * 160 * (1 + eyeA * 2) + p.vx * 6, y: p.y - 130 - eyeA * 120, z };
        break;
      }
      case 'bossCut':
        lbTarget = 110;
        if (take('start') && cutF > 30) beginBoss();
        break;
      case 'boss': {
        lbTarget = 64;
        // スパイディと ゴブリンが どちらも 画面に はいるように
        const dx = Math.abs(p.x - g.x) + 500, dy = Math.abs(p.y - g.y) + 360;
        const z = lerp(clamp(Math.min(W / dx, (H - 140) / dy), 0.55, 0.9), 0.5, eyeA);
        camT = { x: (p.x + g.x) / 2, y: (p.y + g.y) / 2 - 60, z };
        break;
      }
      case 'ko': {
        lbTarget = 120;
        timeScale = sceneT < 100 ? 0.2 : 1;
        const o = loser === 'p' ? p : g;
        camT = { x: o.x, y: o.y - 90, z: sceneT < 100 ? 1.6 : 1.1 };
        if (sceneT >= 1 && sceneT - 1 < 1) banner = loser === 'g' ? { text: 'つかまえた！', t: 0, max: 150, col: '#ffffff' } : { text: 'K.O.', t: 0, max: 150, col: '#ff4848' };
        if (sceneT > 180) {
          timeScale = 1;
          if (loser === 'g') { setScene('win'); cutF = 0; g.state = 'ko'; }
          else setScene('lose');
        }
        break;
      }
      case 'win':
        lbTarget = 110;
        if (take('start') && cutF > 60 && cutF < 480) cutF = 479;
        break;
      case 'credits':
        lbTarget = 110;
        if (sceneT > 120 && take('start')) { bgm = null; setScene('title'); }
        break;
      case 'lose':
        lbTarget = 110;
        if (sceneT > 60 && take('start')) retry();
        break;
    }
    lb = lerp(lb, lbTarget, Math.min(1, 0.08 * dt));
    if (camT.z < 1.5) camT.y = Math.min(camT.y, GROUND - (H / 2 - lb - 60) / camT.z);
    const k = Math.min(1, (scene === 'cut' || scene === 'bossCut' ? 0.06 : 0.1) * dt);
    cam.x = lerp(cam.x, camT.x, k); cam.y = lerp(cam.y, camT.y, k); cam.z = lerp(cam.z, camT.z, k);
    const half = W / 2 / cam.z, halfH = H / 2 / cam.z;
    const minX = barricade ? ARENA_X : 0;
    cam.x = clamp(cam.x, minX + half, ARENA_END + 200 - half);
    cam.y = clamp(cam.y, SKY_TOP + halfH, GROUND + 140 - halfH + 200);
  }

  // ---------- 描画：スパイディ ----------
  const RED = '#d4202c', RED_D = '#9a1420', BLUE = '#1f3fae', BLUE_D = '#142a78';
  function seg(x1, y1, x2, y2, w, col) {
    ctx.strokeStyle = col; ctx.lineWidth = w; ctx.lineCap = 'round';

  }
  // 2本の線で ひざ・ひじを まげる
  function joint(ax, ay, bx, by, bend) {
    const mx = (ax + bx) / 2, my = (ay + by) / 2;
    const dx = bx - ax, dy = by - ay, d = Math.hypot(dx, dy) || 1;
    const len = 38;

      f2 = { x: -Math.sin(ph) * 20, y: -Math.max(0, -Math.cos(ph)) * 14 };

    } else if (st === 'swing') {

    } else if (st === 'climb') {

    ctx.strokeStyle = 'rgba(0,0,0,.55)'; ctx.lineWidth = 0.9;

    ctx.strokeStyle = 'rgba(0,0,0,.45)';

    const squint = Math.max(eyeA * (o === p ? 1 : 0), (o.eyeSquint || 0) > 0 ? 1 : 0);

  function drawCocoon(x, y, rx, ry) {

  function drawPumpkin(x, y, s = 1) {

      ctx.fillStyle = '#ff8a1a'; ctx.beginPath(); ctx.ellipse(0, -60, 15, 12, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#ffe23f'; ctx.fillRect(-12, -63, 9, 4);

  // ---------- 描画：背景と 町 ----------
  function drawBackground() {
    const sky = ctx.createLinearGradient(0, 0, 0, H);
    sky.addColorStop(0, '#070a24'); sky.addColorStop(0.5, '#1c1a4a'); sky.addColorStop(0.8, '#5a2e5a'); sky.addColorStop(1, '#c85a4a');
    ctx.fillStyle = sky; ctx.fillRect(0, 0, W, H);
    // ほし
    ctx.fillStyle = 'rgba(255,255,255,.8)';
    for (let i = 0; i < 70; i++) {
      const x = ((i * 233 - cam.x * 0.02) % W + W) % W, y = (i * 97) % (H * 0.6);
      ctx.globalAlpha = 0.4 + Math.sin(simT * 0.05 + i) * 0.3;
      ctx.fillRect(x, y, 2, 2);
    }
    ctx.globalAlpha = 1;
    // つき
    const mx = W * 0.78 - cam.x * 0.01, my = 130;
    const mg = ctx.createRadialGradient(mx, my, 20, mx, my, 160);
    mg.addColorStop(0, 'rgba(255,250,220,.6)'); mg.addColorStop(1, 'rgba(255,250,220,0)');
    ctx.fillStyle = mg; ctx.fillRect(mx - 160, my - 160, 320, 320);
    ctx.fillStyle = '#fff6d8'; ctx.beginPath(); ctx.arc(mx, my, 48, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = 'rgba(200,190,160,.5)'; ctx.beginPath(); ctx.arc(mx - 14, my - 8, 9, 0, Math.PI * 2); ctx.arc(mx + 12, my + 14, 6, 0, Math.PI * 2); ctx.fill();
    const base = H / 2 + (GROUND - cam.y) * cam.z * 0.35 + 60;
    skyline(0.12, base - 40, '#1a1838', 90, 320, 1, 'rgba(255,220,140,.35)');
    skyline(0.3, base, '#242046', 120, 260, 2, 'rgba(255,210,120,.5)');
  }
  function skyline(f, base, col, wmin, hmax, sd, win) {
    const off = cam.x * f;
    const bw = wmin + 40;
    const i0 = Math.floor(off / bw) - 1;
    for (let i = i0; i < i0 + W / bw + 3; i++) {
      const r = Math.abs(Math.sin(i * 12.9898 + sd * 78.233)) ;
      const h = 80 + r * hmax, x = i * bw - off, w = bw - 6;
      ctx.fillStyle = col; ctx.fillRect(x, base - h, w, h + 400);
      if (r > 0.7) ctx.fillRect(x + w / 2 - 2, base - h - 30, 4, 30);
      ctx.fillStyle = win;
      for (let yy = base - h + 12; yy < base; yy += 22) for (let xx = x + 8; xx < x + w - 8; xx += 16) {
        if (Math.sin(xx * 3.1 + yy * 7.7 + i) > 0.55) ctx.fillRect(xx, yy, 6, 9);
      }
    }
  }
  function drawCity() {
    const vx0 = cam.x - W / 2 / cam.z - 100, vx1 = cam.x + W / 2 / cam.z + 100;
    // 道路
    ctx.fillStyle = '#2a2a30'; ctx.fillRect(vx0, GROUND, vx1 - vx0, 300);
    ctx.fillStyle = '#4a4a52'; ctx.fillRect(vx0, GROUND, vx1 - vx0, 14);
    ctx.fillStyle = '#e8d060';
    for (let x = Math.floor(vx0 / 120) * 120; x < vx1; x += 120) ctx.fillRect(x, GROUND + 60, 60, 6);
    // がいとう
    for (let x = Math.floor(vx0 / 700) * 700 + 350; x < vx1; x += 700) {
      if (insideBuilding(x, GROUND - 10)) continue;
      ctx.fillStyle = '#555'; ctx.fillRect(x - 3, GROUND - 200, 6, 200); ctx.fillRect(x - 3, GROUND - 200, 40, 5);
      const lg = ctx.createRadialGradient(x + 36, GROUND - 190, 2, x + 36, GROUND - 190, 120);
      lg.addColorStop(0, 'rgba(255,230,160,.5)'); lg.addColorStop(1, 'rgba(255,230,160,0)');
      ctx.fillStyle = lg; ctx.fillRect(x - 84, GROUND - 310, 240, 320);
      ctx.fillStyle = '#ffe8a0'; ctx.fillRect(x + 28, GROUND - 196, 16, 6);
    }
    for (const b of buildings) {
      if (b.x > vx1 || b.x + b.w < vx0) continue;
      ctx.fillStyle = b.col; ctx.fillRect(b.x, b.top, b.w, GROUND - b.top);
      ctx.fillStyle = 'rgba(255,255,255,.08)'; ctx.fillRect(b.x, b.top, 6, GROUND - b.top);
      ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.fillRect(b.x + b.w - 8, b.top, 8, GROUND - b.top);
      // まど
      let n = 0;
      for (let y = b.top + 30; y < GROUND - 60; y += 54) {
        for (let x = b.x + 24; x < b.x + b.w - 40; x += 48) {
          n++;
          const lit = Math.sin(b.s * 13.1 + n * 7.3) > 0.1;
          ctx.fillStyle = lit ? '#ffd88a' : '#1e2034';
          ctx.fillRect(x, y, 26, 32);
          if (lit) { ctx.fillStyle = 'rgba(255,200,120,.25)'; ctx.fillRect(x - 3, y - 3, 32, 38); }
        }
      }
      // ドア
      ctx.fillStyle = '#1a1420'; ctx.fillRect(b.x + b.w / 2 - 20, GROUND - 56, 40, 56);
      // やね
      ctx.fillStyle = '#6a6478'; ctx.fillRect(b.x - 6, b.top - 8, b.w + 12, 10);
      if (b.tank) {
        const tx = b.x + b.w * 0.7;
        ctx.fillStyle = '#5a4030'; ctx.fillRect(tx - 4, b.top - 50, 4, 42); ctx.fillRect(tx + 36, b.top - 50, 4, 42);
        ctx.fillStyle = '#7a5a40'; ctx.fillRect(tx - 6, b.top - 100, 48, 54);
        ctx.beginPath(); ctx.moveTo(tx - 8, b.top - 100); ctx.lineTo(tx + 18, b.top - 124); ctx.lineTo(tx + 44, b.top - 100); ctx.fill();
      }
      if (b.ant) {
        const ax = b.x + 40;
        ctx.strokeStyle = '#888'; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.moveTo(ax, b.top - 8); ctx.lineTo(ax, b.top - 90); ctx.stroke();
        ctx.fillStyle = Math.floor(simT / 30) % 2 ? '#ff3030' : '#601010'; ctx.beginPath(); ctx.arc(ax, b.top - 92, 4, 0, Math.PI * 2); ctx.fill();
      }

    // チェックポイントの はた
    ctx.fillStyle = '#888'; ctx.fillRect(CHECK_X - 3, GROUND - 160, 6, 160);
    ctx.fillStyle = checkReached ? RED : '#556';
    ctx.beginPath(); ctx.moveTo(CHECK_X + 3, GROUND - 160); ctx.lineTo(CHECK_X + 70, GROUND - 140); ctx.lineTo(CHECK_X + 3, GROUND - 118); ctx.fill();

    // パトカーの バリケード

  function drawPolice(x, y, flip) {

  function heartPath(x, y, s) {
    ctx.beginPath();
    ctx.moveTo(x, y + s * 0.3);
    ctx.bezierCurveTo(x, y, x - s * 0.5, y, x - s * 0.5, y + s * 0.3);
    ctx.bezierCurveTo(x - s * 0.5, y + s * 0.6, x, y + s * 0.8, x, y + s);
    ctx.bezierCurveTo(x, y + s * 0.8, x + s * 0.5, y + s * 0.6, x + s * 0.5, y + s * 0.3);
    ctx.bezierCurveTo(x + s * 0.5, y, x, y, x, y + s * 0.3);
    ctx.fill();
  }

  function drawParts() {
    for (const q of parts) {
      const a = q.life / q.max;
      if (q.type === 'spark') { ctx.fillStyle = q.col; ctx.globalAlpha = a; ctx.fillRect(q.x - q.size / 2, q.y - q.size / 2, q.size, q.size); }
      else if (q.type === 'dust') { ctx.fillStyle = 'rgba(160,150,170,' + a * 0.6 + ')'; ctx.beginPath(); ctx.arc(q.x, q.y, q.size * (1.5 - a * 0.5), 0, Math.PI * 2); ctx.fill(); }
      else if (q.type === 'text') {
        ctx.globalAlpha = Math.min(1, a * 2); ctx.font = 'bold 30px sans-serif'; ctx.textAlign = 'center';
        ctx.strokeStyle = '#000'; ctx.lineWidth = 5; ctx.strokeText(q.txt, q.x, q.y); ctx.fillStyle = q.col; ctx.fillText(q.txt, q.x, q.y);
      } else if (q.type === 'comic') {
        // まんがの こうかおん
        ctx.save(); ctx.globalAlpha = Math.min(1, a * 3); ctx.translate(q.x, q.y); ctx.rotate(q.rot);
        const s = 1 + (1 - a) * 0.3; ctx.scale(s, s);
        ctx.font = '900 34px "Arial Black", sans-serif'; ctx.textAlign = 'center';
        ctx.lineWidth = 7; ctx.strokeStyle = '#111'; ctx.strokeText(q.txt, 0, 0);
        ctx.fillStyle = '#ffe23f'; ctx.fillText(q.txt, 0, 0);
        ctx.restore();

          ctx.lineTo(q.x + Math.cos(an) * rr, q.y + Math.sin(an) * rr);
        }
        ctx.closePath(); ctx.fill();
      } else if (q.type === 'streak') {
        ctx.globalAlpha = a * 0.5; ctx.fillStyle = '#ff6a6a';
        ctx.beginPath(); ctx.ellipse(q.x, q.y, 14, 30, 0, 0, Math.PI * 2); ctx.fill();

  function drawWebsAndHazards() {
    for (const w of webs) {
      ctx.strokeStyle = 'rgba(255,255,255,.75)'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(w.x - w.vx * 3, w.y - w.vy * 3); ctx.lineTo(w.x, w.y); ctx.stroke();
      ctx.save(); ctx.translate(w.x, w.y); ctx.rotate(simT * 0.3);
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 2;
      ctx.beginPath();
      for (let i = 0; i < 6; i++) { const an = i * Math.PI / 3; ctx.moveTo(0, 0); ctx.lineTo(Math.cos(an) * 11, Math.sin(an) * 11); }

    for (const s of splats) {

      for (let i = 0; i < 8; i++) { const an = i * Math.PI / 4; ctx.moveTo(s.x, s.y); ctx.lineTo(s.x + Math.cos(an) * 16, s.y + Math.sin(an) * 16); }

        ctx.fillStyle = Math.floor(simT / 4) % 2 ? '#fff' : '#ff3030';
        ctx.beginPath(); ctx.arc(h.x, h.y - 16, 3, 0, Math.PI * 2); ctx.fill();
      }
    }
  }

  function drawWorld() {
    ctx.save();
    const sx = shake ? rand(-shake, shake) : 0, sy = shake ? rand(-shake, shake) : 0;
    ctx.setTransform(cam.z, 0, 0, cam.z, W / 2 - cam.x * cam.z + sx, H / 2 - cam.y * cam.z + sy);

    ctx.fillText('X ウェブ　空中で ↑ 長押し スイング　かべに むかって → のぼる　C ふりむく　V スパイディアイ', 24, by);
    ctx.textAlign = 'right'; ctx.fillStyle = '#fff'; ctx.font = 'bold 18px sans-serif';
    ctx.fillText('スコア ' + score, W - 24, by);
  }
  function drawBanner() {
    if (!banner) return;
    const t = banner.t, a = Math.min(1, t / 8, (banner.max - t) / 12);
    const s = 1 + Math.max(0, 1 - t / 10) * 1.5;
    ctx.save();
    ctx.globalAlpha = clamp(a, 0, 1);
    ctx.translate(W / 2, H / 2 - 20); ctx.scale(s, s);
    ctx.font = 'italic 900 80px "Arial Black", sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.lineWidth = 12; ctx.strokeStyle = '#000'; ctx.strokeText(banner.text, 0, 0);
    ctx.fillStyle = banner.col; ctx.fillText(banner.text, 0, 0);
    ctx.restore();
  }
  function drawSub() {
    if (!sub) return;
    if (cutF > sub.until) { sub = null; return; }
    const y = H - lb / 2;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = 'bold 28px sans-serif';
    const txt = sub.name ? sub.name + '「' + sub.text + '」' : sub.text;
    ctx.lineWidth = 6; ctx.strokeStyle = '#000'; ctx.strokeText(txt, W / 2, y);
    ctx.fillStyle = sub.col; ctx.fillText(txt, W / 2, y);
    ctx.textBaseline = 'alphabetic';
  }

  // ---------- フィルム効果 ----------
  function filmFX(intensity = 1) {
    const v = ctx.createRadialGradient(W / 2, H / 2, H * 0.35, W / 2, H / 2, H * 0.95);
    v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,' + 0.5 * intensity + ')');
    ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = 'rgba(255,170,90,' + 0.04 * intensity + ')'; ctx.fillRect(0, 0, W, H);
    ctx.save();
    ctx.globalAlpha = 0.07 * intensity;
    ctx.globalCompositeOperation = 'overlay';
    ctx.drawImage(grains[Math.floor(performance.now() / 50) % 4], rand(-20, 0), rand(-20, 0), W + 20, H + 20);
    ctx.restore();
    if (Math.random() < 0.12 * intensity) {
      ctx.strokeStyle = 'rgba(255,255,255,' + rand(0.08, 0.25) + ')'; ctx.lineWidth = rand(1, 2);
      const x = rand(0, W); ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x + rand(-10, 10), H); ctx.stroke();
    }
    if (Math.random() < 0.05 * intensity) {
      ctx.fillStyle = 'rgba(0,0,0,.4)'; ctx.beginPath(); ctx.arc(rand(0, W), rand(0, H), rand(1, 4), 0, Math.PI * 2); ctx.fill();
    }
    ctx.fillStyle = 'rgba(0,0,0,' + rand(0, 0.035) * intensity + ')'; ctx.fillRect(0, 0, W, H);
  }
  function letterbox() {
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, W, lb); ctx.fillRect(0, H - lb, W, lb);
  }

  // ---------- 画面ごと ----------
  function drawTitle() {
    ctx.fillStyle = '#05060c'; ctx.fillRect(0, 0, W, H);
    const gr = ctx.createRadialGradient(W / 2, H / 2, 50, W / 2, H / 2, 600);
    gr.addColorStop(0, 'rgba(210,30,50,.35)'); gr.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = gr; ctx.fillRect(0, 0, W, H);
    // くもの す
    ctx.strokeStyle = 'rgba(255,255,255,.12)'; ctx.lineWidth = 1.5;
    for (let i = 0; i < 12; i++) { const an = i / 12 * Math.PI * 2; ctx.beginPath(); ctx.moveTo(W / 2, 260); ctx.lineTo(W / 2 + Math.cos(an) * 900, 260 + Math.sin(an) * 900); ctx.stroke(); }
    for (let r = 60; r < 800; r += 70) { ctx.beginPath(); ctx.arc(W / 2, 260, r, 0, Math.PI * 2); ctx.stroke(); }
    ctx.save(); ctx.translate(170, 580); ctx.scale(2.3, 2.3);
    drawSpidey({ x: 0, y: 0, face: 1, state: 'idle', anim: sceneT, inv: 0, shootT: 0 }, true);
    ctx.restore();
    // ぶらさがる スパイディ
    ctx.save(); ctx.strokeStyle = '#fff'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(1110, 0); ctx.lineTo(1110, 330); ctx.stroke();
    ctx.translate(1110, 330 + Math.sin(sceneT * 0.04) * 6); ctx.scale(2, -2);
    drawSpidey({ x: 0, y: 0, face: -1, state: 'jump', anim: sceneT, inv: 0, shootT: 0 }, true);
    ctx.restore();
    ctx.textAlign = 'center';
    ctx.font = '600 18px serif'; ctx.fillStyle = 'rgba(255,255,255,.7)';
    ctx.fillText('FAMILY FILM  PRESENTS', W / 2, 160);
    ctx.font = 'italic 900 104px "Arial Black", sans-serif';
    ctx.lineWidth = 10; ctx.strokeStyle = '#1a0a30'; ctx.strokeText('SPIDEY', W / 2, 262);
    const tg = ctx.createLinearGradient(0, 170, 0, 270); tg.addColorStop(0, '#ff6a6a'); tg.addColorStop(1, '#b0101c');
    ctx.fillStyle = tg; ctx.fillText('SPIDEY', W / 2, 262);
    ctx.font = 'bold 44px serif'; ctx.fillStyle = '#fff'; ctx.fillText('ゴブリンから 町を まもれ！', W / 2, 324);
    ctx.font = 'bold 16px sans-serif'; ctx.fillStyle = 'rgba(255,255,255,.85)';
    ['← → はしる　↑ ジャンプ（空中で ↑ を長押し → ウェブスイング）　Z パンチ', 'X ウェブ　C ふりむく　V スパイディアイ（とおくまで 見える）　かべに むかって すすむと のぼれる',
      'ハートは そすう！　ルカ 11こ ／ ふつう 13こ（スパイディも ゴブリンも おなじ数）'].forEach((l, i) => ctx.fillText(l, W / 2, 368 + i * 25));
  }

  function drawLeader() {
    const t = sceneT;
    if (t < 180) {
      ctx.fillStyle = '#b9a47c'; ctx.fillRect(0, 0, W, H);
      const n = 3 - Math.floor(t / 60), frac = (t % 60) / 60;
      ctx.fillStyle = 'rgba(80,60,30,.45)';
      ctx.beginPath(); ctx.moveTo(W / 2, H / 2); ctx.arc(W / 2, H / 2, 600, -Math.PI / 2, -Math.PI / 2 + frac * Math.PI * 2); ctx.closePath(); ctx.fill();
      ctx.strokeStyle = '#2a2014'; ctx.lineWidth = 4;
      ctx.beginPath(); ctx.arc(W / 2, H / 2, 230, 0, Math.PI * 2); ctx.stroke();
      ctx.beginPath(); ctx.arc(W / 2, H / 2, 260, 0, Math.PI * 2); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, H / 2); ctx.lineTo(W, H / 2); ctx.moveTo(W / 2, 0); ctx.lineTo(W / 2, H); ctx.stroke();
      ctx.font = 'bold 300px serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillStyle = '#1a140c'; ctx.fillText(n, W / 2, H / 2 + 10);
      ctx.textBaseline = 'alphabetic';
      filmFX(2.2);
    } else if (t < 310) {
      ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
      ctx.globalAlpha = clamp(Math.min((t - 180) / 30, (310 - t) / 30), 0, 1);
      ctx.textAlign = 'center'; ctx.fillStyle = '#fff';
      ctx.font = '600 26px serif'; ctx.fillText('ファミリー・フィルム　提供', W / 2, H / 2);
      ctx.globalAlpha = 1;
      filmFX(1.5);
    } else {
      ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
      const a = Math.min(1, (t - 310) / 30, (470 - t) / 25);
      const s = 1 + (t - 310) / 1200;
      ctx.save(); ctx.globalAlpha = clamp(a, 0, 1); ctx.translate(W / 2, H / 2); ctx.scale(s, s);
      ctx.textAlign = 'center';
      ctx.font = 'italic 900 120px "Arial Black", sans-serif';
      const tg = ctx.createLinearGradient(0, -100, 0, 0); tg.addColorStop(0, '#ff7a7a'); tg.addColorStop(1, '#c0101c');
      ctx.fillStyle = tg; ctx.fillText('SPIDEY', 0, -10);
      ctx.font = 'bold 48px serif'; ctx.fillStyle = '#fff'; ctx.fillText('ゴブリンから 町を まもれ！', 0, 62);
      ctx.restore();
      filmFX(1.5);
      letterbox();
    }
  }

  function drawCredits() {
    ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
    const credits = [
      ['h', 'スパイディ　ゴブリンから 町を まもれ！'], ['', ''], ['s', '出演'], ['', 'スパイディ ………… スパイディ'],
      ['', 'グリーンゴブリン ………… グリーンゴブリン'], ['', 'ゴブリンボット ………… たくさん（よわい）'], ['', 'パトカー ………… 2だい'], ['', ''],
      ['s', 'あそんだ モード'], ['', D.name], ['s', 'スコア'], ['', String(score)], ['', ''],
      ['s', '主演プレイヤー'], ['h', 'きみ！'], ['', ''], ['s', '制作'], ['', 'ファミリー・フィルム'], ['', ''], ['', ''], ['h', 'THE END'],
    ];
    const scroll = Math.min(160 + sceneT * 1.1, 560 + credits.length * 46 - H / 2 - 40);
    ctx.textAlign = 'center';
    credits.forEach((c, i) => {
      const y = H + 40 + i * 46 - scroll;
      if (y < -40 || y > H + 60) return;
      ctx.font = c[0] === 'h' ? 'bold 44px serif' : c[0] === 's' ? '600 20px serif' : '26px serif';
      ctx.fillStyle = c[0] === 's' ? '#ff6a6a' : '#fff';
      ctx.fillText(c[1], W / 2, y);
    });
    // スイングする スパイディ
    const t = (sceneT % 200) / 200;
    const ax = t * (W + 400) - 200;
    ctx.save();
    ctx.strokeStyle = 'rgba(255,255,255,.8)'; ctx.lineWidth = 2;
    const sx = ax + 100, sy = H - lb - 60 - Math.sin(t * Math.PI * 4) * 30;
    ctx.beginPath(); ctx.moveTo(ax + 160, lb); ctx.lineTo(sx, sy - 70); ctx.stroke();
    ctx.translate(sx, sy); ctx.scale(0.8, 0.8);
    drawSpidey({ x: 0, y: 0, face: 1, state: 'swing', anim: sceneT, inv: 0, shootT: 0, swing: null }, true);
    ctx.restore();
    filmFX(1.3);
    letterbox();
    if (sceneT > 120) {
      ctx.font = 'bold 22px sans-serif'; ctx.fillStyle = 'rgba(255,255,255,' + (0.5 + Math.sin(sceneT * 0.08) * 0.4) + ')';
      ctx.fillText('タップ ／ Enter で タイトルへ', W / 2, H - lb / 2 + 8);
    }
  }

  function drawLose() {
    drawBackground(); drawWorld();
    ctx.save(); ctx.globalCompositeOperation = 'color';
    ctx.fillStyle = 'rgba(160,120,60,1)'; ctx.fillRect(0, 0, W, H);
    ctx.restore();
    ctx.fillStyle = 'rgba(60,40,10,.25)'; ctx.fillRect(0, 0, W, H);
    filmFX(1.6);
    letterbox();
    const s = Math.min(1, sceneT / 25);
    ctx.save(); ctx.translate(W - 60 - 420 * s, H - lb - 70);
    ctx.fillStyle = '#e8d8a8'; ctx.strokeStyle = '#3a2a10'; ctx.lineWidth = 5;
    ctx.beginPath(); ctx.moveTo(0, -36); ctx.lineTo(330, -36); ctx.lineTo(330, -56); ctx.lineTo(400, 0); ctx.lineTo(330, 56); ctx.lineTo(330, 36); ctx.lineTo(0, 36); ctx.closePath();
    ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#3a2a10'; ctx.font = 'italic bold 30px serif'; ctx.textAlign = 'left';
    ctx.fillText('To Be Continued', 22, 10);
    ctx.restore();
    if (sceneT > 60) {
      ctx.textAlign = 'center'; ctx.font = 'bold 22px sans-serif'; ctx.fillStyle = '#fff';
      ctx.fillText('タップ ／ Enter で もう一回！' + (bossReached ? '（ボスから）' : ''), W / 2, H - lb / 2 + 8);
    }
  }

  function render() {
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
    if (scene === 'title') { drawTitle(); filmFX(1.4); letterbox(); return; }
    if (scene === 'leader') { drawLeader(); return; }
    if (scene === 'credits') { drawCredits(); return; }
    if (scene === 'lose') { drawLose(); return; }
    drawBackground();
    drawWorld();
    drawEyeOverlay();
    if (scene === 'ko' && sceneT < 100) { ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.fillRect(0, 0, W, H); }
    if (scene === 'win' || (scene === 'ko' && loser === 'g')) {
      // パトカーの ライト
      ctx.fillStyle = Math.floor(simT / 12) % 2 ? 'rgba(255,40,40,.12)' : 'rgba(40,80,255,.12)'; ctx.fillRect(0, 0, W, H);
    }
    if (flash > 0) { ctx.fillStyle = 'rgba(255,255,255,' + flash + ')'; ctx.fillRect(0, 0, W, H); }
    drawBanner();
    filmFX(1);
    letterbox();
    drawHUD();
    drawSub();
    if ((scene === 'cut' || scene === 'bossCut') && cutF > 30) {
      ctx.font = '14px sans-serif'; ctx.textAlign = 'right'; ctx.fillStyle = 'rgba(255,255,255,.5)';
      ctx.fillText('タップ / Enter でスキップ ▶▶', W - 20, H - 16);
    }
  }

  // ---------- ループ ----------
  newGame();
  setScene('title');
  let last = performance.now(), acc = 0;
  function frame(now) {
    const dt = Math.min(3, (now - last) / 16.667);
    last = now;
    sceneTick(dt);
    acc += dt * timeScale;
    let n = 0;
    while (acc >= 1 && n < 5) { acc -= 1; step(); n++; }
    if (n >= 5) acc = 0;
    render();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
