<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ゲーム選択</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: white;
        }

        .container {
            text-align: center;
            max-width: 800px;
            width: 100%;
        }

        h1 {
            font-size: 3em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .subtitle {
            font-size: 1.2em;
            margin-bottom: 40px;
            opacity: 0.9;
        }

        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }

        .game-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 30px;
            transition: transform 0.3s, box-shadow 0.3s;
            cursor: pointer;
            border: 2px solid rgba(255, 255, 255, 0.2);
            text-decoration: none;
            display: block;
            color: inherit;
        }

        .game-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            background: rgba(255, 255, 255, 0.15);
        }

        .game-card h2 {
            font-size: 1.8em;
            margin-bottom: 15px;
            color: #fff;
        }

        .game-card p {
            font-size: 1em;
            opacity: 0.9;
            line-height: 1.6;
        }

        .game-icon {
            font-size: 3em;
            margin-bottom: 15px;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 2em;
            }
            
            .games-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎮 ゲーム選択</h1>
        <p class="subtitle">遊びたいゲームを選んでください</p>
        
        <div class="games-grid">
            <a href="spaceship.html" target="_blank" class="game-card">
                <div class="game-icon">🚀</div>
                <h2>スペースインベーダー</h2>
                <p>宇宙人の侵略から地球を守れ！<br>全ての敵を倒して高得点を目指そう！</p>
            </a>

            <a href="paddle.html" target="_blank" class="game-card">
                <div class="game-icon">🎯</div>
                <h2>ブロック崩し</h2>
                <p>ボールをパドルで跳ね返して<br>全てのブロックを壊そう！</p>
            </a>

            <a href="paddle2.html" target="_blank" class="game-card">
                <div class="game-icon">⚡</div>
                <h2>ブロック崩し 2</h2>
                <p>シンプルなブロック崩しゲーム<br>高得点を目指そう！</p>
            </a>

            <a href="tetris.html" target="_blank" class="game-card">
                <div class="game-icon">🧩</div>
                <h2>テトリス</h2>
                <p>落ちてくるブロックを組み合わせて<br>ラインを消そう！</p>
            </a>

            <a href="eigo_monogatari.html" target="_blank" class="game-card">
                <div class="game-icon">📚</div>
                <h2>えいごものがたり</h2>
                <p>神経衰弱ゲームで<br>英語を楽しく学ぼう！</p>
            </a>
        </div>
    </div>
</body>
</html>
