<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
<title>ルカ＆フレンズ けいむしょの ママを たすけだせ！</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    width: 100%; height: 100%;
    background: #000; color: #fff;
    font-family: "Hiragino Maru Gothic ProN", "Yu Gothic", "Meiryo", system-ui, sans-serif;
    user-select: none; -webkit-user-select: none;
    overflow: hidden; touch-action: none;
  }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #000; }
  #stage { position: relative; width: min(100vw, 100vh * 16 / 9); height: min(100vh, 100vw * 9 / 16); }
  canvas { display: block; width: 100%; height: 100%; }
  #mute {
    position: absolute; top: 4px; left: 50%; transform: translateX(-50%); z-index: 7;
    background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.3);
    color: #fff; border-radius: 8px; font-size: 14px; padding: 2px 8px; cursor: pointer;
  }
  #modes {
    position: absolute; left: 0; right: 0; bottom: 18%; z-index: 6;
    display: flex; justify-content: center; gap: 4%;
  }
  #modes button {
    width: 30%; padding: 1.4% 0; border-radius: 16px; cursor: pointer;
    font-family: inherit; font-weight: 800; font-size: min(3.2vw, 5.6vh); color: #fff;
    border: 3px solid rgba(255,255,255,.8); box-shadow: 0 6px 0 rgba(0,0,0,.4);
  }
  #modes button small { display: block; font-size: 55%; font-weight: 600; opacity: .9; margin-top: 2px; }
  #modes .ruka { background: linear-gradient(#ff9ad5, #e0569e); }
  #modes .normal { background: linear-gradient(#5aa0ff, #1f5fe0); }
  #modes button.sel, #select button.sel { outline: 4px solid #ffd23f; outline-offset: 3px; }
  #select {
    position: absolute; right: 3%; top: 13%; width: 57%; z-index: 6;
    display: none; flex-direction: column; gap: 1.6%;
  }
  #cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px 1.2vw; }
  #select button {
    font-family: inherit; color: #fff; cursor: pointer; border-radius: 14px;
    border: 3px solid rgba(255,255,255,.7); box-shadow: 0 5px 0 rgba(0,0,0,.4);
  }
  .card { text-align: left; padding: 6px 10px; font-weight: 800; font-size: min(2.2vw, 3.9vh); }
  .card small { display: block; font-size: 56%; font-weight: 600; margin-top: 2px; line-height: 1.25; }
  .card.sel { transform: scale(1.04); }
  #folrow { display: flex; align-items: center; gap: 8px; }
  #folrow span { font-weight: 800; font-size: min(1.5vw, 2.6vh); white-space: nowrap; color: #ffd23f; }
  #fols { display: flex; flex-wrap: wrap; gap: 5px; }
  #fols button { padding: 3px 9px; font-weight: 800; font-size: min(1.5vw, 2.6vh); border-width: 2px; box-shadow: 0 3px 0 rgba(0,0,0,.4); }
  #route { display: flex; gap: 1.2vw; margin-top: 4px; }
  #route button { flex: 1; padding: 6px 0; font-weight: 800; font-size: min(1.7vw, 3vh); background: #3a3a5a; }
  #route button small { display: block; font-size: 75%; font-weight: 600; opacity: .9; }
  #route button.sel { background: linear-gradient(#ffb84a, #e07a1a); }
  #go { padding: 8px 0; font-weight: 900; font-size: min(3vw, 5.2vh); background: linear-gradient(#5ee07a, #1f9a3a); margin-top: 4px; }
  #touch {
    position: fixed; left: 0; right: 0; bottom: 0;
    display: none; justify-content: space-between; align-items: flex-end;
    padding: 0 14px 14px; pointer-events: none; z-index: 4;
  }
  #touch .pad, #touch .actions { display: flex; gap: 12px; pointer-events: auto; }
  #touch .actions { align-items: flex-end; }
  #touch button {
    width: 76px; height: 76px; border-radius: 50%;
    background: rgba(255,255,255,.14); border: 2px solid rgba(255,255,255,.45);
    color: #fff; font-size: 15px; font-weight: 700; font-family: inherit; touch-action: none;
  }
  #touch button.on { background: rgba(255,255,255,.35); }
  #touch button[data-k="jump"] { background: rgba(40,110,255,.35); }
  #touch button[data-k="atk"] { background: rgba(255,70,70,.35); }
  #touch button[data-k="sp"] { background: rgba(255,200,0,.35); width: 64px; height: 64px; font-size: 13px; }
  @media (pointer: coarse) { #touch { display: flex; } }
</style>
</head>
<body>
<div id="wrap">
  <div id="stage">
    <canvas id="c"></canvas>
    <button id="mute">🔊</button>
    <div id="modes">
      <button class="ruka sel" data-mode="ruka">ルカ モード<small>かんたん</small></button>
      <button class="normal" data-mode="normal">ふつう モード<small>ちょっとむずかしい</small></button>
    </div>
    <div id="select">
      <div id="cards"></div>
      <div id="folrow"><span>うしろから ついてくる人：</span><div id="fols"></div></div>
      <div id="route">
        <button data-long="1" class="sel">ながい コース<small>へや 4つ → さいごの ろうや</small></button>
        <button data-long="0">みじかい コース<small>すぐ さいごの ろうや へ</small></button>
      </div>
      <button id="go">スタート！</button>
    </div>
  </div>
</div>
<div id="touch">
  <div class="pad">
    <button data-k="left">◀</button>
    <button data-k="right">▶</button>
  </div>
  <div class="actions">
    <button data-k="sp">ブースト</button>
    <button data-k="atk">アタック</button>
    <button data-k="jump">ジャンプ</button>
  </div>
</div>

<script>
(() => {
  const cv = document.getElementById('c');
  const ctx = cv.getContext('2d');
  const W = 1280, H = 720;
  cv.width = W; cv.height = H;
  const GROUND = 560;
  const rand = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const sign = v => (v < 0 ? -1 : 1);

  // ---------- なかま（えらべる キャラ） ----------
  const HEROES = {
    ruka:  { name: 'ルカ',   animal: 'cheetah', body: '#f2b632', dark: '#b8771a', light: '#ffd970', belly: '#fff1cc', shoe: '#e83a2a', iris: '#2a8a3a', acc: 'scarf',   accCol: '#e8302a', ui: '#ffcf40',
             spd: 24, jump: -21, maxJ: 2, desc: 'いちばん はやい！' },
    sora:  { name: 'ソラ',   animal: 'bird',    body: '#4fb8e8', dark: '#2a7fb0', light: '#9fe0ff', belly: '#eaf8ff', shoe: '#ffb020', iris: '#1a2a4a', acc: 'goggles', accCol: '#ff8a20', ui: '#6fd0ff',
             spd: 20, jump: -20, maxJ: 3, glide: true, desc: '3かい ジャンプ＆ふわふわ' },
    ganta: { name: 'ガンタ', animal: 'bear',    body: '#9a6034', dark: '#6a3c1a', light: '#c88a58', belly: '#f0d0a8', shoe: '#3a7a3a', iris: '#2a1a10', acc: 'band',    accCol: '#2aa050', ui: '#d0a070',
             spd: 18, jump: -19, maxJ: 2, power: true, tough: true, desc: 'ちからもち！ ハート おおい' },
    mimi:  { name: 'ミミ',   animal: 'rabbit',  body: '#f4a6c8', dark: '#d0709c', light: '#ffd0e4', belly: '#ffffff', shoe: '#8a4ad0', iris: '#a02060', acc: 'ribbon',  accCol: '#ff4f9a', ui: '#ff9ad5',
             spd: 21, jump: -25, maxJ: 2, stomp: true, desc: 'たかく とぶ！ ドスンで たおす' },
    jin:   { name: 'ジン',   animal: 'cat',     body: '#5a4a8a', dark: '#33285a', light: '#8a7ac0', belly: '#d8d0f0', shoe: '#222222', iris: '#ffd23f', acc: 'ninja',   accCol: '#e83030', ui: '#b0a0ff',
             spd: 22, jump: -21, maxJ: 2, shot: 'shuriken', desc: 'しゅりけんを なげる にんじゃ' },
    piko:  { name: 'ピコ',   animal: 'robot',   body: '#a8b4c8', dark: '#6a7488', light: '#e0e8f4', belly: '#ffb040', shoe: '#3a64d0', iris: '#40e0ff', acc: 'antenna', accCol: '#ff4040', ui: '#c0d0e8',
             spd: 20, jump: -20, maxJ: 2, shot: 'beam', boostCost: 10, desc: 'ビーム！ ブーストが すぐ たまる' },
  };
  const HERO_KEYS = Object.keys(HEROES);
  const CH = {
    ...HEROES,
    mama: { name: 'ママ', animal: 'cheetah', body: '#f0bc54', dark: '#b8771a', light: '#ffe08a', belly: '#fff4d8', shoe: '#c04aa8', iris: '#3a8adf', acc: 'bow', accCol: '#ff5fa8', ui: '#ff9ad5' },
    papa: { name: 'パパ', animal: 'cheetah', body: '#d9a040', dark: '#a06a18', light: '#f0c870', belly: '#fff0cc', shoe: '#3a3a3a', iris: '#2a6a3a', acc: 'tie', accCol: '#2a5ac8', ui: '#7fb8ff', scale: 1.22 },
  };

  // ---------- むずかしさ ----------
  // counts = [ころころロボ, ドローン, かんしゅロボ]
  const MODES = {
    ruka:   { name: 'ルカ モード', touchWin: true, roomMinions: 10, hearts: 7, guardAfter: 4, guardT: 60, bossLvl: 0.6, droneShoot: false, minionSpd: 0.55, gameOver: false, homing: 720, spill: 3,
              guardHp: 2, allyCD: 480, allyN: 2, allyHeal: 4, allyBossHits: 2,
              counts: { gate: [5, 0, 0], hall: [3, 3, 0], factory: [4, 2, 1], guard: [3, 2, 2] } },
    normal: { name: 'ふつう モード', touchWin: false, roomMinions: 0, hearts: 13, guardAfter: 2, guardT: 150, bossLvl: 2, droneShoot: true, minionSpd: 1, gameOver: true, homing: 560, spill: 10,
              guardHp: 3, allyCD: 900, allyN: 1, allyHeal: 3, allyBossHits: 1,
              counts: { gate: [7, 0, 0], hall: [4, 5, 0], factory: [5, 3, 2], guard: [3, 3, 4] } },
  };
  let MODE = 'ruka', D = MODES.ruka, HERO = 'ruka', HC = HEROES.ruka, longRoute = true;
  // FOL = うしろから ついてくる人、CAP = つかまる人、STORY A = ママが つれていかれる / B = ママは だいじょうぶ → りょこう先で だれかが つかまる
  let FOL = 'papa', CAP = 'mama', STORY = 'A';
  const FOL_KEYS = ['papa', 'mama', ...Object.keys(HEROES)];
  const nm = k => CH[k].name;

  // ---------- へや ----------
  const ROOM_INFO = {
    home:    { name: 'けいむしょへ いそげ！', w: 2600, indoor: false },
    gate:    { name: 'へや1　けいむしょの もん', w: 1800, indoor: true, wall: '#4a4a5c', floor: ['#5a5a6a', '#4a4a58'] },
    hall:    { name: 'へや2　ながい ろうか', w: 1800, indoor: true, wall: '#3a3a52', floor: ['#4a4a62', '#3a3a50'] },
    factory: { name: 'へや3　ロボ こうじょう', w: 1800, indoor: true, wall: '#40362e', floor: ['#5a4a3a', '#4a3a2c'] },
    guard:   { name: 'へや4　かんしゅの へや', w: 1800, indoor: true, wall: '#2a3448', floor: ['#3a4660', '#2c3650'] },
    prison:  { name: 'ママの ろうや', w: 1280, indoor: true, wall: '#2a2236', floor: ['#4a4458', '#3a3448'] },
  };
  let rooms = [], cr = 0, roomCleared = true, fade = 0;
  const R = () => rooms[cr];
  const prisonRoom = () => rooms[rooms.length - 1];
  const cageX = () => { const P = prisonRoom(); return P.x0 + P.w - 150; };
  function buildRooms() {
    const types = longRoute ? ['home', 'gate', 'hall', 'factory', 'guard', 'prison'] : ['home', 'prison'];
    let x = 0;
    const B = STORY === 'B';
    const names = B ? { home: 'アジトへ いそげ！', gate: 'へや1　わるい子の アジト', guard: 'へや4　みはりの へや', prison: nm(CAP) + 'の ろうや' } : {};
    rooms = types.map((t, i) => { const r = { type: t, idx: i, x0: x, ...ROOM_INFO[t] }; if (names[t]) r.name = names[t]; x += r.w; return r; });
  }

  // ---------- 入力 ----------
  const keys = {}, press = {};
  const KEYMAP = {
    ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right',
    ArrowUp: 'jump', KeyW: 'jump', Space: 'jump', ArrowDown: 'down', KeyS: 'down',
    KeyZ: 'atk', KeyJ: 'atk', KeyX: 'sp', KeyK: 'sp', Enter: 'start'
  };
  addEventListener('keydown', e => {
    const k = KEYMAP[e.code]; if (!k) return;
    e.preventDefault();
    if (!keys[k]) press[k] = true;
    keys[k] = true;
    if (k !== 'left' && k !== 'right' && k !== 'down') press.start = true;
    initAudio();
  });
  addEventListener('keyup', e => { const k = KEYMAP[e.code]; if (k) keys[k] = false; });
  document.querySelectorAll('#touch button').forEach(b => {
    const k = b.dataset.k;
    const down = e => { e.preventDefault(); if (!keys[k]) press[k] = true; keys[k] = true; press.start = true; b.classList.add('on'); initAudio(); };
    const up = e => { e.preventDefault(); keys[k] = false; b.classList.remove('on'); };
    b.addEventListener('pointerdown', down);
    b.addEventListener('pointerup', up);
    b.addEventListener('pointerleave', up);
    b.addEventListener('pointercancel', up);
  });
  cv.addEventListener('pointerdown', () => { if (scene !== 'select') press.start = true; initAudio(); });
  const take = k => { if (press[k]) { press[k] = false; return true; } return false; };
  const clearPress = () => { for (const k in press) press[k] = false; };

  const modesEl = document.getElementById('modes');
  const modeBtns = [...modesEl.querySelectorAll('button')];
  let modeSel = 0;
  function showSel() { modeBtns.forEach((b, i) => b.classList.toggle('sel', i === modeSel)); }
  modeBtns.forEach((b, i) => b.addEventListener('pointerdown', e => {
    e.stopPropagation(); initAudio(); modeSel = i; showSel(); chooseMode(b.dataset.mode);
  }));

  // キャラえらび
  const selectEl = document.getElementById('select');
  const cardsEl = document.getElementById('cards');
  const touchEl = document.getElementById('touch');
  let heroSel = 0;
  HERO_KEYS.forEach((k, i) => {
    const h = HEROES[k];
    const b = document.createElement('button');
    b.className = 'card';
    b.style.background = `linear-gradient(${h.light}, ${h.dark})`;
    b.innerHTML = `${h.name}<small>${h.desc}</small>`;
    b.addEventListener('pointerdown', e => { e.stopPropagation(); initAudio(); heroSel = i; updateSelUI(); SFX.tick(); });
    cardsEl.appendChild(b);
  });
  const cardBtns = [...cardsEl.children];
  const routeBtns = [...document.querySelectorAll('#route button')];
  routeBtns.forEach(b => b.addEventListener('pointerdown', e => {
    e.stopPropagation(); initAudio(); longRoute = b.dataset.long === '1'; updateSelUI(); SFX.tick();
  }));
  document.getElementById('go').addEventListener('pointerdown', e => { e.stopPropagation(); initAudio(); startGame(); });
  const folsEl = document.getElementById('fols');
  const folBtns = FOL_KEYS.map(k => {
    const b = document.createElement('button');
    b.textContent = CH[k].name;
    b.style.background = `linear-gradient(${CH[k].light}, ${CH[k].dark})`;
    b.addEventListener('pointerdown', e => { e.stopPropagation(); initAudio(); FOL = k; updateSelUI(); SFX.tick(); });
    folsEl.appendChild(b);
    return b;
  });
  function updateSelUI() {
    cardBtns.forEach((b, i) => b.classList.toggle('sel', i === heroSel));
    routeBtns.forEach(b => b.classList.toggle('sel', (b.dataset.long === '1') === longRoute));
    HERO = HERO_KEYS[heroSel]; HC = HEROES[HERO];
    if (FOL === HERO) FOL = 'papa';
    folBtns.forEach((b, i) => { b.style.display = FOL_KEYS[i] === HERO ? 'none' : ''; b.classList.toggle('sel', FOL_KEYS[i] === FOL); });
  }

  // ---------- サウンド ----------
  let AC = null, master = null, noiseBuf = null, muted = false, bgm = null;
  function initAudio() {
    if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
    try {
      AC = new (window.AudioContext || window.webkitAudioContext)();
      master = AC.createGain(); master.gain.value = muted ? 0 : 0.5; master.connect(AC.destination);
      noiseBuf = AC.createBuffer(1, AC.sampleRate, AC.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    } catch (e) { AC = null; }
  }
  document.getElementById('mute').addEventListener('click', e => {
    e.stopPropagation();
    muted = !muted;
    e.target.textContent = muted ? '🔇' : '🔊';
    if (master) master.gain.value = muted ? 0 : 0.5;
  });
  function tone(f, dur, type = 'square', vol = 0.15, f2 = null, when = 0) {
    if (!AC) return;
    const t = AC.currentTime + when;
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t);
    if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.02);
  }
  function noise(dur, vol = 0.2, freq = 1200, when = 0) {
    if (!AC) return;
    const t = AC.currentTime + when;
    const s = AC.createBufferSource(); s.buffer = noiseBuf;
    const f = AC.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = freq;
    const g = AC.createGain();
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    s.connect(f); f.connect(g); g.connect(master); s.start(t); s.stop(t + dur + 0.02);
  }
  const SFX = {
    jump: () => tone(300, 0.18, 'square', 0.08, 900),
    star: () => { tone(1318, 0.08, 'triangle', 0.12); tone(1760, 0.25, 'triangle', 0.12, null, 0.06); },
    spill: () => { for (let i = 0; i < 5; i++) tone(1500 - i * 120, 0.1, 'triangle', 0.08, null, i * 0.04); },
    spin: () => { tone(200, 0.3, 'sawtooth', 0.08, 1400); noise(0.25, 0.08, 3000); },
    homing: () => tone(600, 0.2, 'sawtooth', 0.08, 1800),
    hit: big => { noise(big ? 0.35 : 0.15, big ? 0.5 : 0.3, big ? 500 : 1500); tone(big ? 120 : 200, 0.2, 'square', 0.15, 50); },
    pop: () => { noise(0.25, 0.4, 900); tone(500, 0.2, 'square', 0.1, 1200); },
    hurt: () => { noise(0.3, 0.35, 700); tone(400, 0.35, 'sawtooth', 0.12, 80); },
    laser: () => tone(1800, 0.25, 'square', 0.06, 200),
    shot: () => { tone(900, 0.1, 'triangle', 0.08, 1600); noise(0.08, 0.06, 4000); },
    charge: () => tone(80, 0.5, 'sawtooth', 0.08, 400),
    land: () => { noise(0.5, 0.5, 200); tone(60, 0.5, 'sine', 0.3, 30); },
    boost: () => { tone(150, 0.9, 'sawtooth', 0.12, 2400); noise(0.9, 0.2, 2500); },
    ko: () => { noise(1.2, 0.6, 300); tone(200, 1.2, 'square', 0.15, 30); },
    tick: () => tone(1000, 0.05, 'square', 0.05),
    check: () => [784, 988, 1175].forEach((f, i) => tone(f, 0.15, 'triangle', 0.1, null, i * 0.08)),
    ally: () => [659, 784, 988, 1318].forEach((f, i) => tone(f, 0.16, 'square', 0.09, null, i * 0.07)),
    fight: () => { tone(523, 0.12, 'square', 0.12); tone(784, 0.4, 'square', 0.12, null, 0.12); },
    win: () => [523, 659, 784, 1046].forEach((f, i) => tone(f, 0.3, 'square', 0.1, null, i * 0.14)),
    scream: () => tone(900, 0.6, 'triangle', 0.08, 1400),
    door: () => { noise(0.8, 0.5, 150); tone(50, 0.8, 'sine', 0.3, 30); },
    open: () => { [392, 523, 659, 784].forEach((f, i) => tone(f, 0.14, 'triangle', 0.1, null, i * 0.06)); noise(0.4, 0.2, 300); },
  };
  const SONGS = {
    stage: { tempo: 160, bass: [48, 48, 55, 48, 53, 53, 55, 57, 48, 48, 55, 48, 52, 52, 55, 55], lead: [72, 0, 76, 79, 77, 0, 76, 74, 72, 0, 74, 76, 79, 0, 81, 0] },
    inside:{ tempo: 150, bass: [45, 45, 52, 45, 48, 48, 50, 52, 45, 45, 52, 45, 43, 43, 47, 50], lead: [69, 0, 72, 76, 74, 0, 72, 71, 69, 0, 71, 72, 76, 0, 77, 0] },
    boss:  { tempo: 176, bass: [45, 45, 57, 45, 48, 45, 52, 50, 45, 45, 57, 45, 43, 43, 55, 47], lead: [69, 0, 72, 74, 76, 0, 74, 72, 69, 0, 67, 69, 72, 0, 71, 0] },
    happy: { tempo: 120, bass: [48, 0, 55, 0, 53, 0, 55, 0, 48, 0, 55, 0, 50, 0, 55, 0], lead: [76, 79, 84, 79, 77, 81, 84, 81, 76, 79, 84, 88, 86, 83, 79, 0] },
  };
  let nextNote = 0, noteIdx = 0;
  const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
  setInterval(() => {
    if (!AC || !bgm) return;
    const S = SONGS[bgm];
    const st = 60 / S.tempo / 2;
    if (nextNote < AC.currentTime) nextNote = AC.currentTime + 0.05;
    while (nextNote < AC.currentTime + 0.12) {
      const w = nextNote - AC.currentTime, i = noteIdx % 16;
      if (S.bass[i]) tone(mtof(S.bass[i]), st * 0.9, 'triangle', 0.09, null, w);
      if (S.lead[i] && (bgm === 'happy' || (noteIdx >> 4) % 2 === 1)) tone(mtof(S.lead[i]), st * 0.8, 'square', 0.025, null, w);
      if (bgm !== 'happy') {
        noise(0.04, i % 2 ? 0.03 : 0.05, 8000, w);
        if (i % 4 === 0) tone(110, 0.12, 'sine', 0.18, 40, w);
        if (i % 8 === 4) noise(0.12, 0.08, 1800, w);

  function homingTarget() {
    let best = null, bd = D.homing;

  function updateP() {

  // ---------- なかまが たすけに くる ----------

    const names = [];

  function allyTarget(a) {
    let best = null, bd = 1e9;

  function updateAllies() {
    if (allyCD > 0) allyCD--;

      if (a.leaving) {

      a.ang += a.face * 0.5;
      a.state = !a.onG ? 'jump' : (Math.abs(a.vx) > 1 ? 'run' : 'idle');
      if (a.atk && !a.leaving) {
        const ab = box(a);

  // ---------- ザコ敵 ----------
  function updateMinions() {
    for (const m of minions) {
      if (!m.alive) continue;

      if (Math.abs(m.x - p.x) > 1500) continue;
      const inPrison = R().type === 'prison';
      if (m.type === 'guard' && Math.abs(p.x - m.x) < 520 && scene === 'play') {
        m.dir = sign(p.x - m.x);
        if (Math.abs(p.x - m.x) > 40) m.x += m.dir * 1.6 * D.minionSpd;
        m.x = clamp(m.x, m.home - 320, m.home + 320);
      } else {
        const sp = (m.type === 'drone' ? 1.4 : 1.8) * D.minionSpd;
        const range = inPrison ? 80 : 140;
        m.x += m.dir * sp;
        if (m.x < m.home - range) m.dir = 1;
        if (m.x > m.home + range) m.dir = -1;
      }
      if (m.type === 'drone') {
        m.y += Math.sin(m.anim * 0.06) * 0.6;
        if (D.droneShoot && scene === 'play' && Math.abs(m.x - p.x) < 450 && --m.cd <= 0) {
          m.cd = rand(130, 200);
          const dx = p.x - m.x, dy = (p.y - 40) - m.y, d = Math.hypot(dx, dy) || 1;
          lasers.push({ x: m.x, y: m.y + 18, vx: dx / d * 5, vy: dy / d * 5, owner: 'e', life: 160, kind: 'ball' });
          tone(900, 0.12, 'square', 0.04, 500);
        }
      }

  }
  function hurtMinion(m, dmg = 1) {
    m.hp -= dmg;
    if (m.hp <= 0) { killMinion(m); return true; }
    m.flash = 12; SFX.hit(false); hitstop = 2;
    sparks(m.x, m.y - 50, 10, '#fff6a0', 7);

  }
  function killMinion(m) {

    const cy = m.type === 'drone' ? m.y : m.y - (m.type === 'guard' ? 50 : 24);

    bolts(m.x, cy);

    score += pts; popText(m.x, cy - 40, '+' + pts, '#ffd23f');

  // ---------- ボス：ガッチャン大王 ----------
  function updateBoss() {
    if (!e.active) return;
    e.anim++;
    if (e.guardT > 0) e.guardT--;
    if (e.iframe > 0) e.iframe--;
    const lvl = D.bossLvl;
    const sp = 4 + lvl * 1.5;
    const dx = p.x - e.x;
    switch (e.state) {
      case 'ko':
        e.ang += 0.25; physics(e, 0.8);
        if (e.onG) { e.vx *= 0.9; e.ang *= 0.8; }
        return;
      case 'idle':
        e.face = sign(dx);
        if (Math.abs(dx) > 170) e.vx = lerp(e.vx, e.face * sp, 0.12); else e.vx *= 0.8;
        if (--e.cd <= 0 && p.state !== 'ko') chooseBoss(Math.abs(dx));
        break;
      case 'punchW':
        e.face = sign(dx); e.vx *= 0.8;
        if (--e.t <= 0) { e.state = 'punch'; e.t = 10; e.hitDone = false; e.vx = e.face * 9; tone(220, 0.1, 'square', 0.08); }
        break;
      case 'punch':
        e.vx *= 0.9;
        if (--e.t <= 0) { e.state = 'rec'; e.t = 22; }
        break;
      case 'laserW':
        e.face = sign(dx); e.vx *= 0.8;
        if (--e.t <= 0) {
          lasers.push({ x: e.x + e.face * 40, y: e.y - 70, vx: e.face * (9 + lvl * 1.5), vy: 0, owner: 'e', life: 200, kind: 'laser' });
          SFX.laser();
          if (--e.shots > 0) e.t = 24; else { e.state = 'rec'; e.t = 26; }
        }
        break;
      case 'dashW':
        e.face = sign(dx); e.vx *= 0.8;
        if (e.t % 6 === 0) sparks(e.x - e.face * 40, e.y - 30, 2, '#ffb040', 4);
        if (--e.t <= 0) { e.state = 'dash'; e.t = 38; e.vx = e.face * (12 + lvl * 2); e.hitDone = false; SFX.spin(); }
        break;
      case 'dash':
        if (simT % 2 === 0) parts.push({ type: 'spark', x: e.x - e.face * 40, y: e.y - 30 + rand(-6, 6), vx: -e.face * 4, vy: 0, life: 14, max: 14, col: '#ffa030', size: 6 });
        if (--e.t <= 0 || e.x <= bounds.min + 1 || e.x >= bounds.max - 1) { e.state = 'rec'; e.t = 30; }
        break;
      case 'rec':
        e.vx *= 0.85;
        if (--e.t <= 0) { e.state = 'idle'; e.cd = Math.max(20, 70 - lvl * 15 + rand(0, 35)); }
        break;
      case 'hurt':
        e.vx *= 0.9;
        if (--e.t <= 0) { e.state = 'idle'; e.cd = Math.min(e.cd, 30); }
        break;
    }
    physics(e);
    const fast = e.state === 'dash';
    if (fast) e.trail.push({ x: e.x, y: e.y, face: e.face, state: e.state, ang: e.ang, anim: e.anim });
    if (e.trail.length > (fast ? 5 : 0)) e.trail.shift();
  }
  function chooseBoss(adx) {
    const r = Math.random(), lvl = D.bossLvl;
    const shots = Math.max(1, Math.round(lvl));
    const dashW = Math.round(42 - lvl * 4);
    if (adx < 190) { e.state = 'punchW'; e.t = Math.round(30 - lvl * 3); }
    else if (adx > 420) {
      if (r < 0.5) { e.state = 'laserW'; e.t = 32; e.shots = shots; }
      else { e.state = 'dashW'; e.t = dashW; SFX.charge(); }
    } else {
      if (r < 0.4) { e.state = 'dashW'; e.t = dashW; SFX.charge(); }
      else if (r < 0.7) { e.cd = 12; }
      else { e.state = 'laserW'; e.t = 32; e.shots = 1; }
    }
  }

  // ---------- ダメージ ----------
  function hurtP(dmg, dir) {
    if (p.inv > 0 || p.state === 'boost' || p.state === 'superCharge' || p.state === 'ko' || !playing()) return;
    p.hp = Math.max(0, p.hp - 1);
    p.state = 'hurt'; p.t = 26; p.vx = dir * 11; p.vy = -9; p.onG = false; p.inv = 80;
    hitstop = 6; shake = 10; flash = 0.2;
    SFX.hurt();
    sparks(p.x, p.y - 50, 14, '#ff6060', 9);
    popText(p.x, p.y - 110, '-1 ♥', '#ff7070');
    papa.cheer = 25;
    const n = Math.min(p.stars, D.spill);
    if (n > 0) {
      p.stars -= n; SFX.spill();
      for (let i = 0; i < n; i++) {
        const a = -Math.PI / 2 + rand(-1.2, 1.2), v = rand(6, 12);
        stars.push({ x: p.x, y: p.y - 50, vx: Math.cos(a) * v, vy: Math.sin(a) * v, spill: true, life: 200 });
      }
    }
    if (p.hp <= 0) {
      if (D.gameOver) startKO('p');
      else {
        p.hp = p.maxHp; p.inv = 150;
        banner = { text: 'まだまだ！', t: 0, max: 80, col: '#ff9ad5' };
        SFX.check();
      }
    }
  }
  function hitE(dmg, kb, big = false, n = 1) {
    if (e.state === 'ko' || !e.active || e.iframe > 0) return;
    e.hp = Math.max(0, e.hp - n); e.iframe = 18;
    if (e.state !== 'dash') { e.state = 'hurt'; e.t = 12 + dmg; e.vx = kb; }
    hitstop = big ? 10 : 5; shake = big ? 14 : 7;
    SFX.hit(big);
    sparks(e.x, e.y - 75, big ? 22 : 12, '#fff6a0', big ? 13 : 9);
    parts.push({ type: 'impact', x: e.x, y: e.y - 75, life: 10, max: 10, size: big ? 95 : 60 });
    popText(e.x + rand(-20, 20), e.y - 175, '-' + n + ' ♥', big ? '#ffd23f' : '#fff');
    if (e.hp <= 0) startKO('e');
  }
  // ジャンプや とびどうぐ ばかりだと ガッチャン大王が ガードする
  function airHit() {
    if (e.guardT > 0) {
      SFX.laser(); sparks(e.x, e.y - 75, 14, '#7fe0ff', 8);
      popText(e.x, e.y - 190, 'ガード！', '#7fe0ff');
      p.state = 'jump'; p.vx = -p.face * 12; p.vy = -12; p.onG = false; p.jumps = HC.maxJ; newAttack(); p.hitId = p.atkId;
      e.face = sign(p.x - e.x); e.state = 'punchW'; e.t = 10;
      return false;
    }
    countAir();
    return true;
  }
  function countAir() {
    if (++e.air >= D.guardAfter) {
      e.air = 0; e.guardT = D.guardT;
      popText(e.x, e.y - 210, 'ガードモード！', '#7fe0ff');
    }
  }
  function groundHit() {
    e.air = 0;
    if (e.guardT > 0) { e.guardT = 0; popText(e.x, e.y - 210, 'ガードブレイク！', '#ffd23f'); sparks(e.x, e.y - 75, 20, '#7fe0ff', 12); }
  }

  function startKO(who) {
    loser = who;
    const o = who === 'p' ? p : e, other = who === 'p' ? e : p;
    o.state = 'ko'; o.vx = sign(o.x - other.x) * 14; o.vy = -18; o.onG = false; o.inv = 999;
    other.vx *= 0.3;
    hitstop = 14; shake = 24; flash = 1;
    SFX.ko(); bgm = null;
    sparks(o.x, o.y - 60, 40, '#ffffff', 16);
    setScene('ko');
  }

  function playerAttackBox() {
    if (isBall(p)) return box(p);
    if (p.state === 'kick' && p.t <= 12 && p.t >= 5) return { x: p.x + (p.face > 0 ? 10 : -85), y: p.y - 75, w: 75, h: 45 };
    return null;
  }

  function resolve() {
    const pb = box(p);
    const ab = playerAttackBox();
    for (const m of minions) {
      if (!m.alive) continue;
      const mb = mbox(m);
      if (ab && overlap(ab, mb)) {
        if (m.lastAtk === p.atkId) continue;
        m.lastAtk = p.atkId;
        hurtMinion(m, HC.power && p.state === 'kick' ? 2 : 1);
        if (p.state === 'jump' || p.state === 'homing') {
          p.state = 'jump'; p.vy = -13; p.vx *= 0.5; p.onG = false; p.jumps = 1; newAttack();
        }
      } else if (overlap(pb, mb) && D.touchWin) {
        if (m.touchCD <= 0) { m.touchCD = 30; hurtMinion(m); }
      } else if (overlap(pb, mb) && p.state !== 'boost') {
        hurtP(10, sign(p.x - m.x));
      }
    }
    if (!e.active) return;
    const eb = ebox(e);
    if (e.state === 'punch' && !e.hitDone) {
      const hb = { x: e.x + (e.face > 0 ? 20 : -125), y: e.y - 105, w: 105, h: 55 };
      if (overlap(hb, pb) && p.inv <= 0 && p.state !== 'boost') { e.hitDone = true; hurtP(12, e.face); }
    }
    if (e.state === 'dash' && !e.hitDone && overlap(eb, pb) && p.inv <= 0 && p.state !== 'boost' && p.state !== 'homing') {
      e.hitDone = true; hurtP(15, e.face);
    }
    if (p.state === 'boost') {
      if (overlap(pb, eb) && p.hitCD <= 0 && p.boostHits < 3) { p.hitCD = 7; groundHit(); if (e.iframe <= 0) p.boostHits++; e.iframe = 0; hitE(6, p.face * 3, true); e.vy = -4; e.onG = false; }
    } else if (isBall(p) && p.hitId !== p.atkId && overlap(pb, eb) && e.state !== 'ko') {
      p.hitId = p.atkId;
      if (p.state === 'homing') {
        if (airHit()) {
          hitE(12, p.face * 8, true);
          p.state = 'jump'; p.vx = -p.face * 5; p.vy = -15; p.onG = false; p.jumps = HC.maxJ; newAttack(); p.hitId = p.atkId;
        }
      } else if (p.state === 'spin') {
        groundHit();
        const dmg = Math.round(5 + Math.abs(p.vx) * 0.35);
        hitE(dmg, p.face * 10, dmg >= 12);
        p.vx = -p.face * 9; p.state = 'jump'; p.vy = -10; p.onG = false; p.jumps = 1;
      } else if (airHit()) {
        hitE(8, p.face * 6);
        p.vy = -14; p.vx = -p.face * 6; p.onG = false;
      }
    } else if (p.state === 'kick' && ab && p.hitId !== p.atkId && overlap(ab, eb)) {
      p.hitId = p.atkId;
      groundHit();
      const last = p.combo === 2;
      hitE(last ? 10 : 6, p.face * (last ? 14 : 5), last, last && HC.power ? 2 : 1);
      if (last) { e.vy = -10; e.onG = false; }
    }
    if (!isBall(p) && e.state !== 'ko' && p.state !== 'ko' && overlap(box(p), eb)) {
      const d = p.x - e.x || 1;
      p.x += sign(d) * 3; e.x -= sign(d) * 1;
    }
  }

  function updateLasers() {
    const ab = playerAttackBox();
    for (const l of lasers) {
      l.x += l.vx; l.y += l.vy || 0; l.life--;
      if (l.kind === 'shuriken') l.spin = (l.spin || 0) + 0.5;
      const lbx = l.kind === 'laser' ? { x: l.x - 22, y: l.y - 6, w: 44, h: 12 } : { x: l.x - 12, y: l.y - 12, w: 24, h: 24 };
      if (l.owner === 'e' && p.state === 'kick' && ab && overlap(ab, lbx)) {
        l.owner = 'p'; l.reflect = true; l.vx = -l.vx * 1.4; l.vy = -(l.vy || 0); SFX.star(); sparks(l.x, l.y, 10, '#9fe8ff', 6);
        popText(l.x, l.y - 30, 'はね返し!', '#9fe8ff');
      } else if (l.owner === 'e' && overlap(lbx, box(p))) {
        if (isBall(p)) { l.life = 0; sparks(l.x, l.y, 8, '#ff8080', 6); }
        else if (p.inv <= 0) { l.life = 0; hurtP(10, sign(l.vx)); }
      } else if (l.owner === 'p') {
        for (const m of minions) {
          if (m.alive && overlap(lbx, mbox(m))) { l.life = 0; hurtMinion(m); break; }
        }
        if (l.life > 0 && e.active && e.state !== 'ko' && overlap(lbx, ebox(e))) {
          l.life = 0;
          if (l.reflect) { groundHit(); hitE(10, sign(l.vx) * 8, true); }
          else if (e.guardT > 0) { sparks(l.x, l.y, 10, '#7fe0ff', 6); popText(e.x, e.y - 190, 'ガード！', '#7fe0ff'); SFX.laser(); }
          else if (e.iframe <= 0) { countAir(); hitE(5, sign(l.vx) * 4); }
        }
      }
      if (l.y > GROUND) l.life = 0;
      if (Math.abs(l.x - p.x) > 1400) l.life = 0;
    }
    lasers = lasers.filter(l => l.life > 0);
  }

  function updateStars() {
    for (const r of stars) {
      if (r.spill) {
        r.x += r.vx; r.y += r.vy; r.vy += 0.5; r.life--;
        if (r.y > GROUND - 12) { r.y = GROUND - 12; r.vy *= -0.7; r.vx *= 0.9; }
        r.x = clamp(r.x, bounds.min, bounds.max);
      }
      if (playing() && p.state !== 'ko' && (!r.spill || r.life < 170)) {
        if (Math.hypot(r.x - p.x, r.y - (p.y - 45)) < 52) {
          r.life = -1; p.stars++; SFX.star();
          parts.push({ type: 'flash', x: r.x, y: r.y, life: 12, max: 12 });
          if (p.stars === boostCost()) popText(p.x, p.y - 130, 'ブースト OK!', '#7fe0ff');
        }
      }
    }
    stars = stars.filter(r => r.life > 0);
  }

  function updateParts() {
    for (const q of parts) {
      q.x += q.vx || 0; q.y += q.vy || 0; q.life--;
      if (q.type === 'spark') { q.vx *= 0.92; q.vy = q.vy * 0.92 + 0.3; }
      if (q.type === 'dust') { q.vx *= 0.95; q.vy *= 0.95; }
      if (q.type === 'bolt') { q.vy += 0.5; q.ang += 0.3; }
      if (q.type === 'feather') { q.vx = Math.sin(q.life * 0.2) * 1.5; }
    }
    parts = parts.filter(q => q.life > 0);
    if (parts.length > 500) parts.splice(0, parts.length - 500);
  }

  function say(name, text, dur, col = '#fff') { sub = { name, text, until: cutF + dur, col }; }

  // ---------- オープニング ----------

  // ---------- へやの いどう ----------
  function enterRoomPlay(i, startX) {

    spawnRoom(Rm); makeStars(Rm);
    p.x = startX != null ? startX : Rm.x0 + 140; p.y = GROUND; p.vx = 0; p.vy = 0; p.onG = true; p.state = 'idle'; p.face = 1; p.trail = [];
    papa.x = p.x - 130; papa.y = GROUND; papa.vx = 0; papa.vy = 0; papa.onG = true;

    else enterRoomPlay(ni);
  }

  // ---------- ママの ろうや ----------
  function spawnPrisonMinions() {
    minions = [];
    const P = R(), cx = cageX();
    for (let i = 0; i < D.roomMinions; i++) {
      const x = P.x0 + 440 + (i % 8) * ((cx - 260 - P.x0 - 440) / 7) + rand(-20, 20);
      const m = makeMinion(i >= 7 ? 'drone' : 'roller', x);
      m.dir = i % 2 ? 1 : -1; m.cd = 999;
      if (m.type === 'drone') m.y = GROUND - 110 - rand(0, 40);
      minions.push(m);
    }
  }
  function enterPrison(i) {
    cr = i;
    const P = R();
    spawnPrisonMinions(); stars = [];
    bossReached = true;
    setScene('roomCut'); cutF = 0; bgm = null; fade = 1;
    p.x = P.x0 + 120; p.vx = 0; p.vy = 0; p.y = GROUND; p.onG = true; p.state = 'idle'; p.trail = []; p.face = 1;
    papa.x = P.x0 + 40; papa.y = GROUND; papa.vx = 0; papa.onG = true; papa.face = 1;
    allies = []; lasers = [];
    putMamaInCage();
    bounds = { min: P.x0 + 70, max: cageX() - 120 };
    cam.x = P.x0 + 640;
  }
  function roomStep() {
    cutF++;
    const P = R();
    p.anim++; mama.anim++; papa.anim++;
    if (cutF < 40) { p.x = Math.min(p.x + 5, P.x0 + 260); p.vx = 5; p.state = 'run'; papa.x = Math.min(papa.x + 5, P.x0 + 140); papa.vx = 5; papa.state = 'run'; }
    if (cutF === 40) { p.vx = 0; p.state = 'idle'; papa.vx = 0; papa.state = 'idle'; }
    if (cutF === 30) { SFX.door(); shake = 14; }
    camT = { x: P.x0 + 640, y: GROUND - 210, z: 1 };
    if (cutF === 50) say(nm(CAP), HC.name + '〜！　' + nm(FOL) + '〜！　ここだよ〜！', 110, CH[CAP].ui);
    if (cutF === 160) say(nm(FOL), nm(CAP) + '！　いま たすけるからね！', 100, CH[FOL].ui);
    if (cutF === 260) {
      e = makeBoss(); e.active = true; e.x = P.x0 + 860; e.y = -300; e.onG = false; e.vy = 0;
      SFX.charge();
    }
    if (cutF > 260 && !e.onG) {
      e.vy += 1.2; e.y += e.vy;
      if (e.y >= GROUND) { e.y = GROUND; e.vy = 0; e.onG = true; SFX.land(); shake = 22; dust(e.x, GROUND, 24); say('ガッチャン大王', STORY === 'A' ? 'ワシハ けいむしょの 王！　ママハ ダサナイ！' : 'ワシハ わるい子の 王！　' + nm(CAP) + 'ハ ダサナイ！', 130, '#ff7070'); }
    }
    if (cutF >= 280 && cutF < 410 && e.onG) camT = { x: e.x - 40, y: GROUND - 150, z: 1.45 };
    if (cutF === 410) say(HC.name, nm(CAP) + 'を かえせ！　いくぞ！', 100, HC.ui);
    if (cutF >= 410 && cutF < 500) camT = { x: p.x + 40, y: GROUND - 120, z: 1.6 };
    if (cutF === 510) beginBoss();
  }
  function beginBoss() {
    const P = R();
    e.active = true; e.x = P.x0 + 860; e.y = GROUND; e.onG = true; e.state = 'idle'; e.cd = 70; e.vy = 0;
    p.x = P.x0 + 300; p.state = 'idle'; p.face = 1;
    papa.x = P.x0 + 160;
    bounds = { min: P.x0 + 70, max: cageX() - 120 };
    sub = null; setScene('boss');
    banner = { text: 'BOSS FIGHT!', t: 0, max: 80, col: '#ff4848' };
    SFX.fight(); bgm = 'boss';
  }

  // ---------- 助けたあと ----------
  function rescueStep() {
    cutF++;
    p.anim++; mama.anim++; papa.anim++;
    for (const f of friendsLine) f.anim++;
    if (cutF === 1) {
      sparks(e.x, e.y - 60, 50, '#ffb040', 16); sparks(e.x, e.y - 60, 30, '#ffffff', 10);
      parts.push({ type: 'impact', x: e.x, y: e.y - 60, life: 14, max: 14, size: 150 });
      bolts(e.x, e.y - 60); bolts(e.x, e.y - 60);
      SFX.ko(); shake = 20; flash = 0.6; e.active = false; e.trail = [];
      p.state = 'idle'; p.vx = 0; p.ang = 0; p.y = GROUND; p.face = 1;
      minions.forEach(m => { if (m.alive) killMinion(m); });
      allies = [];
    }
    if (cutF < 70) cageOpen = Math.min(1, cutF / 60);
    if (cutF === 5) { SFX.door(); mama.wave = false; }
    if (cutF >= 70 && cutF < 220) {
      mama.face = -1;
      if (mama.x > p.x + 80) { mama.x -= 4; mama.vx = -4; mama.state = 'walk'; } else { mama.vx = 0; mama.state = 'idle'; }
      if (p.x < mama.x - 80 && cutF > 100) { p.x += 2; p.vx = 2; p.state = 'run'; } else { p.vx = 0; p.state = 'idle'; }
      if (papa.x < p.x - 100) { papa.x += 3; papa.vx = 3; papa.state = 'run'; papa.face = 1; } else { papa.vx = 0; papa.state = 'idle'; papa.face = 1; }
    }
    camT = cutF < 380 ? { x: (papa.x + mama.x) / 2, y: GROUND - 150, z: 1.35 } : { x: R().x0 + 640, y: GROUND - 200, z: 1 };
    if (cutF === 220) { mama.state = 'idle'; mama.vx = 0; p.state = 'idle'; p.vx = 0; papa.vx = 0; hearts((p.x + mama.x) / 2, GROUND - 120, 16); SFX.win(); bgm = 'happy'; say(nm(CAP), HC.name + '！　' + nm(FOL) + '！　たすけてくれて ありがとう！', 160, CH[CAP].ui); }
    if (cutF > 220 && cutF % 25 === 0) hearts((p.x + mama.x) / 2, GROUND - 130, 2);
    if (cutF === 380) {
      say(nm(FOL), 'よかったね、' + nm(CAP) + '！　みんなも きてくれたよ！', 160, CH[FOL].ui);
      // さいごは みんな あつまる
      const others = [...fam.map(f => f.kind), ...HERO_KEYS.filter(k => k !== HERO && k !== FOL && k !== CAP)];
      const left = R().x0 + 110;
      friendsLine = others.map((k, i) => ({ kind: k, x: left - 300 - i * 80, tx: left + i * 72, y: GROUND, vx: 0, face: 1, state: 'run', anim: rand(0, 40), inv: 0, onG: true, wave: false }));
    }
    for (const f of friendsLine) {
      if (f.x < f.tx) { f.x += 6; f.vx = 6; f.state = 'run'; } else { f.vx = 0; f.state = 'idle'; f.wave = true; }
    }
    if (cutF === 540) say(HC.name, STORY === 'A' ? 'みんな、いっしょに かえろう！' : 'みんなで りょこうの つづきを しよう！', 160, HC.ui);
    if (cutF === 700) { banner = { text: nm(CAP) + 'を たすけた！', t: 0, max: 150, col: '#ffd23f' }; }
    if (cutF === 860) { setScene('credits'); sub = null; }
  }

  // ---------- コンティニュー ----------
  function retry() {
    p = makeP(0);
    lasers = []; timeScale = 1; hitstop = 0; allies = []; allyCD = 0;
    if (bossReached) {
      e = makeBoss(); spawnPrisonMinions(); beginBoss();
    } else {
      e = makeBoss();
      enterRoomPlay(cr, cr === 0 ? 500 : null);
      banner = { text: 'もう一回！', t: 0, max: 100, col: '#ffd23f' };
    }
  }

  // ---------- シミュレーション ----------
  function step() {
    simT++;
    if (hitstop > 0) { hitstop--; return; }
    if (scene === 'cut') cutStep();
    if (scene === 'roomCut') roomStep();
    if (scene === 'rescue') rescueStep();
    if (scene === 'play' || scene === 'boss' || scene === 'ko') {
      updateP();
      if (p.state !== 'superCharge') { updateMinions(); updateBoss(); }
      updatePapa();
      updateAllies();
      updateLasers();
      if (playing()) resolve();
      if (scene === 'play') {
        const Rm = R();
        if (!roomCleared && !minions.some(m => m.alive)) {
          roomCleared = true; bounds.max = Rm.x0 + Rm.w + 10;
          SFX.open(); banner = { text: 'ドアが あいた！ →', t: 0, max: 100, col: '#9fff7a' };
          score += 500;
        }
        if (roomCleared && p.x > Rm.x0 + Rm.w - 30) nextRoom();
      }
    }
    if (scene === 'stageIntro') { p.anim++; papa.anim++; }
    mama.anim++;
    if (fade > 0) fade = Math.max(0, fade - 0.03);
    updateStars();
    updateParts();
  }

  function sceneTick(dt) {
    sceneT += dt;
    if (shake > 0) shake = Math.max(0, shake - dt * 0.9);
    if (flash > 0) flash = Math.max(0, flash - dt * 0.04);
    if (banner) { banner.t += dt; if (banner.t > banner.max) banner = null; }
    switch (scene) {
      case 'title':
        lbTarget = 110;
        if (take('left')) { modeSel = 0; showSel(); SFX.tick(); }
        if (take('right')) { modeSel = 1; showSel(); SFX.tick(); }
        if (take('start')) chooseMode(modeSel === 0 ? 'ruka' : 'normal');
        break;
      case 'select':
        lbTarget = 60;
        if (take('left')) { heroSel = (heroSel + HERO_KEYS.length - 1) % HERO_KEYS.length; updateSelUI(); SFX.tick(); }
        if (take('right')) { heroSel = (heroSel + 1) % HERO_KEYS.length; updateSelUI(); SFX.tick(); }
        if (take('down')) { longRoute = !longRoute; updateSelUI(); SFX.tick(); }
        if (take('start') && sceneT > 10) startGame();
        break;
      case 'leader':
        if (take('start') && sceneT > 20) sceneT = Math.max(sceneT, 470);
        if (sceneT < 180 && Math.floor(sceneT) % 60 === 0) SFX.tick();
        if (sceneT >= 470) { setScene('cut'); cutF = 0; cam.x = 600; cam.z = 1.1; bgm = 'happy'; }
        break;
      case 'cut':
        lbTarget = 110;
        { const calm = STORY === 'A' ? 340 : 880; if (cutF < calm && cutF > 20) bgm = 'happy'; else if (cutF >= calm) bgm = null; }
        if (take('start') && cutF > 30) { if (STORY === 'B') rooms[0].beach = true; putMamaInCage(); startStage(); }
        break;
      case 'stageIntro':
        lbTarget = 64;
        camT = { x: p.x + 160, y: GROUND - 230, z: 1 };
        if (sceneT >= 90) setScene('play');
        break;
      case 'play':
        lbTarget = p.state === 'superCharge' ? 120 : 64;
        if (p.state === 'superCharge') camT = { x: p.x, y: p.y - 140, z: 1.7 };
        else {
          const z = 1 - Math.min(0.14, Math.abs(p.vx) / 160);
          camT = { x: p.x + p.face * 140 + p.vx * 5, y: GROUND - 230, z };
          camT.lift = Math.max(0, (GROUND - 240 - p.y) * 0.6);
        }
        break;
      case 'roomCut':
        lbTarget = 110;
        if (take('start') && cutF > 40) { if (!e.active) { e = makeBoss(); } beginBoss(); }
        break;
      case 'boss':
        lbTarget = p.state === 'superCharge' ? 120 : 64;
        if (p.state === 'superCharge') camT = { x: p.x, y: p.y - 140, z: 1.7 };
        else {
          const d = Math.abs(p.x - e.x);
          camT = { x: (p.x + e.x) / 2, y: GROUND - 240, z: clamp(1000 / (d + 450), 1, 1.25) };
          camT.lift = Math.max(0, (GROUND - 220 - Math.min(p.y, e.y)) * 0.6);
        }
        break;
      case 'ko': {
        lbTarget = 120;
        timeScale = sceneT < 110 ? 0.18 : 1;
        const o = loser === 'p' ? p : e;
        camT = { x: o.x, y: o.y - 100, z: sceneT < 110 ? 1.6 : 1.1 };
        if (sceneT >= 1 && sceneT - 1 < 1) banner = { text: 'K.O.', t: 0, max: 150, col: '#ff4848' };
        if (sceneT > 190) {
          timeScale = 1;
          if (loser === 'e') { setScene('rescue'); cutF = 0; lasers = []; }
          else setScene('lose');
        }
        break;
      }
      case 'rescue':
        lbTarget = 110;
        if (take('start') && cutF > 240 && cutF < 860) { cutF = 859; }
        break;
      case 'credits':
        lbTarget = 110;
        if (sceneT > 120 && take('start')) { bgm = null; setScene('title'); }
        break;
      case 'lose':
        lbTarget = 110;
        if (sceneT > 60 && take('start')) retry();
        break;
    }
    lb = lerp(lb, lbTarget, Math.min(1, 0.08 * dt));
    if (camT.z < 1.5) camT.y = Math.max(camT.y, GROUND - (H / 2 - lb - 95) / camT.z) - (camT.lift || 0);
    const k = Math.min(1, (scene === 'cut' || scene === 'roomCut' || scene === 'rescue' ? 0.06 : 0.1) * dt);
    cam.x = lerp(cam.x, camT.x, k); cam.y = lerp(cam.y, camT.y, k); cam.z = lerp(cam.z, camT.z, k);
    if (rooms.length) {
      const Rm = R(), half = W / 2 / cam.z;
      cam.x = Rm.w <= half * 2 ? Rm.x0 + Rm.w / 2 : clamp(cam.x, Rm.x0 + half, Rm.x0 + Rm.w - half);
    }
  }

  // ---------- 描画：キャラクター ----------
  function ell(x, y, rx, ry, rot = 0) { ctx.beginPath(); ctx.ellipse(x, y, rx, ry, rot, 0, Math.PI * 2); ctx.fill(); }

  function drawHero(o, kind, alpha = 1, ghost = false) {
    const c = CH[kind];
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.translate(o.x, o.y);
    if (o.inv > 0 && o.inv < 900 && Math.floor(o.inv / 4) % 2 === 0 && !ghost && o.state !== 'ko') ctx.globalAlpha = alpha * 0.4;
    if (!ghost && o.y > GROUND - 500) {
      ctx.fillStyle = 'rgba(0,0,0,.25)';
      const sh = clamp(1 - (GROUND - o.y) / 400, 0.3, 1);
      ctx.save(); ctx.translate(0, GROUND - o.y); ell(0, 0, 34 * sh * (c.scale || 1), 7 * sh); ctx.restore();
    }
    const s = c.scale || 1;
    ctx.scale(o.face * s, s);
    if (isBall(o)) drawBall(c, o);
    else drawStand(c, o, ghost);
    ctx.restore();
  }

  function drawBall(c, o) {
    ctx.translate(0, -34);
    ctx.rotate(o.ang || 0);
    const g = ctx.createRadialGradient(-8, -10, 4, 0, 0, 34);
    g.addColorStop(0, c.light); g.addColorStop(0.6, c.body); g.addColorStop(1, c.dark);
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(0, 0, 31, 0, Math.PI * 2); ctx.fill();
    if (c.animal === 'cheetah') { ctx.fillStyle = c.dark; for (let i = 0; i < 6; i++) ell(Math.cos(i * 1.1) * 18, Math.sin(i * 1.1) * 18, 4, 3); }
    if (c.animal === 'rabbit') { ctx.fillStyle = c.body; ell(-10, -34, 7, 12, -0.3); ell(6, -36, 7, 12, 0.3); }
    if (c.animal === 'robot') { ctx.strokeStyle = c.dark; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(0, 0, 20, 0, Math.PI * 2); ctx.stroke(); }
    // スカーフや はちまき
    if (c.acc === 'scarf' || c.acc === 'ninja' || c.acc === 'band') { ctx.strokeStyle = c.accCol; ctx.lineWidth = 6; ctx.beginPath(); ctx.arc(0, 0, 26, 0.3, 1.4); ctx.stroke(); }
    ctx.strokeStyle = 'rgba(255,255,255,.55)'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(0, 0, 22, -0.4, 0.9); ctx.stroke();
    ctx.beginPath(); ctx.arc(0, 0, 13, 2.4, 3.6); ctx.stroke();
  }

  function drawStand(c, o, ghost) {
    const A = c.animal;
    const spd = Math.abs(o.vx || 0);
    const running = (o.state === 'run' || o.state === 'walk' || (o.state === 'idle' && spd > 1)) && o.onG !== false;
    const ratio = clamp(spd / 24, 0, 1);
    if (o.state === 'ko') ctx.rotate(o.ang);
    else if (o.state === 'hurt') ctx.rotate(-0.35);
    else if (running) ctx.rotate(0.24 * ratio);
    const an = o.anim || 0;
    const ph = an * (o.state === 'walk' ? 0.2 : 0.25 + ratio * 0.5);
    const bob = o.state === 'idle' ? Math.sin(an * 0.1) * 1.5 : 0;
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';

    // しっぽ
    const wag = Math.sin(an * 0.15) * 7;
    if (A === 'cheetah' || A === 'cat') {
      const ty = A === 'cat' ? -82 + wag : -22 + wag;
      ctx.strokeStyle = c.body; ctx.lineWidth = 7;
      ctx.beginPath(); ctx.moveTo(-16, -36); ctx.quadraticCurveTo(-50, -44 + wag, -54, ty); ctx.stroke();
      ctx.fillStyle = A === 'cheetah' ? c.dark : c.light; ell(-54, ty, 5, 5);
      if (A === 'cheetah') { ctx.fillStyle = c.dark; ell(-38, -42 + wag * 0.6, 3, 3); ell(-48, -34 + wag * 0.8, 3, 3); }
    } else if (A === 'bird') {
      ctx.fillStyle = c.dark;
      for (let i = 0; i < 3; i++) { ctx.beginPath(); ctx.moveTo(-14, -34); ctx.lineTo(-44, -44 + i * 10 + wag * 0.3); ctx.lineTo(-40, -36 + i * 10); ctx.closePath(); ctx.fill(); }
    } else if (A === 'bear') { ctx.fillStyle = c.body; ell(-20, -36, 7, 7); }
    else if (A === 'rabbit') { ctx.fillStyle = '#ffffff'; ell(-21, -36, 9, 9); }
    else if (A === 'robot') { ctx.fillStyle = c.dark; ctx.fillRect(-26, -54, 8, 22); ctx.fillStyle = running ? '#ffb040' : '#666'; ell(-22, -30, 4, 3 + (running ? Math.random() * 4 : 0)); }

    // スカーフの はし（うしろに なびく）
    if (c.acc === 'scarf' || c.acc === 'ninja') {
      const fl = Math.sin(an * 0.4) * 5, len = 26 + ratio * 26;
      const sy = c.acc === 'ninja' ? -90 + bob : -60 + bob;
      ctx.fillStyle = c.accCol;
      ctx.beginPath(); ctx.moveTo(-8, sy - 4); ctx.lineTo(-8 - len, sy - 8 + fl); ctx.lineTo(-6 - len, sy + 2 + fl); ctx.lineTo(-8, sy + 4); ctx.closePath(); ctx.fill();
      ctx.beginPath(); ctx.moveTo(-8, sy); ctx.lineTo(-4 - len * 0.7, sy + 10 - fl); ctx.lineTo(-2 - len * 0.7, sy + 16 - fl); ctx.lineTo(-6, sy + 6); ctx.closePath(); ctx.fill();
    }

    // あし
    let f1 = { x: 8, y: -6 }, f2 = { x: -10, y: -6 };
    if ((running || o.state === 'walk') && ratio < 0.55) {
      f1 = { x: Math.cos(ph) * 18, y: -6 - Math.max(0, Math.sin(ph)) * 14 };
      f2 = { x: -Math.cos(ph) * 18, y: -6 - Math.max(0, -Math.sin(ph)) * 14 };
    }
    if (o.state === 'kick') f1 = { x: 44, y: -46 };
    if (o.state === 'hurt' || o.state === 'ko') { f1 = { x: 18, y: -14 }; f2 = { x: -16, y: -4 }; }
    if (running && ratio >= 0.55) {
      ctx.save(); ctx.translate(0, -16);
      for (let i = 0; i < 3; i++) {
        ctx.strokeStyle = i === 0 ? c.shoe : (i === 1 ? 'rgba(255,255,255,.6)' : c.body);
        ctx.lineWidth = 7 - i * 2;
        ctx.beginPath(); ctx.ellipse(0, 0, 26 - i * 3, 15 - i * 2, ph * 2 + i, 0, Math.PI * 2); ctx.stroke();
      }
      ctx.globalAlpha *= 0.5; ctx.fillStyle = c.shoe; ell(0, 0, 22, 12, ph);
      ctx.restore();
    } else {
      ctx.strokeStyle = A === 'robot' ? c.dark : c.body; ctx.lineWidth = 7;
      ctx.beginPath(); ctx.moveTo(-4, -30); ctx.lineTo(f2.x, f2.y - 4); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(4, -30); ctx.lineTo(f1.x, f1.y - 4); ctx.stroke();
      for (const f of [f2, f1]) {
        ctx.fillStyle = c.shoe; ell(f.x + 7, f.y, 14, 8);
        ctx.fillStyle = 'rgba(255,255,255,.75)'; ctx.fillRect(f.x - 4, f.y + 4, 22, 3);
      }
    }

    // からだ
    ctx.fillStyle = c.body; ell(0, -46 + bob, 20, 24);
    ctx.fillStyle = c.belly; ell(7, -42 + bob, 11, 15);
    if (A === 'cheetah') { ctx.fillStyle = c.dark; ell(-8, -54 + bob, 3, 2.5); ell(-12, -40 + bob, 3, 2.5); ell(-4, -32 + bob, 2.5, 2); }
    if (A === 'robot') {
      ctx.fillStyle = c.light; ctx.fillRect(-2, -56 + bob, 18, 20);
      ctx.fillStyle = Math.floor(an / 20) % 2 ? '#40e0ff' : '#ffb040'; ell(7, -46 + bob, 4, 4);
    }
    if (c.acc === 'bow') {
      const dg = ctx.createLinearGradient(0, -64, 0, -14);
      dg.addColorStop(0, '#ff8ac8'); dg.addColorStop(1, '#c04a9a');
      ctx.fillStyle = dg;
      ctx.beginPath(); ctx.moveTo(-17, -64 + bob); ctx.lineTo(19, -64 + bob); ctx.lineTo(30, -16); ctx.lineTo(-28, -16); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#ffffff'; ctx.fillRect(-22, -22, 50, 4);
    }
    if (c.acc === 'tie') {
      ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.moveTo(-2, -66 + bob); ctx.lineTo(18, -66 + bob); ctx.lineTo(16, -30); ctx.lineTo(0, -30); ctx.closePath(); ctx.fill();
      ctx.fillStyle = c.accCol; ctx.beginPath(); ctx.moveTo(6, -64 + bob); ctx.lineTo(11, -64 + bob); ctx.lineTo(13, -38); ctx.lineTo(8, -32); ctx.lineTo(4, -38); ctx.closePath(); ctx.fill();
    }
    if (c.acc === 'scarf' || c.acc === 'ninja') { ctx.fillStyle = c.accCol; ell(2, -64 + bob, 17, 5); }

    // あたま
    const hy = -80 + bob;
    // みみ
    if (A === 'cheetah' || A === 'bear') {
      const r = A === 'bear' ? 10 : 7;
      ctx.fillStyle = c.body; ell(-8, hy - 19, r, r); ell(10, hy - 21, r, r);
      ctx.fillStyle = A === 'bear' ? c.light : c.dark; ell(-8, hy - 19, r * 0.5, r * 0.5); ell(10, hy - 21, r * 0.5, r * 0.5);
    } else if (A === 'cat') {
      ctx.fillStyle = c.body;
      ctx.beginPath(); ctx.moveTo(-16, hy - 10); ctx.lineTo(-12, hy - 36); ctx.lineTo(0, hy - 18); ctx.closePath(); ctx.fill();
      ctx.beginPath(); ctx.moveTo(4, hy - 18); ctx.lineTo(16, hy - 38); ctx.lineTo(20, hy - 12); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#ff9ac0';

  function drawGroundRange(Rm, vx0, vx1) {
    const a = Math.max(vx0, Rm.x0), b = Math.min(vx1, Rm.x0 + Rm.w);
    if (b <= a) return;
    if (!Rm.indoor && Rm.beach) {
      ctx.fillStyle = '#f0d890'; ctx.fillRect(a, GROUND, b - a, 600);
      ctx.fillStyle = '#e0c070';
      for (let x = Math.floor(a / 90) * 90; x < b; x += 90) { ell(x + 30, GROUND + 50, 10, 3); ell(x + 70, GROUND + 120, 14, 4); }
      return;
    }
    if (!Rm.indoor) {
      ctx.fillStyle = '#8a5a2a'; ctx.fillRect(a, GROUND, b - a, 600);
      ctx.fillStyle = '#6e4620';
      for (let x = Math.floor(a / 90) * 90; x < b; x += 90) { ell(x + 30, GROUND + 70, 14, 6); ell(x + 70, GROUND + 140, 18, 7); }

      ctx.fillStyle = '#ffd23f';

      const hx = right ? x - i * gap : x + i * gap;
      ctx.fillStyle = i < n ? col : 'rgba(255,255,255,.18)';
      heartPath(hx, y - sz / 2, sz);
    }
    return gap;
  }
  function drawHUD() {
    if (!['play', 'stageIntro', 'boss', 'ko'].includes(scene)) return;
    const y = Math.max(10, lb / 2 - 12);
    ctx.font = 'bold 18px sans-serif';
    ctx.textAlign = 'left'; ctx.fillStyle = HC.ui; ctx.fillText(HC.name, 30, y + 6);
    const gap = heartsRow(110, y - 2, p.hp, p.maxHp, p.hp > 3 ? '#ff5fa8' : '#ff3030', false);
    ctx.textAlign = 'left'; ctx.font = 'bold 15px sans-serif'; ctx.fillStyle = '#fff';
    ctx.fillText(p.hp + ' / ' + p.maxHp, 110 + p.maxHp * gap, y + 6);
    ctx.textAlign = 'center'; ctx.font = 'bold 14px sans-serif'; ctx.fillStyle = MODE === 'ruka' ? '#ff9ad5' : '#9fc8ff';
    ctx.fillText(D.name, W / 2, y + 26);
    // なかまの じゅんび
    ctx.textAlign = 'left'; ctx.font = 'bold 13px sans-serif';
    ctx.fillStyle = allyCD > 0 ? 'rgba(255,255,255,.5)' : '#9fff7a';
    ctx.fillText(allyCD > 0 ? 'なかま じゅんび中…' : 'ピンチに なったら なかまが くるよ！', 30, y + 28);
    if (e.active && (scene === 'boss' || scene === 'ko')) {
      ctx.textAlign = 'right'; ctx.font = 'bold 18px sans-serif'; ctx.fillStyle = '#ff8080';
      ctx.fillText('ガッチャン大王', W - 30, y + 6);
      const g2 = heartsRow(W - 180, y - 2, e.hp, e.maxHp, '#ff4848', true);
      ctx.textAlign = 'right'; ctx.font = 'bold 15px sans-serif'; ctx.fillStyle = '#fff';
      ctx.fillText(e.hp + ' / ' + e.maxHp, W - 180 - e.maxHp * g2 + 10, y + 6);
      const left = minions.filter(m => m.alive).length;
      if (D.roomMinions && !(e.guardT > 0)) {
        ctx.font = 'bold 15px sans-serif'; ctx.fillStyle = left ? '#ffd23f' : '#9fff7a';
        ctx.fillText(left ? 'ロボ のこり ' + left + ' / ' + D.roomMinions : 'ロボ ぜんぶ やっつけた！', W - 30, y + 30);
      }
      if (e.guardT > 0) { ctx.fillStyle = '#7fe0ff'; ctx.font = 'bold 14px sans-serif'; ctx.fillText('ガード中 → キックかスピンで こわせ！', W - 30, y + 28); }
    } else {
      // へやの すすみぐあい
      const n = rooms.length, gap2 = Math.min(64, 360 / Math.max(1, n - 1)), x0 = W - 60 - gap2 * (n - 1);
      ctx.strokeStyle = 'rgba(255,255,255,.35)'; ctx.lineWidth = 4;
      ctx.beginPath(); ctx.moveTo(x0, y + 2); ctx.lineTo(W - 60, y + 2); ctx.stroke();
      rooms.forEach((rm, i) => {
        const x = x0 + i * gap2;
        ctx.fillStyle = i < cr ? '#9fff7a' : i === cr ? '#ffd23f' : 'rgba(255,255,255,.35)';
        if (rm.type === 'prison') { ctx.fillStyle = i === cr ? '#ffd23f' : '#ff9ad5'; heartPath(x, y - 10, 24); }
        else if (rm.type === 'home') { ctx.beginPath(); ctx.moveTo(x - 11, y + 2); ctx.lineTo(x, y - 10); ctx.lineTo(x + 11, y + 2); ctx.closePath(); ctx.fill(); ctx.fillRect(x - 8, y + 2, 16, 10); }
        else { ctx.fillRect(x - 9, y - 10, 18, 22); ctx.fillStyle = '#000'; ctx.fillRect(x - 5, y - 6, 10, 18); }
      });
      ctx.textAlign = 'right'; ctx.font = 'bold 15px sans-serif'; ctx.fillStyle = '#ff9ad5';
      ctx.fillText(nm(CAP) + 'まで', x0 - 18, y + 7);
      const left = minions.filter(m => m.alive).length;
      if (left) { ctx.fillStyle = '#ffd23f'; ctx.fillText('てき のこり ' + left + '　→ ぜんぶ たおすと ドアが あくよ', W - 30, y + 30); }
    }
    const by = H - Math.max(16, lb / 2 - 10);
    ctx.fillStyle = '#ffd23f'; starPath(44, by - 7, 13, 6); ctx.fill();
    ctx.textAlign = 'left'; ctx.fillStyle = '#ffd23f'; ctx.font = 'bold 22px sans-serif';
    ctx.fillText('× ' + p.stars, 62, by + 2);
    const bc = boostCost();
    bar(150, by - 14, 200, 14, p.stars / bc * 100, p.stars >= bc ? (Math.floor(simT / 6) % 2 ? '#7fe0ff' : '#ffffff') : '#ffd23f');
    ctx.font = 'bold 14px sans-serif'; ctx.fillStyle = p.stars >= bc ? '#7fe0ff' : 'rgba(255,255,255,.6)';
    ctx.fillText(p.stars >= bc ? 'ブースト OK!（X / ブースト）' : 'スター' + bc + 'こで スーパーブースト', 364, by - 2);
    ctx.textAlign = 'right'; ctx.fillStyle = '#fff'; ctx.font = 'bold 18px sans-serif';
    ctx.fillText('スコア ' + score, W - 30, by);
  }

  function drawBanner() {
    if (!banner) return;
    const t = banner.t, a = Math.min(1, t / 8, (banner.max - t) / 12);
    const s = 1 + Math.max(0, 1 - t / 10) * 1.5;
    ctx.save();
    ctx.globalAlpha = clamp(a, 0, 1);
    ctx.translate(W / 2, H / 2 - 20); ctx.scale(s, s);
    const fs = banner.text.length > 10 ? 64 : 88;
    ctx.font = `italic 900 ${fs}px "Arial Black", sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.lineWidth = 12; ctx.strokeStyle = '#000'; ctx.strokeText(banner.text, 0, 0);
    ctx.fillStyle = banner.col; ctx.fillText(banner.text, 0, 0);
    ctx.restore();
  }
  function drawSub() {
    if (!sub) return;
    if (cutF > sub.until) { sub = null; return; }
    const y = H - lb / 2;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    const txt = sub.name ? sub.name + '「' + sub.text + '」' : sub.text;
    ctx.font = 'bold ' + (txt.length > 34 ? 24 : 28) + 'px sans-serif';
    ctx.lineWidth = 6; ctx.strokeStyle = '#000'; ctx.strokeText(txt, W / 2, y);
    ctx.fillStyle = sub.col; ctx.fillText(txt, W / 2, y);
    ctx.textBaseline = 'alphabetic';
  }

  // ---------- フィルム効果 ----------
  function filmFX(intensity = 1) {
    const v = ctx.createRadialGradient(W / 2, H / 2, H * 0.35, W / 2, H / 2, H * 0.95);
    v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,' + 0.5 * intensity + ')');
    ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = 'rgba(255,170,90,' + 0.05 * intensity + ')'; ctx.fillRect(0, 0, W, H);
    ctx.save();
    ctx.globalAlpha = 0.07 * intensity;
    ctx.globalCompositeOperation = 'overlay';
    ctx.drawImage(grains[Math.floor(performance.now() / 50) % 4], rand(-20, 0), rand(-20, 0), W + 20, H + 20);
    ctx.restore();
    if (Math.random() < 0.12 * intensity) {
      ctx.strokeStyle = 'rgba(255,255,255,' + rand(0.08, 0.25) + ')'; ctx.lineWidth = rand(1, 2);
      const x = rand(0, W); ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x + rand(-10, 10), H); ctx.stroke();
    }
    ctx.fillStyle = 'rgba(0,0,0,' + rand(0, 0.035) * intensity + ')'; ctx.fillRect(0, 0, W, H);
  }
  function letterbox() {
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, W, lb); ctx.fillRect(0, H - lb, W, lb);
  }

  // ---------- 画面ごと ----------
  const idleO = (face, extra = {}) => ({ x: 0, y: 0, face, state: 'idle', anim: sceneT, vx: 0, inv: 0, onG: true, ...extra });
  function titleLogo(y, big = 92) {
    ctx.textAlign = 'center';
    ctx.font = `italic 900 ${big}px "Arial Black", sans-serif`;
    ctx.lineWidth = 10; ctx.strokeStyle = '#3a1a00'; ctx.strokeText('RUKA & FRIENDS', W / 2, y);
    const tg = ctx.createLinearGradient(0, y - big, 0, y); tg.addColorStop(0, '#fff6c0'); tg.addColorStop(1, '#ffb020');
    ctx.fillStyle = tg; ctx.fillText('RUKA & FRIENDS', W / 2, y);
  }
  function drawTitle() {
    ctx.fillStyle = '#05060c'; ctx.fillRect(0, 0, W, H);
    const g = ctx.createRadialGradient(W / 2, H / 2, 50, W / 2, H / 2, 600);
    g.addColorStop(0, 'rgba(220,140,60,.35)'); g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    ctx.save(); ctx.translate(170, 580); ctx.scale(2.1, 2.1); drawHero(idleO(1), 'ruka', 1, true); ctx.restore();
    ctx.save(); ctx.translate(60, 600); ctx.scale(1.4, 1.4); drawHero(idleO(1), 'papa', 1, true); ctx.restore();
    ctx.save(); ctx.translate(1110, 580); ctx.scale(2, 2); drawHero(idleO(-1, { wave: true }), 'mama', 1, true); ctx.restore();
    // ろうやの こうし
    ctx.strokeStyle = 'rgba(160,160,180,.9)'; ctx.lineWidth = 8;
    for (let x = 1010; x <= 1210; x += 30) { ctx.beginPath(); ctx.moveTo(x, 330); ctx.lineTo(x, 600); ctx.stroke(); }
    ctx.font = '600 18px serif'; ctx.fillStyle = 'rgba(255,255,255,.7)'; ctx.textAlign = 'center';
    ctx.fillText('FAMILY FILM  PRESENTS', W / 2, 160);
    titleLogo(255);
    ctx.font = 'bold 44px serif'; ctx.fillStyle = '#ff9ad5'; ctx.fillText('けいむしょの ママを たすけだせ！', W / 2, 320);
    ctx.font = 'bold 17px sans-serif'; ctx.fillStyle = 'rgba(255,255,255,.85)';
    ['← → : はしる　↑ / スペース : ジャンプ（空中でもう一回 → ホーミング）', 'Z : アタック　X : スーパーブースト（スター20こ）',
      'へやの てきを ぜんぶ たおすと ドアが あく！ ピンチには なかまが たすけに くるよ'].forEach((l, i) => ctx.fillText(l, W / 2, 365 + i * 26));
  }
  function drawSelect() {
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#1a1030'); g.addColorStop(1, '#3a1a3a');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = 'rgba(255,210,63,.12)';
    ctx.beginPath(); ctx.ellipse(250, 600, 220, 40, 0, 0, Math.PI * 2); ctx.fill();
    ctx.textAlign = 'center'; ctx.font = 'bold 40px sans-serif'; ctx.fillStyle = '#ffd23f';
    ctx.fillText('だれで いく？　キャラを えらぼう！', W / 2, 92);
    const h = HEROES[HERO];
    const runO = idleO(1, { state: Math.floor(sceneT / 120) % 2 ? 'idle' : 'run', vx: Math.floor(sceneT / 120) % 2 ? 0 : 8 });
    ctx.save(); ctx.translate(260, 590); ctx.scale(2.6, 2.6); drawHero(runO, HERO, 1, true); ctx.restore();
    ctx.save(); ctx.translate(90, 600); ctx.scale(1.5, 1.5); drawHero(idleO(1), FOL, 1, true); ctx.restore();
    ctx.font = 'bold 46px sans-serif'; ctx.fillStyle = h.ui; ctx.textAlign = 'center';
    ctx.strokeStyle = '#000'; ctx.lineWidth = 6; ctx.strokeText(h.name, 260, 210); ctx.fillText(h.name, 260, 210);
    ctx.font = 'bold 20px sans-serif'; ctx.fillStyle = '#fff'; ctx.fillText(h.desc, 260, 244);
    ctx.font = '15px sans-serif'; ctx.fillStyle = 'rgba(255,255,255,.7)';
    ctx.fillText(nm(FOL) + 'が うしろから ついてくるよ', 260, 680);
    ctx.fillText('← → で えらぶ　↓ で コース　Enter で スタート', W / 2 + 180, 690);
  }

  function drawLeader() {
    const t = sceneT;
    if (t < 180) {
      ctx.fillStyle = '#b9a47c'; ctx.fillRect(0, 0, W, H);
      const n = 3 - Math.floor(t / 60), frac = (t % 60) / 60;
      ctx.fillStyle = 'rgba(80,60,30,.45)';
      ctx.beginPath(); ctx.moveTo(W / 2, H / 2); ctx.arc(W / 2, H / 2, 600, -Math.PI / 2, -Math.PI / 2 + frac * Math.PI * 2); ctx.closePath(); ctx.fill();
      ctx.strokeStyle = '#2a2014'; ctx.lineWidth = 4;
      ctx.beginPath(); ctx.arc(W / 2, H / 2, 230, 0, Math.PI * 2); ctx.stroke();
      ctx.beginPath(); ctx.arc(W / 2, H / 2, 260, 0, Math.PI * 2); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, H / 2); ctx.lineTo(W, H / 2); ctx.moveTo(W / 2, 0); ctx.lineTo(W / 2, H); ctx.stroke();
      ctx.font = 'bold 300px serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillStyle = '#1a140c'; ctx.fillText(n, W / 2, H / 2 + 10);
      ctx.textBaseline = 'alphabetic';
      filmFX(2.2);
    } else if (t < 310) {
      ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
      ctx.globalAlpha = clamp(Math.min((t - 180) / 30, (310 - t) / 30), 0, 1);
      ctx.textAlign = 'center'; ctx.fillStyle = '#fff';
      ctx.font = '600 26px serif'; ctx.fillText('ファミリー・フィルム　提供', W / 2, H / 2);
      ctx.globalAlpha = 1;
      filmFX(1.5);
    } else {
      ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
      const a = Math.min(1, (t - 310) / 30, (470 - t) / 25);
      const s = 1 + (t - 310) / 1200;
      ctx.save(); ctx.globalAlpha = clamp(a, 0, 1); ctx.translate(W / 2, H / 2); ctx.scale(s, s); ctx.translate(-W / 2, -H / 2);
      titleLogo(H / 2 - 10, 100);
      ctx.font = 'bold 48px serif'; ctx.fillStyle = '#ff9ad5'; ctx.textAlign = 'center'; ctx.fillText('けいむしょの ママを たすけだせ！', W / 2, H / 2 + 64);
      ctx.restore();
      filmFX(1.5);
      letterbox();
    }
  }

  function drawCredits() {
    ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
    const cast = HERO_KEYS.map(k => ['', HEROES[k].name + ' ………… ' + HEROES[k].desc]);
    const credits = [
      ['h', 'ルカ＆フレンズ　けいむしょの ママを たすけだせ！'], ['', ''], ['s', '出演'],
      ['', 'しゅじんこう ………… ' + HC.name], ['', nm(CAP) + ' ………… ろうやから たすけだされた'], ['', nm(FOL) + ' ………… ずっと うしろから ついてきた'],
      ['s', 'なかまたち'], ...cast,
      ['', 'ガッチャン大王 ………… けいむしょの わるい 王さまロボ'], ['', 'ロボたち ………… たくさん'], ['', ''],
      ['s', 'あそんだ モード'], ['', D.name + '　／　' + (longRoute ? 'ながい コース' : 'みじかい コース')], ['s', 'スコア'], ['', String(score)], ['', ''],
      ['s', '主演プレイヤー'], ['h', 'きみ！'], ['', ''], ['s', '制作'], ['', 'ファミリー・フィルム'], ['', ''], ['', ''], ['h', 'THE END'],
    ];
    const scroll = Math.min(160 + sceneT * 1.1, 560 + credits.length * 46 - H / 2 - 40);
    ctx.textAlign = 'center';
    credits.forEach((c, i) => {
      const y = H + 40 + i * 46 - scroll;
      if (y < -40 || y > H + 60) return;
      ctx.font = c[0] === 'h' ? 'bold 40px serif' : c[0] === 's' ? '600 20px serif' : '24px serif';
      ctx.fillStyle = c[0] === 's' ? '#ffd23f' : '#fff';
      ctx.fillText(c[1], W / 2, y);
    });
    // かぞくで いっしょに かえる
    const wx = ((sceneT * 2.2) % (W + 400)) - 250;
    ctx.save(); ctx.translate(wx, H - lb - 20); ctx.scale(0.75, 0.75);
    const walk = (dx, k, off) => drawHero({ x: dx, y: 0, face: 1, state: 'walk', anim: sceneT + off, vx: 2, inv: 0, onG: true }, k, 1, true);
    walk(0, FOL, 0); walk(110, CAP, 10); walk(220, HERO, 20);
    ctx.fillStyle = '#ff5fa8'; heartPath(110, -170 + Math.sin(sceneT * 0.1) * 6, 22);
    ctx.restore();
    filmFX(1.3);
    letterbox();
    if (sceneT > 120) {
      ctx.font = 'bold 22px sans-serif'; ctx.fillStyle = 'rgba(255,255,255,' + (0.5 + Math.sin(sceneT * 0.08) * 0.4) + ')';
      ctx.fillText('タップ ／ Enter で タイトルへ', W / 2, H - lb / 2 + 8);
    }
  }

  function drawLose() {
    drawBackground(); drawWorld();
    ctx.save(); ctx.globalCompositeOperation = 'color';
    ctx.fillStyle = 'rgba(160,120,60,1)'; ctx.fillRect(0, 0, W, H);
    ctx.restore();
    ctx.fillStyle = 'rgba(60,40,10,.25)'; ctx.fillRect(0, 0, W, H);
    filmFX(1.6);
    letterbox();
    const s = Math.min(1, sceneT / 25);
    ctx.save(); ctx.translate(W - 60 - 420 * s, H - lb - 70);
    ctx.fillStyle = '#e8d8a8'; ctx.strokeStyle = '#3a2a10'; ctx.lineWidth = 5;
    ctx.beginPath(); ctx.moveTo(0, -36); ctx.lineTo(330, -36); ctx.lineTo(330, -56); ctx.lineTo(400, 0); ctx.lineTo(330, 56); ctx.lineTo(330, 36); ctx.lineTo(0, 36); ctx.closePath();
    ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#3a2a10'; ctx.font = 'italic bold 30px serif'; ctx.textAlign = 'left';
    ctx.fillText('To Be Continued', 22, 10);
    ctx.restore();
    if (sceneT > 60) {
      ctx.textAlign = 'center'; ctx.font = 'bold 22px sans-serif'; ctx.fillStyle = '#fff';
      ctx.fillText('タップ ／ Enter で もう一回！' + (bossReached ? '（ボスから）' : '（この へやから）'), W / 2, H - lb / 2 + 8);
    }
  }

  function render() {
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
    if (scene === 'title') { drawTitle(); filmFX(1.4); letterbox(); return; }
    if (scene === 'select') { drawSelect(); filmFX(0.8); return; }
    if (scene === 'leader') { drawLeader(); return; }
    if (scene === 'credits') { drawCredits(); return; }
    if (scene === 'lose') { drawLose(); return; }
    drawBackground();
    drawWorld();
    speedLines();
    if (scene === 'ko' && sceneT < 110) { ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.fillRect(0, 0, W, H); }
    if (p.state === 'superCharge') { ctx.fillStyle = 'rgba(0,20,60,.35)'; ctx.fillRect(0, 0, W, H); }
    if (flash > 0) { ctx.fillStyle = 'rgba(255,255,255,' + flash + ')'; ctx.fillRect(0, 0, W, H); }
    if (fade > 0) { ctx.fillStyle = 'rgba(0,0,0,' + fade + ')'; ctx.fillRect(0, 0, W, H); }
    drawBanner();
    filmFX(1);
    letterbox();
    drawHUD();
    drawSub();
    if ((scene === 'cut' || scene === 'roomCut' || scene === 'rescue') && cutF > 30) {
      ctx.font = '14px sans-serif'; ctx.textAlign = 'right'; ctx.fillStyle = 'rgba(255,255,255,.5)';
      ctx.fillText('タップ / Enter でスキップ ▶▶', W - 20, H - 16);
    }
  }

  // ---------- ループ ----------
  updateSelUI();
  newGame();
  setScene('title');
  let last = performance.now(), acc = 0;
  function frame(now) {
    const dt = Math.min(3, (now - last) / 16.667);
    last = now;
    sceneTick(dt);
    acc += dt * timeScale;
    let n = 0;
    while (acc >= 1 && n < 5) { acc -= 1; step(); n++; }
    if (n >= 5) acc = 0;
    render();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
